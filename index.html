da indústria. Em outubro, quando Ibovespa caiu quase 10% e NTN-Bs sangrou, o CDI entregou +1,07% — único ativo doméstico no positivo. Com Selic em 13,75% e todas as casas — inclusive a Santander Asset na Carta de novembro — recomendando pós-fixados em overweight, deixar capital parado sem um veículo eficiente de CDI é simplesmente abrir mão de carrego real com risco controlado num dos momentos mais defensivos do ciclo.\n\n---\n\n### 2. Versão 2 minutos (reunião curta)\n\n**Por que agora**\n\nOutubro foi o mês mais duro para ativos domésticos desde 2020: Ibovespa -9,88%, curva longa cruzando 15% a.a., real acima de R$ 5,40. Numa única sessão pós-eleição, o mercado precificou em horas o que levaria meses para se materializar. A Carta Mensal Santander Asset zerou posições direcionais em renda fixa ao longo de outubro e começa novembro do zero — cautela explícita. BTG, XP e Santander Advisory convergem no mesmo diagnóstico: **pós-fixados em overweight** são a âncora do portfólio enquanto o quadro fiscal segue em aberto. Quem não tinha essa âncora pagou o preço integral da realocação forçada.\n\n**Estratégia e diferencial**\n\nO DI Advanced opera como FIC, alocando 97% no SANT RF REF DI FI, que combina títulos públicos com crédito privado (CDBs, Letras Financeiras, debêntures) — estratégia preponderante em CDI com exposição a spread de crédito privado. O resultado é um fundo com volatilidade de 0,05% a.a. e 99,12% de meses positivos nos 113 meses de existência, com PL de R$ 20,3 bilhões — solidez e escala que reduzem risco operacional.\n\n**Desempenho e posicionamento**\n\nNos últimos 12 meses, o fundo acumulou **14,17% vs 14,25% do CDI** — praticamente no benchmark, como esperado de um referenciado de alta qualidade. No acumulado de 36 meses: **44,61% vs 44,15% do CDI** — entregou levemente acima do benchmark no horizonte mais longo. Em 2026 (até outubro): 11,64% vs CDI de 11,70% — desempenho aderente, dentro do perfil. ⚠️ Rentabilidade passada não garante resultado futuro. O fundo não busca superar o CDI — busca acompanhá-lo com eficiência de custo e liquidez máxima.\n\n**Pra quem é**\n\nPerfil conservador a moderado, horizonte de curtíssimo a médio prazo, aplicação mínima de R$ 100. Funciona tanto como reserva tática de liquidez quanto como âncora permanente do portfólio — o capital fica rendendo enquanto você aguarda a próxima oportunidade.\n\n**Custos e liquidez**\n\nTaxa de administração de **0,30% a.a.** (global máxima) — sem taxa de performance. Cotização e liquidação em **D+0**: aplica hoje, resgata hoje, cai na conta hoje. Para um fundo de R$ 20,3 bilhões, essa combinação de custo e liquidez é difícil de bater na classe.\n\n---\n\n### 3. Versão 5 minutos (conteúdo aditivo)\n\n**Cenário macro completo**\n\nTodas as quatro casas consultadas — Santander Asset, Santander Advisory, BTG e XP — convergem em três pontos sem exceção: Selic em 13,75% no Copom de novembro, pós-fixados como âncora defensiva, e risco fiscal como principal driver de incerteza. A Selic deve encerrar 2026 entre 13,50% (Santander Advisory, o mais otimista) e 13,75% (as demais casas) — e BTG e XP já não descartam reabertura de ciclo de aperto em 2027, com Selic podendo voltar para 13,75% no fim do próximo ano. Isso significa: o CDI remunera acima de 13,5% a.a. pelos próximos 12 a 24 meses no cenário base, e a única surpresa possível é **para cima** (Selic subindo), não para baixo. Para o DI Advanced, esse ambiente é o mais favorável possível — quanto mais tempo a Selic ficar elevada, maior o carrego acumulado pelo fundo.\n\n**Comportamento sob estresse**\n\nComo fundo de renda fixa referenciado ao CDI com parcela em crédito privado, o DI Advanced marca seus ativos a mercado. Em ambientes de abertura de spreads — como o que BTG e Santander Advisory alertam que voltou a ocorrer em outubro — a parcela de crédito privado pode, pontualmente, apresentar leve volatilidade negativa. Isso está refletido no número de volatilidade de 0,05% a.a.: o impacto é mínimo por design, mas existe. A proteção estrutural é o perfil conservador da carteira e a concentração em emissores de alta qualidade creditícia — a gestora Santander Asset mantém critério seletivo de crédito, que é exatamente o que as casas recomendam para novembro.\n\n**Mecânica tributária**\n\nPor ser fundo aberto de Renda Fixa, o DI Advanced tem **come-cotas semestral** — antecipação de IR em maio e novembro. A alíquota segue a tabela regressiva: 22,5% até 180 dias, caindo para 15% acima de 720 dias. Para o perfil de uso típico do fundo (reserva de liquidez ou carrego de curto/médio prazo), o come-cotas é o custo do modelo — e a taxa de 0,30% a.a. deixa gordura de eficiência em relação a fundos DI com taxas de 0,50% a 1,00% a.a. Para horizontes longos em que a eficiência tributária é crítica, outros veículos (debêntures incentivadas, CRI/CRA, previdência) podem ser complementares — mas não substituem a liquidez diária que este fundo oferece.\n\n**Comparação de classe**\n\nNa classe pós-fixada, o cliente tem essencialmente três alternativas: fundo DI (como este), CDB bancário e LCI/LCA. O CDB oferece IPCA de ISENÇÃO ZERO mas pode ter liquidez travada; LCI/LCA são isentas de IR mas têm carência mínima (90 dias) e emissão por prazo fixo — sem resgate imediato. O DI Advanced não compete na isenção, compete na liquidez total e na taxa de custo de 0,30% a.a. Para capital que precisa estar disponível em 24h, não há equivalente direto no mercado que combine esse custo com essa escala de gestão.\n\n---\n\n### 4. Objeções esperadas + respostas\n\n**\"Taxa de 0,30% parece baixa, mas ainda pago IR — não é melhor uma LCI isenta?\"**\nEntendo, muita gente sente a mesma coisa quando compara as alíquotas. O que descobrimos na prática é que a LCI isenta tem carência mínima de 90 dias e prazo fixo de emissão — você não sai antes do vencimento sem perder rentabilidade. Se você precisar do capital amanhã, o custo de oportunidade da LCI pode ser maior do que o IR do fundo DI. Para a parcela de liquidez tática da carteira — aquela que você quer disponível em 24h para aproveitar uma janela — o DI Advanced com 0,30% a.a. e D+0 tem uma proposta que a LCI não consegue replicar.\n\n**\"O fundo rende menos que o CDI — tem fundo DI que bate o benchmark.\"**\nEntendo a comparação. A diferença observada nos dados é de poucos centésimos de ponto — e para um fundo com 0,30% a.a. de taxa, qualquer retorno acima de 97% do CDI líquido já representa eficiência de gestão. Fundos DI que \"batem o CDI\" frequentemente tomam mais risco de crédito privado ou têm menor liquidez. Aqui a premissa é diferente: acompanhar o CDI com eficiência máxima, liquidez total e risco controlado — 99,12% de meses positivos em 113 meses é o resultado dessa escolha de design.\n\n**\"Com a abertura de spreads que o BTG e o Santander Advisory alertam, a parcela de crédito privado não é um risco agora?\"**\nÉ uma preocupação legítima — e é exatamente o ponto que a gestora monitora. Com volatilidade de 0,05% a.a., o fundo demonstra historicamente que a parcela de crédito privado está concentrada em emissores de alta qualidade com impacto mínimo na cota. O risco existe estruturalmente, mas está dimensionado. Se o cliente quer crédito privado zero, existem fundos de títulos públicos puros — mas abre mão do spread extra que sustenta parte do retorno acima do custo.\n\n**\"Já tenho um fundo DI parecido no banco.\"**\nEntendo. A questão não é ter \"um fundo DI\" — é ter o fundo certo. O que diferencia o DI Advanced é a combinação de R$ 20,3 bilhões de PL (escala que reduz custos operacionais e risco de liquidez do fundo), taxa global máxima de 0,30% a.a. e gestão Santander Asset com histórico de 113 meses. Vale comparar a taxa real que você está pagando no fundo atual — 10 bps de diferença em taxa numa posição de R$ 500 mil representam R$ 500 por ano indo para o custo, não para o seu retorno.\n\n**\"E se o cenário mudar e a Selic cair mais do que o esperado?\"**\nEssa é a pergunta certa. Olha: até BTG e XP projetam Selic acima de 12,50% no fim de 2027, e o próprio Santander Advisory — a visão mais otimista entre as casas — projeta 12,50%, não 10%. Mesmo no cenário mais benigno, o CDI segue entregando retorno real positivo por pelo menos 18 a 24 meses. Se e quando o ciclo de corte se consolidar de verdade, fazemos juntos a migração para outros ativos — prefixados ou IPCA+ de maior duration. Enquanto isso, esse fundo trabalha para você com risco próximo de zero.\n\n**\"Tem come-cotas — perco dinheiro em maio e novembro.\"**\nO come-cotas não é uma perda — é uma antecipação de IR que você pagaria de qualquer forma no resgate. O impacto real é o custo de oportunidade do valor antecipado ao governo (que deixa de render até o resgate). Em taxa de 0,30% a.a. e Selic a 13,75%, esse custo de oportunidade é marginal. Para quem tem horizonte longo e quer minimizar o efeito do come-cotas estruturalmente, existe o complemento via previdência ou debêntures incentivadas — mas isso é uma segunda camada de otimização, não razão para abrir mão da liquidez diária aqui.\n\n---\n\n### 5. Ângulo comercial por perfil API\n\n**Conservador:** âncora natural do portfólio — CDI a 13,75% com liquidez D+0, 0,30% a.a. e 99,12% de meses positivos é o pós-fixado mais eficiente disponível para quem precisa de capital acessível e retorno real sem volatilidade.\n\n**Moderado:** posição tática de liquidez e carrego — mantém o capital rendendo enquanto constrói gradualmente as posições em prefixados e IPCA+ intermediário recomendadas pela Carta Santander de novembro; peso ideal como colchão da carteira.\n\n**Balanceado:** alinhado ao overweight em pós-fixados da Carta Mensal Santander Asset de novembro — a fatia DI da carteira-modelo passa por aqui; use como reserva tática para aproveitar janelas de entrada em outros ativos quando o quadro fiscal se clarificar.\n\n**Arrojado:** produtividade do capital ocioso — enquanto monta as posições de maior risco (prefixados curtos, RV global), este fundo remunera o caixa a CDI menos 0,30% a.a., sem custo de oportunidade e sem travar liquidez.\n\n**Agressivo:** diversificação do passivo tático — carteiras concentradas em renda variável precisam de um colchão líquido que não dorme. O DI Advanced cumpre esse papel com eficiência máxima de custo, liberando capital para ser realocado em horas quando a oportunidade aparecer.", "ultima_atualizacao": "2026-11-17", "lamina": "laminas/26507128000130.pdf", "lamina_url_original": "https://www.santanderassetmanagement.com.br/pessoa-fisica/fundos-de-investimento/renda-fixa/di-advanced-responsabilidade-limitada", "lamina_tipo_url": "html", "lamina_periodo_ref": "2026-10"}, {"nome": "DI TOP RESP LIMITADA", "cnpj": "22918180000128", "gestora": "Santander Asset Management", "tipo": "RF", "classe_anbima": "Renda Fixa Duração Baixa Grau de Investimento", "classe_santander": "Reserva de Emergência", "taxa_adm": 0.006999999999999999, "taxa_perf": "Não há", "cotizacao": "D+0", "liquidacao": "D+0", "aplicacao_minima": 100.0, "publico_alvo": "Geral", "estrategia": "Fundo de renda fixa que busca acompanhar as variações do CDI, investindo preponderantemente em cotas de fundos de investimento referenciados DI (99% em SANT RF REF DI FI). Possui exposição a crédito privado como estratégia secundária, com foco em ativos de alta qualidade de crédito. Perfil conservador com baixa volatilidade (0,05% a.a. em 12 meses) e liquidez diária D+0.", "pros": ["Liquidez total D+0 — aplicação, resgate e crédito no mesmo dia", "Baixíssima volatilidade histórica (0,05% em 12 meses), com 99,25% dos meses positivos desde o início", "Taxa global máxima de 0,70% a.a., competitiva para a categoria", "Gestão especializada da Santander Asset Management com R$ 3,3 bi de PL médio no mês"], "contras": ["Rentabilidade sistematicamente abaixo do CDI (~96-97% do CDI em 2026 e 2025), penalizando o retorno líquido", "Exposição a risco de crédito privado, embora limitada, pode gerar volatilidade em momentos de estresse", "Come-cotas semestral (maio e novembro) reduz o efeito dos juros compostos ao longo do tempo", "Aplicação mínima baixa (R$ 100), mas rendimento líquido de IR pode ser inferior a alternativas soberanas puras para pequenos valores"], "isento_ir": null, "tem_come_cotas": null, "speech_comercial": "### 1. Elevator pitch (30 segundos)\n\nOlha, o DI TOP RESP LIMITADA é o fundo de renda fixa pós-fixado da Santander Asset — R$ 3,3 bi de PL, entrada com R$ 100, liquidez D+0 completa e taxa global máxima de 0,70% a.a. O cenário mudou: outubro provou que o CDI foi a única classe doméstica com retorno positivo no mês (+1,07%) enquanto Ibovespa caía quase 10% e a curva longa cruzava 15%. Com Selic em 13,75% e risco fiscal em aberto, pós-fixado com liquidez diária é a âncora que permite manter poder de compra e ainda ter capital disponível para aproveitar as oportunidades que vão aparecer quando o cenário se clarificar. Deixar o dinheiro parado sem gestão ativa é aceitar um carrego ainda menor, sem a segurança de uma casa que gerenciou o mês mais difícil desde 2020 sem desvio de rota.\n\n---\n\n### 2. Versão 2 minutos (reunião curta)\n\n**Por que AGORA**\n\nOutubro foi o maior teste de estresse dos últimos seis anos para o investidor brasileiro: Ibovespa -9,88%, real acima de R$ 5,40, curva de juros abrindo 136 bps nos vértices intermediários e NTN-Bs longas cruzando 15% a.a. No meio desse caos, o CDI entregou +1,07% — único ativo doméstico com sinal positivo no mês, confirmado por BTG, XP e Santander Asset. O Copom interrompeu o ciclo de cortes, Selic em 13,75%, e as quatro casas consultadas convergem: sem cortes imediatos à vista. O risco fiscal ainda não tem resolução — equipe econômica do novo governo indefinida, dívida bruta projetada em 88% do PIB em 2027 pelo BTG. Isso significa que o carrego do CDI permanece estruturalmente elevado por mais tempo, e a liquidez diária tem valor real: quem tiver o caixa disponível vai conseguir entrar nos prefixados e no IPCA+ no momento certo, não depois que o mercado fechar a janela.\n\n**Estratégia e diferencial**\n\nO DI TOP RESP LIMITADA investe 99% em cotas do fundo referenciado DI da própria Santander Asset, replicando com precisão o CDI. A gestão usa uma exposição secundária, limitada e de alta qualidade de crédito para gerar carrego adicional com controle de volatilidade — resultado: 0,05% a.a. de volatilidade histórica em 12 meses, com 99,25% dos meses positivos desde o início. Não é um fundo que tenta bater o CDI com risco; é o fundo que entrega o CDI com disciplina e consistência.\n\n**Desempenho e posicionamento**\n\nOs números são os seguintes, referência outubro/2026: em 12 meses, 13,71% contra CDI de 14,25%; em 24 meses, 28,73% contra 29,89%; em 36 meses, 42,85% contra 44,15%. O fundo captura entre 96 e 97% do CDI líquido da taxa — resultado direto do custo de 0,70% a.a. É uma relação linear: a taxa explica o gap. Em 2026, 11,26% contra CDI de 11,70%, diferença de 44 bps, dentro do que se espera da categoria. Rentabilidade passada não garante resultado futuro. Para um cliente que precisa de liquidez diária, consistência e gestão ativa da Santander Asset, esse custo é o preço do serviço — e é competitivo para a classe.\n\n**Para quem é**\n\nPúblico geral, qualquer perfil que precise de reserva tática com liquidez, ou qualquer carteira que esteja construindo posição em pós-fixados como âncora defensiva no cenário atual. Horizonte: pode ser curto (reserva operacional) ou estrutural (carrego de longo prazo enquanto o cenário não apresenta assimetria clara em outras classes). Aplicação mínima de R$ 100.\n\n**Custos e liquidez**\n\nTaxa de administração global máxima de 0,70% a.a., sem taxa de performance. Cotização e liquidação D+0 — aplica hoje, resgata hoje, cai na conta hoje. Não há lock-up, não há carência. É o instrumento certo para quem precisa de mobilidade.\n\n---\n\n### 3. Versão 5 minutos (conteúdo aditivo)\n\n**Cenário macro completo**\n\nAs quatro casas — Santander Asset, Santander Advisory, BTG e XP — convergem em três pontos sem exceção: Selic em 13,75% no Copom de novembro, pós-fixados em overweight como âncora defensiva, e risco fiscal como principal driver de incerteza à frente. A Carta Mensal Santander Asset descreve outubro como o mês mais disruptivo desde 2020 e posiciona a gestora iniciando novembro **sem exposição direcional em juros** — ou seja, a própria casa que gere o DI TOP começa o mês do zero, construindo posições com gradualismo conforme o cenário se clarifica. BTG encurtou duration de 6,1 para 4,9 anos; XP recomenda vencimentos curtos em prefixados; nenhuma casa está apostando na fechamento da curva longa. Projeção de Selic fim/2026: entre 13,50% (Santander Advisory, cenário mais benigno) e 13,75% (consenso das demais) — ou seja, mesmo no cenário mais otimista, o CDI remunera em torno de 13,50% pelo restante do ano. IPCA 2026 projetado entre 4,83% e 5,40%, acima da meta, com pressões de câmbio (real acima de R$ 5,40), petróleo Brent entre US$ 100 e US$ 115/barril e dinâmica fiscal ainda aberta. Para o DI TOP especificamente: Selic estruturalmente elevada por mais tempo é o melhor dos ambientes — o carrego permanece alto e a liquidez diária continua valendo o que sempre valeu em momentos de incerteza.\n\n**Comportamento sob estresse**\n\nFundos referenciados DI de Renda Fixa Duração Baixa têm, estruturalmente, o menor risco de volatilidade do espectro de renda fixa. Não carregam duration significativa, portanto não sofrem marcação a mercado de juros. O risco residual é o componente de crédito privado secundário: em ambientes de estresse severo, como o vivido em outubro, spreads de crédito privado tendem a abrir, o que pode gerar volatilidade marginal mesmo em fundos de alta qualidade de crédito — o próprio campo de contras da lâmina aponta isso com honestidade. Na prática, o histórico de 99,25% dos meses positivos desde o início mostra que esse risco não se materializou de forma significativa até agora. Mas o cliente deve saber: não é um fundo isento de risco, é um fundo de risco muito baixo e controlado.\n\n**Mecânica tributária**\n\nPor ser um fundo de Renda Fixa aberto (não previdência, não ações), o DI TOP RESP LIMITADA está sujeito a duas mecânicas tributárias: (1) **come-cotas semestral** em maio e novembro — antecipação de IR que reduz o efeito dos juros compostos ao longo do tempo, desvantagem estrutural em relação a LCI/LCA e fundos isentos; (2) **tabela regressiva de IR** sobre o ganho no resgate: 22,5% até 180 dias, 20% de 181 a 360 dias, 17,5% de 361 a 720 dias, 15% acima de 720 dias. Para horizontes mais longos e valores maiores, o cliente deve considerar essa alíquota na comparação com alternativas soberanas ou isentas. Para reserva de liquidez e mobilidade tática, o fundo se justifica pelo carrego e pela liquidez D+0 — a tributação é o trade-off que o cliente aceita pela conveniência e pela gestão profissional.\n\n**Comparação de classe**\n\nO DI TOP compete diretamente com fundos DI de outras gestoras e com CDBs de liquidez diária. A taxa de 0,70% a.a. é competitiva para um fundo gerido pela Santander Asset com R$ 3,3 bi de PL — fundos de gestoras menores ou de distribuição ampla frequentemente operam em custo similar ou superior, sem a mesma escala e consistência. A desvantagem estrutural em relação a LCI/LCA é a tributação: produtos isentos de IR entregam retorno líquido maior para o mesmo carrego bruto, especialmente em horizontes acima de 90 dias. O DI TOP não compete com LCI/LCA em retorno líquido para quem tem prazo — ele compete em liquidez diária real (D+0 versus D+30 ou D+90 de boa parte dos produtos isentos) e em gestão ativa de um componente de crédito supervisionado pela Santander Asset.\n\n---\n\n### 4. Objeções esperadas + respostas\n\n**\"O fundo rende só 96–97% do CDI — é melhor ficar no CDI puro.\"**\nEntendo esse raciocínio — muita gente sente a mesma coisa ao ver o gap. O que a maioria descobre, no entanto, é que \"CDI puro\" na prática significa CDB de banco médio sem gestão ativa ou conta remunerada que não garante o mesmo nível de qualidade de crédito e liquidez. Os 44 bps de diferença em 2026 são a taxa de 0,70% a.a. — não há alfa negativo, não há má gestão. É o custo de ter gestão profissional da Santander Asset, liquidez D+0 real e 99,25% dos meses positivos desde o início. A pergunta certa não é \"perco para o CDI bruto?\", é \"o que estou recebendo pelos 0,70%?\" — e aqui a resposta é: estrutura, consistência e mobilidade.\n\n**\"Tem come-cotas — prefiro LCI ou LCA.\"**\nFaz sentido essa preocupação, e o come-cotas é de fato um drag real em horizontes longos. A questão é a liquidez: LCI e LCA de qualidade têm carência mínima de 90 dias, frequentemente de 12 meses para as melhores taxas. O DI TOP resgata e credita no mesmo dia. Para quem usa esse fundo como reserva tática — capital que pode precisar se mover para prefixados ou IPCA+ quando a janela abrir — a liquidez D+0 não tem preço equivalente num produto de prazo. Se o objetivo é alocação de longo prazo sem necessidade de mobilidade, a LCI/LCA é uma comparação legítima e pode ser mais eficiente em retorno líquido; para o componente de liquidez da carteira, o DI TOP é o instrumento correto.\n\n**\"O cenário pode mudar e a Selic cair — o DI perde atratividade.\"**\nEssa é a objeção mais legítima do ponto de vista macro. O que as quatro casas consultadas indicam, no entanto, é que não há consenso de queda iminente — BTG e XP não descartam reabertura do ciclo de aperto; Santander Advisory, o mais otimista, projeta apenas um corte adicional até dezembro/2026. Mesmo que a Selic ceda para 12,50% em 2027 (cenário mais benigno), o DI TOP ainda entrega carrego real positivo descontado o IPCA projetado. E se a Selic subir, o fundo se beneficia automaticamente, sem perda de capital — ao contrário de quem está posicionado em prefixados ou NTN-Bs longas.\n\n**\"Já tenho um fundo DI na carteira — para que mais um?\"**\nDepende do custo e da liquidez do que você já tem. Se o fundo atual tem taxa acima de 1,00% a.a. ou liquidez D+1/D+2, o DI TOP entrega mais pelo mesmo risco. Se já tem 0,70% ou menos com D+0, faz sentido avaliar se há duplicidade real. O que posso verificar com você agora é: qual a taxa global do fundo atual e qual a liquidação efetiva — a comparação é objetiva.\n\n**\"Com a situação fiscal incerta, não prefiro ficar em algo mais seguro, como Tesouro Selic?\"**\nO Tesouro Selic é soberano — sem risco de crédito privado, o que é uma vantagem estrutural. O DI TOP carrega uma exposição residual a crédito privado de alta qualidade, que é o componente de risco marginal. Para quem quer zero risco de crédito, o Tesouro Selic direto é a referência correta. A diferença prática: o DI TOP tem gestão ativa da Santander Asset monitorando esse componente de crédito continuamente, liquidez D+0 imediata via plataforma sem necessidade de acesso ao Tesouro Direto, e PL de R$ 3,3 bi que confere escala operacional. Para o cliente que já usa fundos como veículo e valoriza essa camada de gestão, o DI TOP é o equivalente funcional com custo competitivo.\n\n**\"Taxa de 0,70% parece alta para um fundo que só replica o CDI.\"**\nOlha, é uma objeção justa — vale contextualizar. Para fundos referenciados DI com liquidez diária e gestão da Santander Asset, 0,70% é o teto global declarado; na prática, a categoria ANBIMA de Duração Baixa Grau de Investimento tem fundos operando entre 0,30% e 1,50% a.a., dependendo do canal e do PL. O DI TOP está dentro do intervalo competitivo para a escala e o serviço que entrega. A taxa de performance é zero — sem surpresa na rentabilidade. E o track record de 99,25% dos meses positivos desde o início valida que o custo não está sendo aplicado ineficientemente.\n\n---\n\n### 5. Ângulo comercial por perfil API\n\n- **Conservador:** ✅ Este é o produto central para o perfil conservador no cenário atual — CDI em 13,75%, volatilidade de 0,05% a.a. e liquidez D+0 são exatamente o que a Carta Mensal Santander Asset recomenda como âncora de portfólio em novembro. Posição estrutural, não tática.\n\n- **Moderado:** A reserva pós-fixada do moderado precisa de liquidez real para aproveitar a construção gradual em prefixados e IPCA+ que o advisory recomenda — o DI TOP é o veículo certo para esse caixa enquanto o cenário se clarifica.\n\n- **Balanceado:** A Carta Santander Asset inicia novembro sem exposição direcional em juros e recomenda gradualismo — o DI TOP é o pulmão da carteira balanceada: carrega o CDI com disciplina enquanto as oportunidades em prefixados e IPCA+", "ultima_atualizacao": "2026-11-17", "lamina": "laminas/22918180000128.pdf", "lamina_url_original": "https://www.santanderassetmanagement.com.br/pessoa-fisica/fundos-de-investimento/renda-fixa/di-top", "lamina_tipo_url": "html", "lamina_periodo_ref": "2026-10"}, {"nome": "DI VIP RESP LIMITADA", "cnpj": "02910278000121", "gestora": "Santander Asset Management", "tipo": "RF", "classe_anbima": "Renda Fixa Duração Baixa Grau de Investimento", "classe_santander": "Reserva de Emergência", "taxa_adm": 0.005, "taxa_perf": "Não há", "cotizacao": "D+0", "liquidacao": "D+0", "aplicacao_minima": 100.0, "publico_alvo": "Geral", "estrategia": "Fundo que investe por meio de outros fundos em títulos de renda fixa públicos e privados (CDBs, Letras Financeiras, Debêntures) buscando acompanhar o CDI. A carteira é composta majoritariamente pelo SANT RF REF DI FI (97%), com baixa volatilidade e foco em ativos de alta qualidade de crédito. Perfil conservador, com liquidez diária e gestão especializada no mercado de crédito.", "pros": ["Liquidez diária com aplicação, resgate e crédito todos em D+0", "Baixíssima volatilidade histórica (0,05% a.a. em 12 meses) e 99,40% de meses positivos desde o início", "Taxa global máxima de 0,50% a.a., competitiva para a categoria", "Gestão Santander Asset Management com sólida experiência em crédito privado"], "contras": ["Rentabilidade sistematicamente abaixo do CDI (~98% do CDI em 2025 e 2026), com erosão pelo come-cotas semestral", "Exposição a risco de crédito privado (CDBs, Letras Financeiras, Debêntures) mesmo que de alta qualidade", "Risco de concentração: 97% da carteira alocada em um único fundo (SANT RF REF DI FI)", "Sujeito a IOF em resgates em prazo inferior a 30 dias e come-cotas semestrais (maio e novembro)"], "isento_ir": null, "tem_come_cotas": null, "speech_comercial": "### 1. Elevator pitch (30 segundos)\n\nOlha, o DI VIP RESP LIMITADA é um fundo pós-fixado da Santander Asset, com liquidez total em D+0 e taxa de 0,50% a.a. — uma das mais competitivas da categoria. Em outubro, enquanto Ibovespa caía quase 10%, prefixados sofriam e até IPCA+ fechou no vermelho, o CDI foi a única classe doméstica que rendeu positivo: +1,07% no mês. Com Selic em 13,75% e cenário fiscal em aberto, toda casa relevante — BTG, XP, Santander Asset — está em overweight em pós-fixados agora. Manter capital fora desse carrego enquanto o quadro se resolve é deixar dinheiro na mesa sem motivo.\n\n---\n\n### 2. Versão 2 minutos (reunião curta)\n\n**Por que agora**\n\nOutubro foi o mês mais duro para ativos domésticos desde 2020. A reeleição de Lula desencadeou reprecificação violenta: curva DI abriu 93 a 136 bps nos vértices intermediários, juros de 10 anos avançaram ~250 bps numa única sessão e o Copom interrompeu o ciclo de cortes, mantendo a Selic em 13,75% com comunicado explicitando período prolongado de estabilidade. O CDI entregou +1,07% em outubro — única classe doméstica com retorno positivo no mês. A Carta Mensal da Santander Asset zerou posições direcionais em juros e começa novembro sem viés — a recomendação é preservar capital e manter liquidez enquanto o cenário fiscal não apresenta sinalização crível. Pós-fixados com liquidez diária são exatamente o que esse momento pede.\n\n**Estratégia e diferencial**\n\nO DI VIP investe 97% em um fundo master gerido pela própria Santander Asset — o SANT RF REF DI FI —, composto por LFTs, operações compromissadas, Letras Financeiras e Debêntures de alta qualidade de crédito, todos pós-fixados. O resultado é um fundo com volatilidade histórica de 0,05% a.a. em 12 meses e 99,40% de meses positivos desde o início. Não há surpresa de duration, não há risco de marcação a mercado em movimentos bruscos de curva — o que outubro demonstrou valer muito.\n\n**Desempenho e posicionamento**\n\nNos últimos 12 meses o fundo acumulou 13,95% contra 14,25% do CDI — ou seja, entrega ~98% do CDI líquido da taxa de administração. A diferença para o índice reflete o custo do come-cotas semestral e a taxa de gestão, estruturais nessa classe. Rentabilidade passada não garante resultado futuro. Para quem busca ancoragem de carteira e liquidez imediata, essa eficiência é consistente com o objetivo declarado do fundo.\n\n**Para quem é**\n\nPerfil Conservador a Moderado, horizonte de curtíssimo a curto prazo — pode ser a reserva tática para realocações futuras em prefixados ou IPCA+ quando o cenário fiscal se clarificar. Ticket mínimo de R$ 100, sem restrição de público.\n\n**Custos e liquidez**\n\nTaxa de administração de 0,50% a.a., sem taxa de performance. Aplicação, resgate e crédito todos em D+0 — liquidez imediata, sem custo de saída além do IOF proporcional em resgates antes de 30 dias.\n\n---\n\n### 3. Versão 5 minutos (reunião profunda — conteúdo aditivo)\n\n**Cenário macro completo**\n\nTodas as quatro casas consultadas — Santander Asset, Santander Advisory, BTG e XP — convergem em overweight ou sobreponderar pós-fixados agora. A tese é simples: Selic em 13,75%, sem corte à vista, num ambiente de incerteza fiscal crescente. BTG projeta dívida bruta subindo de 83,3% para 88,0% do PIB entre 2026 e 2027; XP estima ~R$ 83 bilhões adicionais no orçamento de 2027 sem contrapartida. Com IPCA projetado entre 4,83% e 5,40% para 2026, o juro real do CDI segue expressivo — acima de 8% a.a. em termos reais dependendo da casa —, e o Santander Advisory, a casa mais otimista entre as quatro, ainda assim projeta Selic mínima de 13,50% no fim do ano. Em nenhum cenário das casas consultadas o CDI perde tração de forma relevante nos próximos meses. Isso amarra diretamente no DI VIP: o fundo captura esse carrego com eficiência de gestão e liquidez total — é o instrumento certo para o posicionamento que o mercado inteiro recomenda.\n\n**Comportamento sob estresse**\n\nFundos de RF referenciados ao CDI com crédito privado de alta qualidade são estruturalmente os mais defensivos dentro da renda fixa. O risco principal é o de crédito — se spreads se abrirem de forma generalizada e emissores enfrentarem deterioração, fundos que marcam a mercado sofrem temporariamente. Outubro não penalizou o DI VIP exatamente porque ele não carrega duration de juros longa; a abertura da curva que destruiu prefixados e IPCA+ longo não o afetou. O risco de concentração — 97% em um único fundo master — merece atenção, mas está dentro do ecossistema Santander Asset com gestão ativa da carteira subjacente.\n\n**Mecânica tributária**\n\nFundo de Renda Fixa aberto: sujeito ao come-cotas semestral em maio e novembro, com alíquota de 15% sobre os rendimentos acumulados. Tabela regressiva de IR no resgate: 22,5% até 180 dias, reduzindo até 15% acima de 720 dias. IOF proporcional em resgates antes de 30 dias. Esses custos estão precificados no resultado histórico de ~98% do CDI — não são surpresa, são estruturais da classe.\n\n**Comparação de classe**\n\nDentro dos pós-fixados, as alternativas usuais são LCI/LCA (isentas de IR, mas com carência e liquidez reduzida) e CDBs bancários de alta liquidez (sem come-cotas, mas com risco de crédito concentrado num emissor). O DI VIP entrega gestão profissional da Santander Asset, diversificação entre emissores de alta qualidade e liquidez D+0 — virtudes que LCI/LCA de prazos longos não oferecem quando você precisa se mover rápido, que é exatamente o cenário do momento.\n\n---\n\n### 4. Objeções esperadas + respostas\n\n**\"Esse fundo rende menos que o CDI — por que não investir direto num CDB 100%+ CDI?\"**\n\nEntendo. Muita gente sente isso quando compara os números brutos. O que descobri, olhando o quadro completo: um CDB 100% CDI de banco médio concentra risco num único emissor. O DI VIP diversifica entre CDBs, Letras Financeiras e Debêntures de alta qualidade, com gestão ativa da Santander Asset monitorando crédito em tempo real. A diferença para o CDI — ~2% de eficiência — reflete taxa de administração e come-cotas, não ineficiência de carteira. Pra um CDB 100% CDI de banco de primeira linha, a comparação líquida de IR e come-cotas tende a ficar muito próxima, com vantagem da gestão diversificada e da liquidez imediata do fundo.\n\n**\"Come-cotas semestral corrói o rendimento — prefiro um produto sem esse efeito.\"**\n\nFaz sentido como ponto de atenção. O que vale lembrar: o come-cotas antecipa IR, mas não cria imposto adicional — é uma antecipação compulsória de 15%, que reduz o efeito dos juros compostos no longo prazo. Para horizontes curtos ou para capital que ficará em movimento tático — que é o uso recomendado deste fundo no cenário atual —, o impacto do come-cotas é mínimo e não muda a lógica de alocação. Quem busca eficiência tributária máxima num pós-fixado com horizonte longo deve avaliar LCI/LCA; mas aí perde a liquidez D+0 que hoje é a principal vantagem competitiva do fundo.\n\n**\"Com Selic tão alta, não faz mais sentido ficar em prefixados agora que a curva abriu?\"**\n\nA tese dos prefixados é atraente — curva acima de 15% cria ponto de entrada historicamente relevante. Mas todas as casas, incluindo a própria Santander Asset, estão construindo exposição de forma gradual, não posicionando de uma vez. BTG e XP explicitamente não descartam reabertura do ciclo de aperto se a inflação não ceder. O DI VIP funciona como a base de liquidez que permite construir essa posição sem pressa — você captura o carrego do CDI enquanto espera clareza fiscal, e migra para prefixados no ritmo certo, sem ficar refém do timing.\n\n**\"Risco de concentração em 97% num único fundo master me preocupa.\"**\n\nÉ uma preocupação legítima — e é um contra documentado na lâmina. O que mitiga: o fundo master é o SANT RF REF DI FI, gerido pela mesma Santander Asset, com carteira diversificada entre diferentes emissores e tipos de ativos pós-fixados. A concentração é de gestora e mandato, não de crédito num único emissor. O risco real seria uma falha sistêmica da própria Santander Asset — cenário que, dados os controles regulatórios e o tamanho da instituição, é de ordem muito diferente do risco de um único devedor concentrado.\n\n**\"Taxa de 0,50% a.a. ainda parece alta para um fundo que basicamente segue o CDI.\"**\n\nOlha, em termos absolutos é uma taxa competitiva para a categoria — fundos de RF referenciados DI de gestoras de grande porte costumam operar nesse intervalo. O que você paga é pela plataforma de gestão de crédito da Santander Asset, pela seleção e monitoramento contínuo dos emissores e pela liquidez D+0. Se o objetivo é minimizar custo ao máximo e abrir mão da gestão, um Tesouro Selic com custódia direta é a comparação correta — mas aí o custo de oportunidade é a seleção de crédito privado que potencialmente adiciona retorno acima da LFT pura.\n\n---\n\n### 5. Ângulo comercial por perfil API\n\n**Conservador:** ✅ Principal âncora de carteira no momento — CDI a 13,75% com liquidez D+0 é o melhor retorno ajustado ao risco disponível no mercado doméstico hoje, e a única classe que ficou positiva em outubro.\n\n**Moderado:** Base de liquidez tática — mantém o carrego do CDI enquanto você constrói gradualmente a posição em prefixados ou IPCA+ intermediário conforme o cenário fiscal vai se clarificando.\n\n**Balanceado:** Alinhado ao overweight em pós-fixados da carteira-modelo Santander de novembro — use o DI VIP para a parcela de liquidez ativa do perfil, sem amarrar capital em instrumentos de menor mobilidade.\n\n**Arrojado:** Caixa estratégico de alta produtividade — rende mais que deixar parado em conta corrente e dá a agilidade de entrar em oportunidades táticas (prefixados curtos, crédito privado seletivo, RV global) quando o timing for certo.\n\n**Agressivo:** ❌ Não é o veículo principal para esse perfil — mas pode cumprir o papel de reserva de mobilidade numa carteira concentrada em RV global e ativos de risco, garantindo que você tem liquidez imediata pra rebalancear sem vender ativo de risco na baixa.", "ultima_atualizacao": "2026-11-17", "lamina": "laminas/02910278000121.pdf", "lamina_url_original": "https://www.santander.com.br/document/wps/L_SCSB0091.pdf", "lamina_tipo_url": "pdf", "lamina_periodo_ref": "2026-10"}, {"nome": "RENDA FIXA CRÉDITO PRIVADO VINTAGE LP CIC RESP LIMITADA", "cnpj": "08545860000112", "gestora": "Santander Asset Management", "tipo": "RF", "classe_anbima": "Renda Fixa Duração Livre Grau de Investimento", "classe_santander": "Reserva de Emergência", "taxa_adm": 0.004, "taxa_perf": "Não há", "cotizacao": "D+0", "liquidacao": "D+1", "aplicacao_minima": 100.0, "publico_alvo": "Geral", "estrategia": "Fundo de fundos que investe majoritariamente em títulos privados de baixo risco de crédito (CDBs, Letras Financeiras, Debêntures), diversificando entre crédito bancário e corporativo em diferentes emissores, setores e prazos. Busca rentabilidade superior à dos títulos públicos e aplicações pós-fixadas tradicionais, com gestão ativa e rebalanceamento contínuo do portfólio conforme oportunidades de mercado. Pertence à família de crédito privado de perfil de risco intermediário.", "pros": ["Histórico consistente de 207 meses positivos em 210 meses de existência (98,57% de meses positivos)", "Carteira diversificada entre crédito bancário e corporativo de baixo risco, reduzindo concentração", "Taxa global máxima baixa de 0,40% a.a., preservando maior parcela do retorno bruto para o cotista", "PL robusto (R$ 2,7 bi médio no mês), indicando liquidez e solidez operacional"], "contras": ["Exposição a risco de crédito privado — eventuais inadim ativo em setores e prazos diferentes — estrutura de fundo de fundos com rebalanceamento ativo conforme oportunidades. O diferencial operacional é a taxa: 0,40% a.a. globais máximos, o que preserva a maior parte do retorno bruto para o cotista enquanto a gestão ativa da Santander Asset busca consistência.\n\n**Desempenho e posicionamento**\n\nO fundo acumula +14,65% em 2025, +14,18% nos últimos 12 meses e +45,57% em 36 meses (CDI no mesmo período: +44,15%) — geração de alfa consistente no horizonte de 3 anos. No horizonte mais curto, 12 meses e 2026, o fundo ficou ligeiramente abaixo do CDI (12M: 14,18% vs CDI 14,25%; 2026 até outubro: 11,65% vs CDI 11,70%) — spread negativo pequeno, coerente com um ambiente de abertura de spreads de crédito em outubro. Essa proximidade ao benchmark num mês de estresse é, na verdade, argumento de qualidade da carteira: a diversificação entre emissores bancários e corporativos amorteceu o impacto. *Rentabilidade passada não garante resultado futuro.*\n\nO historial de consistência é ainda mais eloquente: 207 meses positivos em 210 de existência — 98,57% de aproveitamento.\n\n**Para quem é**\n\nPúblico geral, aplicação a partir de R$ 100, horizonte de médio prazo. Faz mais sentido para carteiras que precisam de carrego de qualidade, liquidez (D+1 no crédito) e baixa volatilidade como âncora defensiva — em linha com o posicionamento overweight em pós-fixados que a Santander Asset recomenda para novembro.\n\n**Custos e liquidez**\n\nTaxa de administração global máxima de 0,40% a.a., sem taxa de performance. Cotização D+0, liquidação D+1. Estrutura de custos competitiva para a classe.\n\n---\n\n### 3. Versão 5 minutos (conteúdo aditivo)\n\n**Cenário macro completo**\n\nAs quatro casas consultadas — Santander Asset, BTG, XP e Santander Advisory — chegam a novembro com consenso incomum: pós-fixados overweight, RV Brasil cautelosa, crédito privado neutro/seletivo com viés de qualidade. A Carta Mensal Santander Asset descreve outubro como um mês de reprecificação violenta que **exigiu** uma mudança de postura — a gestora zerou posições direcionais em juros ao longo do mês e começa novembro sem exposição direcional em renda fixa, o que é raro e significativo. Para o crédito privado especificamente, Santander Advisory alerta que spreads voltaram a abrir — marcação a mercado penaliza quem está posicionado em emissores de qualidade inferior —, enquanto XP mantém postura positiva/seletiva ancorada no carrego da Selic elevada por mais tempo. O denominador comum das duas leituras é o mesmo: **qualidade do emissor e diversificação** são o filtro que separa os portfólios que atravessam esse ambiente intactos dos que sofrem. É exatamente o que a estrutura deste fundo entrega — CDBs, Letras Financeiras e Debêntures de baixo risco, em emissores e setores distintos, com PL médio de R$ 2,7 bilhões no mês dando solidez operacional.\n\n**Comportamento sob estresse**\n\nFundos de crédito privado marcam a mercado: quando spreads se abrem — como ocorreu em outubro com a reprecificação pós-eleitoral —, os preços dos títulos caem antes do vencimento, e o fundo pode registrar meses próximos ou abaixo do CDI, como foi o caso em outubro/2026 (11,65% vs CDI 11,70% no acumulado do ano). Esse é o risco estrutural da classe, e ele é real. O que mitiga aqui é a diversificação entre bancário e corporativo, a gestão ativa com rebalanceamento contínuo e o perfil de baixo risco de crédito dos emissores — carteira construída para absorver abertura de spreads sem ruptura. O risco de cauda (inadimplência de emissor) existe e está declarado nos contras; a estrutura diversificada reduz a concentração por nome, mas não elimina a classe de risco.\n\n**Mecânica tributária**\n\nComo fundo de Renda Fixa aberto, está sujeito ao **come-cotas semestral** (maio e novembro) — antecipação de IR que corrói o efeito dos juros compostos ao longo do tempo. A alíquota segue a tabela regressiva: 22,5% (até 180 dias) → 15% (acima de 720 dias). Para horizonte tetura de fundo de fundos. O que mitiga é que o veículo de destino é gerido pela mesma gestora — Santander Asset — com carteira de crédito diversificada entre emissores bancários e corporativos de baixo risco. O risco não é de crédito do fundo investido, é de concentração de gestão e estratégia num único veículo. Para quem já tem outros fundos de crédito privado na carteira com gestoras diferentes, esse fundo funciona como complemento; para quem está construindo exposição a crédito do zero, é uma posição eficiente.\n\n**\"Come-cotas em novembro já vai me prejudicar agora.\"**\n\nSim, o come-cotas de novembro já está no calendário — é uma consideração de timing real. Para cotistas que estão entrando agora, o impacto é proporcional ao tempo de permanência antes do evento (poucos dias = impacto marginal sobre o rendimento do período). Para quem tem posições em outros fundos de RF com come-cotas de novembro e está pensando em consolidar, faz sentido avaliar o momento. O que não muda é que, após o come-cotas, o clock tributário reinicia — e a alíquota de longo prazo de 15% é o destino natural de quem mantém a posição por mais de 2 anos.\n\n**\"E se o cenário fiscal piorar e os spreads abrirem mais?\"**\n\nEssa é exatamente a conversa que BTG e Santander Advisory estão tendo agora — spreads já voltaram a abrir em outubro. Se o quadro fiscal se deteriorar adicionalmente, fundos de crédito privado vão sentir via marcação a mercado antes de qualquer inadimplência. O contraponto estrutural aqui é duplo: primeiro, a Selic em 13,75% (ou mais, se o ciclo reabrir) eleva o carrego bruto de todos os títulos CDI+ da carteira, o que compensa parcialmente a abertura de spread; segundo, a carteira de baixo risco de crédito — CDBs e LFs bancárias, debêntures investment grade — tem spread historicamente mais estável do que crédito high yield. O risco existe; é por isso que a posição é parte da carteira, não a carteira inteira.\n\n**\"Não seria melhor ficar só em CDI puro, mais líquido, sem risco de crédito?\"**\n\nFaz sentido como âncora de liquidez imediata — e o próprio posicionamento Santander recomenda pós-fixados overweight agora. A diferença é que CDI puro (LCI, CDB simples, fundo DI sem crédito) não entrega o prêmio de crédito que este fundo captura — no horizonte de 36 meses, esse prêmio foi de 1,42 p.p. sobre o CDI. Para a parcela da carteira que tem horizonte de 2 anos ou mais e não precisa de liquidez imediata, trocar o prêmio de crédito por CDI puro é pagar por uma liquidez que você não vai usar. A estrutura ideal combina os dois: CDI puro para a reserva de oportunidade de curto prazo, e este fundo para o carrego de médio prazo.\n\n---\n\n### 5. Ângulo comercial por perfil API\n\n**Conservador:** A consistência de 207/210 meses positivos e o custo de 0,40% a.a. fazem deste fundo uma alternativa defensiva de qualidade dentro da classe pós-fixada — adequado como complemento à âncora de liquidez, desde que o cliente entenda o risco de crédito privado e o come-cotas semestral.\n\n**Moderado:** Núcleo da alocação pós-fixada para novembro: carrego competitivo, diversificação entre bancário e corporativo, e gestão ativa da Santander Asset entregando 1,42 p.p. acima do CDI em 36 meses — com custo que não come esse alfa.\n\n**Balanceado:** Alinha ao overweight em pós-fixados recomendado pela Santander Asset para novembro; substitui exposição a crédito privado de qualidade inferior que pode estar sofrendo mais com a abertura de spreads, sem abrir mão do carrego da Selic elevada.\n\n**Arrojado:** Produtividade de capital na parcela defensiva: taxa de 0,40% a.a. libera mais retorno líquido para o cotista do que a média da categoria, permitindo alocar o \"custo poupado\" em outras posições de maior risco na carteira.\n\n**Agressivo:** Âncora de liquidez e carrego dentro de uma carteira concentrada em risco — a saída D+1 e o track record de 98,57% de meses positivos oferecem a base estável que permite sustentar as posições de maior volatilidade sem p   let html = `<div class="chip ${filtroClasse===null?'ativo':''}" onclick="setFiltro(null)">Todos</div>`;
  for (const c of CLASSES) {
    html += `<div class="chip ${filtroClasse===c?'ativo':''}" onclick="setFiltro('${esc(c)}')">${esc(c)}</div>`;
  }
  cont.innerHTML = html;
}
function setFiltro(c) { filtroClasse = c; render(); }

function fundoVisivel(f) {
  if (filtroClasse && f.classe_santander !== filtroClasse) return false;
  if (termoBusca) {
    const alvo = (f.nome + " " + f.gestora + " " + f.estrategia + " " + f.classe_santander).toLowerCase();
    if (!alvo.includes(termoBusca)) return false;
  }
  return true;
}

function cardHTML(f, idx) {
  let fiscal = "";
  if (f.isento_ir === true) fiscal += `<span class="tag-fiscal tag-isento">Isento IR</span>`;
  if (f.tem_come_cotas === true) fiscal += `<span class="tag-fiscal tag-comecota">Come-cotas</span>`;

  let body = `<div class="linha"><span class="k">Gestora</span><span class="v">${esc(f.gestora)||"—"}</span></div>`;
  body += `<div class="linha"><span class="k">Classe ANBIMA</span><span class="v">${esc(f.classe_anbima)||"—"}</span></div>`;
  body += `<div class="linha"><span class="k">Taxa adm</span><span class="v">${fmtPct(f.taxa_adm)}</span></div>`;
  if (f.taxa_perf) body += `<div class="linha"><span class="k">Taxa perf</span><span class="v">${esc(f.taxa_perf)}</span></div>`;
  if (f.cotizacao) body += `<div class="linha"><span class="k">Cotização</span><span class="v">${esc(f.cotizacao)}</span></div>`;
  if (f.liquidacao) body += `<div class="linha"><span class="k">Liquidação</span><span class="v">${esc(f.liquidacao)}</span></div>`;
  if (f.aplicacao_minima) body += `<div class="linha"><span class="k">Aplic. mínima</span><span class="v">${fmtBRL(f.aplicacao_minima)}</span></div>`;
  if (f.publico_alvo) body += `<div class="linha"><span class="k">Público</span><span class="v">${esc(f.publico_alvo)}</span></div>`;
  if (f.cnpj) body += `<div class="linha"><span class="k">CNPJ</span><span class="v">${esc(f.cnpj)}</span></div>`;
  if (fiscal) body += `<div style="margin-top:8px">${fiscal}</div>`;
  {
    const local = (f.lamina && /^laminas\/[A-Za-z0-9_]+\.pdf$/.test(f.lamina)) ? f.lamina : "";
    const orig = (f.lamina_url_original && /^https?:\/\//.test(f.lamina_url_original)) ? f.lamina_url_original : "";
    const ref = fmtRef(f.lamina_periodo_ref);
    if (local || orig) {
      const href = local || orig;
      const rot = local ? "📄 Abrir lâmina (PDF)" : "📄 Lâmina no site Santander";
      body += `<div><a class="btn-lamina" href="${escAttr(href)}" target="_blank" rel="noopener noreferrer">${rot}</a>${ref ? `<span class="lamina-ref">ref. ${ref}</span>` : ""}</div>`;
      if (local && orig) body += `<div class="lamina-ref" style="margin-left:0"><a href="${escAttr(orig)}" target="_blank" rel="noopener noreferrer">link original Santander</a></div>`;
    }
  }

  if (f.estrategia) body += `<div class="secao-titulo">Estratégia</div><div style="font-size:13.5px">${esc(f.estrategia)}</div>`;
  if (f.pros && f.pros.length) {
    body += `<div class="secao-titulo">Prós</div><ul class="pros pros-contras">`;
    for (const p of f.pros) body += `<li>${esc(p)}</li>`;
    body += `</ul>`;
  }
  if (f.contras && f.contras.length) {
    body += `<div class="secao-titulo">Contras</div><ul class="contras pros-contras">`;
    for (const c of f.contras) body += `<li>${esc(c)}</li>`;
    body += `</ul>`;
  }
  if (f.speech_comercial) {
    body += `<div class="secao-titulo">🎤 Speech comercial</div><div class="speech">${mdLeve(f.speech_comercial)}</div>`;
  }

  return `<div class="card" id="card${idx}">
    <div class="card-head" onclick="toggle(${idx})">
      <div>
        <div class="card-nome">${esc(f.nome)}</div>
        <div class="card-meta">${esc(f.gestora)||"—"} · taxa ${fmtPct(f.taxa_adm)}${f.speech_comercial?" · 🎤 speech":""}</div>
        <span class="badge">${esc(f.classe_santander)}</span>
      </div>
      <span class="seta">▶</span>
    </div>
    <div class="card-body">${body}</div>
  </div>`;
}

function toggle(idx) {
  document.getElementById("card"+idx).classList.toggle("aberto");
}

function render() {
  const lista = document.getElementById("lista");
  const visiveis = FUNDOS.filter(fundoVisivel);
  document.getElementById("contador").textContent =
    visiveis.length + " fundo(s)" + (filtroClasse ? " em " + filtroClasse : "");
  if (!visiveis.length) {
    lista.innerHTML = `<div class="vazio">Nenhum fundo encontrado.<br>Tente outra busca ou filtro.</div>`;
    return;
  }
  lista.innerHTML = visiveis.map((f, i) => cardHTML(f, FUNDOS.indexOf(f))).join("");
}

document.getElementById("busca").addEventListener("input", e => {
  termoBusca = e.target.value.trim().toLowerCase();
  render();
});

renderFiltros();
render();
</script>
</body>
</html>
