e o GO Global adota via Robeco. A implicação prática: um fundo bottom-up com 30 a 40 empresas de alta qualidade está estruturalmente posicionado para capturar essa transição melhor do que um ETF de índice amplo.\n\n**Comportamento sob estresse**\n\nFundos de ações globais marcam a mercado diariamente e sofrem em dois cenários específicos: viradas de expectativa para os juros americanos (se o Fed voltar a subir, múltiplos comprimem) e rotações violentas de estilo (qualidade/tecnologia cedendo pra valor/cíclicos). O -1,62% de outubro reflete exatamente esse ambiente — estresse global sincronizado com o Brasil, sem separação entre mercados. A proteção cambial embutida ajudou a isolar parte da volatilidade cambial, mas não neutraliza o risco de mercado das ações em si. Quem entra aqui precisa ter horizonte de 3 anos+ e convicção de que a tese de crescimento global de longo prazo supera os ruídos de curto prazo — histórico de 36 meses (+89,16% vs +75,39% do MSCI World USD) sustenta essa convicção com dados reais.\n\n**Mecânica tributária**\n\nO GO Global é classificado como Multimercado — portanto, sujeito ao come-cotas semestral (antecipação de IR em maio e novembro, à alíquota de 15% para longo prazo). Tabela regressiva padrão: 22,5% para resgates em até 180 dias, chegando a 15% acima de 720 dias. Não há isenção de IR. A alíquota efetiva de 15% para horizonte longo é o parâmetro relevante pra comparação com outros veículos de RV global disponíveis.\n\n**Comparação de classe**\n\nDentro do universo de RV global disponível no mercado, a principal distinção deste fundo é a **concentração com viés de qualidade + gestão ativa da Robeco + proteção cambial estrutural**, ao contrário de ETFs de índice amplo (que diluem qualidade com empresas medianas do índice e têm exposição cambial aberta) ou BDRs individuais (que exigem gestão ativa do próprio cliente e liquidez menor). O custo de 1,00% a.a. é o preço da seletividade e do hedge — e o histórico de geração de alfa acima do MSCI World em todos os horizontes disponíveis indica que esse custo tem sido remunerado.\n\n---\n\n### 4. Objeções esperadas + respostas\n\n**\"Outubro foi negativo — como confiar num fundo de risco agora?\"**\nEntendo, e muita gente sente a mesma coisa depois de um mês assim. O que descobrimos ao olhar o histórico é que outubro foi um mês de estresse sincronizado — global e doméstico ao mesmo tempo. Em 12 meses, o fundo entregou +14,45% contra +10,60% do benchmark; em 36 meses, +89,16% contra +75,39%. A pergunta relevante não é \"estava negativo em outubro?\", mas \"quero estar no lado de fora quando a recuperação vier?\". A Carta Mensal Santander Asset manteve RV Global em overweight justamente porque o estresse de curto prazo não desfaz a tese estrutural.\n\n**\"Já tenho exposição internacional via outro fundo / BDR.\"**\nFaz sentido ter exposição global, e é exatamente por isso que a questão aqui é de qualidade e estrutura, não de duplicação. O que diferencia o GO Global é a gestão ativa concentrada da Robeco — 30 a 40 empresas com processo bottom-up rigoroso — mais a proteção cambial embutida, que a maioria dos BDRs e ETFs não oferece. Se o veículo que você já tem é um índice amplo, está comprando empresas medianas junto com as de qualidade; aqui você tem só as de qualidade.\n\n**\"A taxa de 1,00% a.a. não é alta pra um fundo de ações?\"**\nPara um ETF passivo de índice, sim, 1,00% seria caro. Para um fundo de gestão ativa com Robeco como subgestora, integração ESG real e proteção cambial estrutural, é um custo que o histórico justifica: o fundo gerou alfa acima do MSCI World em todos os horizontes disponíveis na lâmina. O custo relevante não é a taxa isolada — é o retorno líquido entregue ao cliente.\n\n**\"E se o cenário global piorar — Fed subir juros de novo?\"**\nÉ um risco real, e é honesto dizer isso. O mercado já precifica 79% de chance de nova alta do Fed em dezembro (XP). Se isso se confirmar, múltiplos de tecnologia sofrem no curto prazo. Mas o ponto de entrada atual, pós-estresse de outubro, já incorpora parte desse risco — e a carteira concentrada em qualidade tende a ser mais resiliente nesse cenário do que índice amplo ou empresas de crescimento sem geração de caixa. O hedge cambial também isola o cliente da pressão adicional do dólar sobre o real.\n\n**\"Com a Selic em 13,75%, por que não fico no pós-fixado?\"**\nBoa pergunta — e parte da carteira deve estar no pós-fixado, sem dúvida. O ponto é que CDI e RV global não são apostas excludentes: são funções diferentes na carteira. O CDI é a âncora de liquidez e proteção, que cumpre seu papel perfeitamente agora. O GO Global é o vetor de crescimento real de longo prazo — quem ficou 100% em pós-fixado em 2025 deixou +22,07% de valorização do fundo sobre a mesa. A construção certa é ter os dois, não escolher entre eles.\n\n**\"A carteira concentrada não aumenta demais o risco?\"**\nConcentração em 30 a 40 empresas de alta qualidade é diferente de concentração em um setor ou tema único. É o suficiente pra ter convicção real em cada posição, sem a pulverização ineficiente de um índice com 500+ ativos. O processo bottom-up da Robeco é justamente o filtro que garante que cada empresa nessa carteira passou por critérios rigorosos de qualidade financeira e ESG — não é concentração por acidente, é por escolha analítica.\n\n---\n\n### 5. Ângulo comercial por perfil API\n\n**Conservador:** ❌ Não recomendado. Grau de risco máximo (5), com volatilidade de ações globais e marcação a mercado diária — estruturalmente incompatível com perfil conservador, independentemente do horizonte.\n\n**Moderado:** ❌ Inadequado como posição relevante; a classe de risco (ações globais, grau 5) ultrapassa o teto de risco do perfil moderado. Pode ser considerado como parcela mínima em portfólio moderado com suitability ampliada — mas exige validação API caso a caso.\n\n**Balanceado:** Faz sentido como componente de diversificação internacional dentro do limite de RV do perfil — alinha com a recomendação Santander de ampliar gradualmente a alocação global como vetor de retorno e contrapeso ao risco fiscal doméstico.\n\n**Arrojado:** Posição central na tese de crescimento global — o assessor posiciona como o \"motor de longo prazo\" da carteira, complementando a âncora de pós-fixados e a eventual construção gradual em prefixados. Horizonte de 3 anos+ captura o histórico de geração de alfa acima do MSCI World.\n\n**Agressivo:** Diversificação tática essencial numa carteira que tende a concentrar risco em RV Brasil e crédito privado. Com o Ibovespa rebaixado e o câmbio depreciado, o GO Global entrega o vetor de crescimento sem dependência do fiscal doméstico — e o hedge cambial embutido evita a aposta direcional no dólar-real.", "ultima_atualizacao": "2026-11-17", "lamina": "laminas/34258351000119.pdf", "lamina_url_original": "https://www.santanderassetmanagement.com.br/pessoa-fisica/fundos-de-investimento/investimento-no-exterior/go-global-equity-esg", "lamina_tipo_url": "html", "lamina_periodo_ref": "2026-10"}, {"nome": "PREV CORDOBA MULTIMERCADO MACRO CRESCIMENTO CIC FIF RESP LIMITADA", "cnpj": "50584509000105", "gestora": "Santander Asset Management", "tipo": "Previdência", "classe_anbima": "Previdência Multimercado Livre", "classe_santander": "Multimercados", "taxa_adm": 0.02, "taxa_perf": "20% sobre o que exceder 100% do CDI", "cotizacao": "D+4", "liquidacao": "D+5", "aplicacao_minima": null, "publico_alvo": "Profissional", "estrategia": "Fundo de previdência multimercado macro que investe em diferentes mercados — juros, inflação, moedas, ações e commodities — por meio de fundos de investimento (FIF), através de posições direcionais e relativas. Atua preponderantemente no mercado local, mas pode explorar oportunidades no exterior. Busca rentabilidade tanto em movimentos de alta quanto de queda dos ativos, formando portfólio diversificado e de baixa correlação.", "pros": ["Diversificação ampla entre classes de ativos (juros, câmbio, ações, commodities, local e global)", "Alta taxa de meses positivos: 87,18% desde o início (34 de 39 meses)", "Flexibilidade para operar comprado e vendido, capturando movimentos de alta e baixa", "Gestão especializada com equipes locais e globais da Santander Asset Management"], "contras": ["Rentabilidade acumulada em 36 meses (26,40%) abaixo do CDI (44,15%) no mesmo período", "Taxa global máxima de 2,00% a.a. + performance de 20% sobre CDI resultam em custo elevado", "Liquidez restrita: após cotização D+4, o crédito pode levar até 10 dias úteis adicionais pela Seguradora", "Risco multimercado com exposição a câmbio, juros e bolsa pode gerar volatilidade relevante (Grau de Risco 4/5)"], "isento_ir": null, "tem_come_cotas": null, "speech_comercial": "### 1. Elevator pitch (30 segundos)\n\nOlha, o **PREV Cordoba Multimercado Macro Crescimento** é o multimercado macro de previdência da própria Santander Asset — equipes local e global operando juros, câmbio, ações e commodities dentro de um wrapper que não tem come-cotas e ainda carrega o benefício tributário do PGBL. Em outubro, quando o Ibovespa caiu quase 10% e a curva explodiu, o fundo entregou +1,33% no mês — exatamente porque a gestão macro tem a flexibilidade de operar vendido quando o cenário vira. O risco de não ter esse tipo de diversificação ativa na previdência é continuar concentrado num único vetor enquanto o mercado precifica o fiscal em tempo real.\n\n---\n\n### 2. Versão 2 minutos (reunião curta)\n\n**Por que agora**\n\nOutubro foi o mês que separa carteiras bem estruturadas das demais: Ibovespa -9,88%, IMA-B -1,03%, real -5,08% — e o CDI foi a única classe doméstica positiva. O Copom interrompeu o ciclo de cortes, a Selic está em 13,75%, e a Carta Mensal da Santander Asset zerou todas as posições direcionais em juros locais ao longo do mês — começa novembro do zero, lendo o cenário. Num ambiente assim, a carteira de previdência que carrega só pós-fixado protege, mas não trabalha. O que faz sentido complementar é uma estratégia que possa atuar nos dois lados do mercado.\n\n**Estratégia e diferencial**\n\nO PREV Cordoba opera macro de forma dinâmica: juros, moedas, ações e commodities — local e global — com posições direcionais e relativas. A gestão pode ficar comprada em dólar quando o real está sob pressão, curta em bolsa quando o fiscal deteriora, long em commodities quando o petróleo acelera. É essa flexibilidade que explica o resultado de outubro: o fundo capturou positivamente num dos piores meses do mercado doméstico em anos.\n\n**Desempenho e posicionamento**\n\nEm outubro/2026 o fundo rendeu **1,33% contra 1,07% do CDI** — acima do benchmark no período mais crítico. No acumulado de 12 meses, o retorno foi de **10,52% contra 14,25% do CDI**; em 36 meses, **26,40% contra 44,15%**. Esse ponto merece ser dito com clareza: nas janelas mais longas, o fundo ficou abaixo do CDI — e justamente por isso o ponto de entrada atual, num cenário de volatilidade elevada onde a gestão macro opera bem, é relevante. Rentabilidade passada não garante resultado futuro.\n\nO fundo tem **87,18% de meses positivos desde o início** — 34 de 39 meses — o que sinaliza consistência operacional mesmo considerando as janelas de underperformance vs. CDI.\n\n**Para quem é**\n\nPrevidência PGBL/VGBL para público profissional com horizonte de longo prazo, tolerância a volatilidade intermediária/alta (Grau de Risco 4/5) e interesse em diversificação ativa dentro do envelope previdenciário.\n\n**Custos e liquidez**\n\nTaxa de administração de **2,00% a.a.** com performance de **20% sobre o que exceder 100% do CDI** — custo elevado, que se justifica quando a gestão gera alfa em momentos de estresse como outubro. Cotização em **D+4** e liquidação em **D+5**, mas a Seguradora pode adicionar até 10 dias úteis adicionais no crédito — isso precisa estar no horizonte de planejamento. Sem come-cotas (previdência), com tabela tributária própria no resgate.\n\n---\n\n### 3. Versão 5 minutos (conteúdo aditivo)\n\n**Cenário macro completo — implicação para o fundo**\n\nOutubro foi uma reprecificação de risco-Brasil em velocidade comprimida: a reeleição de Lula desencadeou abertura de 93 a 136 bps nos vértices intermediários da curva DI (BTG), juros de 10 anos avançando ~250 bps na sessão seguinte (XP), parte longa cruzando 15% a.a. O consenso das quatro casas — Santander Asset, BTG, XP e Advisory — é que a Selic fica em 13,75% pelo menos até o fim do ano, sem sinal de retomada de cortes; BTG e XP não descartam reabertura de aperto em 2027. IPCA projetado acima de 5% em 2026, com dispersão enorme para 2027 (4,1% Santander Advisory até 5,9% BTG) — o principal vetor é o câmbio depreciado acima de R$ 5,40 e o petróleo Brent entre US$ 100–115/barril. O risco fiscal — dívida bruta indo de 83% para 88% do PIB entre 2026 e 2027, medidas pós-eleição adicionando ~R$ 83 bilhões sem contrapartida (XP) — é o driver consensual de incerteza. Para o PREV Cordoba: esse ambiente de alta volatilidade em câmbio, juros e commodities é exatamente onde a estratégia macro direcional/relativa encontra suas melhores oportunidades — outubro confirmou isso na prática.\n\n**Comportamento sob estresse**\n\nFundos multimercado macro marcam a mercado todos os dias — e em cenários de reversão abrupta, como viradas de ciclo ou choques políticos, podem acumular sequências de meses negativos antes de recuperar. A exposição simultânea a câmbio, juros e bolsa significa que se a gestão se posicionar direcional em múltiplos mercados e todos virarem contra, o drawdown pode ser relevante para o horizonte de curto prazo. O Grau de Risco 4/5 da lâmina reflete essa característica — é um produto para quem entende que a previdência tem horizonte de décadas e pode absorver volatilidade intermediária pelo caminho, não para quem olha o extrato todo mês.\n\n**Mecânica tributária**\n\nComo previdência, não há come-cotas (antecipação semestral de IR). A tributação ocorre apenas no resgate, com tabela regressiva (preferível para horizontes longos: começa em 35% e cai até 10% para recursos com mais de 10 anos), ou progressiva conforme planejamento do cliente. No PGBL, as contribuições são dedutíveis da base de cálculo do IR até 12% da renda bruta tributável — benefício que, isoladamente, já representa um retorno adicional relevante para clientes que fazem a declaração completa.\n\n**Comparação de classe**\n\nDentro do envelope previdenciário, as alternativas são: Prev DI (pós-fixado, capital preservado, sem alfa), Prev IPCA+ (proteção inflacionária, exposição direcional a juros reais), e Prev Multimercado como este — que agrega as demais exposições com gestão ativa de posicionamento. A lógica de alocação não é substituição, é complementaridade: o Prev DI ancora, o PREV Cordoba trabalha a diversificação dinâmica. Em termos de custo, fundos de previdência multimercado ativos com gestão macro nacional e global naturalmente carregam estruturas de taxa mais elevadas que produtos pós-fixados — o diferencial é a capacidade de gerar alfa em momentos de alta volatilidade, como o mês que acabou de passar.\n\n---\n\n### 4. Objeções esperadas + respostas\n\n**\"26% em 36 meses contra 44% do CDI — esse fundo perdeu muito pra referência.\"**\nEntendo, e esse dado está ali na lâmina — seria errado não falar. O que vale observar é que a janela de 36 meses inclui o período de Selic mais alta da história recente, onde qualquer produto indexado ao CDI foi imbatível. O que outubro mostrou é que quando o cenário vira e gera assimetria — câmbio, juros e bolsa se movendo simultaneamente — a gestão macro consegue se posicionar nos dois lados. O retorno de outubro (+1,33% vs CDI +1,07%) é o dado mais recente e mais relevante pra avaliar se a estratégia funciona quando importa. O ponto de entrada é hoje, não há 36 meses.\n\n**\"Taxa de 2% a.a. mais 20% de performance é cara demais.\"**\nÉ uma estrutura de custo elevada — não tenho como negar. A forma de avaliar é pelo retorno líquido entregue. Em outubro, com o mercado doméstico em queda livre, o fundo ficou acima do CDI. A taxa de performance só é cobrada quando o fundo supera 100% do CDI — ou seja, o gestor só ganha mais se você ganhar mais. Comparar taxa isolada sem considerar o alfa gerado em momentos de estresse dá uma foto incompleta. Dito isso: é um produto para quem valoriza diversificação ativa na previdência, não para quem quer minimizar custo acima de tudo — aí o Prev DI é a resposta.\n\n**\"Liquidez em D+4 mais até 10 dias da Seguradora é muito tempo.\"**\nÉ verdade, e é o ponto de atenção mais operacional do produto. Por isso o posicionamento correto é como parte do envelope de previdência de longo prazo — não como reserva de emergência ou capital que pode precisar de liquidez em curto prazo. Previdência estruturalmente carrega essa trava, que na verdade é uma disciplina que protege o cliente de saques em momentos de pânico, como outubro. O capital que precisa estar disponível em dias fica no pós-fixado.\n\n**\"Já tenho um multimercado na carteira — pra que adicionar um de previdência?\"**\nO diferencial não é a estratégia macro em si, é o envelope. Um multimercado convencional tem come-cotas semestrais que drenam rentabilidade ao longo dos anos. O PREV Cordoba faz a mesma estratégia dentro da previdência: sem come-cotas, com tabela regressiva que pode chegar a 10% de IR para horizonte longo, e com o benefício de dedução fiscal do PGBL se aplicável. A comparação correta não é \"tenho um multimercado\" — é \"meu multimercado tem o mesmo benefício tributário?\"\n\n**\"Com o cenário fiscal em aberto, não seria melhor ficar só no CDI?\"**\nO CDI a 13,75% realmente é o melhor retorno ajustado ao risco no momento — e faz parte de qualquer carteira bem estruturada agora. Mas concentrar toda a previdência em pós-fixado é abrir mão do potencial de diversificação justamente quando o câmbio está a R$ 5,40, o petróleo acima de US$ 100 e a curva longa acima de 15% — todos vetores que um multimercado macro pode capturar. A postura não é escolher entre CDI e PREV Cordoba — é ter os dois, em proporção adequada ao perfil.\n\n**\"E se o cenário fiscal piorar ainda mais?\"**\nÉ o risco mais legítimo desta conversa, e é bom colocá-lo na mesa. Se o quadro fiscal deteriorar adicionalmente, haverá mais volatilidade em câmbio, juros e bolsa. O risco do fundo nesse cenário depende de como a gestão estiver posicionada — e a flexibilidade de operar vendido em bolsa e comprado em câmbio é exatamente o kit de ferramentas que a Santander Asset utilizou em outubro. Não é imunidade ao risco, é capacidade de navegar o risco nos dois sentidos. Rentabilidade passada não garante resultado futuro — mas a estrutura da estratégia é desenhada para funcionar em ambientes como esse.\n\n---\n\n### 5. Ângulo comercial por perfil API\n\n**Conservador:** ❌ Não recomendado. Grau de Risco 4/5 com exposição a câmbio, bolsa e commodities e histórico de underperformance vs. CDI em janelas longas estão fora da suitability para perfil conservador.\n\n**Moderado:** A combinação de 87% de meses positivos com gestão macro flexível dentro do envelope previdenciário (sem come-cotas, tabela regressiva) oferece diversificação ativa sem abrir mão da estrutura de longo prazo — posição complementar ao Prev DI do perfil, sem substituí-lo.\n\n**Balanceado:** Alinha ao posicionamento da Carta Santander Asset de novembro — multimercados abaixo da alocação estrutural, mas presentes; aqui o wrapper previdenciário adiciona a eficiência tributária que o multimercado convencional não tem.\n\n**Arrojado:** Produtividade de capital com diversificação real: o fundo opera os mesmos vetores de oportunidade (câmbio depreciado, commodities, juros longos) que o perfil arrojado busca, mas dentro de um envelope de longo prazo com tributação mais eficiente.\n\n**Agressivo:** Posição de diversificação tática para quem está concentrado em RV Brasil — o PREV Cordoba adiciona exposição macro global (commodities, moedas, juros) que reduz a correlação da carteira com o Ibovespa num momento em que o índice carrega risco político elevado.", "ultima_atualizacao": "2026-11-17", "lamina": "laminas/50584509000105.pdf", "lamina_url_original": "https://www.santander.com.br/document/wps/L_4410.pdf", "lamina_tipo_url": "pdf", "lamina_periodo_ref": "2026-10"}, {"nome": "PREV FUTURE WEALTH DÓLAR 40 CIC FIF RESP LIMITADA", "cnpj": "40005789000198", "gestora": "Santander Asset Management", "tipo": "Previdência", "classe_anbima": "Previdência Multimercado Livre", "classe_santander": "Multimercados", "taxa_adm": 0.0125, "taxa_perf": "20% sobre o que exceder (40% do MSCI ACWI em reais + 60% do CDI)", "cotizacao": "D+5", "liquidacao": "D+6", "aplicacao_minima": null, "publico_alvo": "Qualificado", "estrategia": "Fundo de fundos de previdência que aloca até 40% em ações globais com tese de inovação (IA, robótica, defesa, energia, blockchain) sem hedge cambial, expondo o cotista à variação do dólar. A parcela restante é alocada em fundos de renda fixa e ações locais geridos pelo Santander. Combina análise fundamentalista e ferramentas quantitativas para identificar empresas líderes em inovação estrutural de longo prazo.", "pros": ["Exposição a temas de inovação global (IA, robótica, transição energética) com diversificação internacional", "Sem hedge cambial: potencial de ganho adicional com valorização do dólar", "Wrapper de previdência (PGBL/VGBL) com benefício tributário no acúmulo", "62,5% dos meses desde o início foram positivos; retorno acumulado 36m de 48,19%"], "contras": ["Risco cambial elevado — cota diretamente exposta à variação dólar/real, podendo gerar perdas relevantes", "PL médio mensal pequeno (R$ 19 MM), o que pode implicar menor liquidez e spreads maiores nos ativos", "Desempenho sistematicamente abaixo do benchmark em vários períodos (ex: 2024: fundo 13,50% vs benchmark 25,25%)", "Liquidação pelo plano de previdência pode levar até 180 dias úteis após o prazo do fundo, reduzindo liquidez efetiva"], "isento_ir": null, "tem_come_cotas": null, "speech_comercial": "### 1. Elevator pitch (30 segundos)\n\nOlha, o PREV FUTURE WEALTH DÓLAR 40 CIC combina duas coisas que o cenário de agora pede juntas: até 40% em ações globais de inovação — IA, robótica, transição energética — sem hedge cambial, então o dólar forte trabalha a favor do cotista, e o restante em renda fixa e ações locais geridas pelo Santander. Com o real acima de R$ 5,40, o risco Brasil reprecificado e RV global em overweight pela Carta Mensal Santander Asset, esse é um dos poucos fundos de previdência que captura simultaneamente a tese de tecnologia global e o hedge natural ao fiscal doméstico — tudo dentro do wrapper tributário do PGBL ou VGBL.\n\n---\n\n### 2. Versão 2 minutos (reunião curta)\n\n**Por que agora**\n\nOutubro foi o mês mais duro para ativos domésticos desde 2020: Ibovespa -9,88%, curva de 10 anos avançou ~250 bps numa única sessão, real deprecia +5,08% e fecha acima de R$ 5,40. O Copom interrompeu o ciclo de cortes, Selic parada em 13,75%, e as quatro principais casas de research convergem: o quadro fiscal brasileiro seguirá pressionado pelo menos até haver clareza sobre a nova equipe econômica. Nesse ambiente, a Carta Mensal Santander Asset mantém RV global em overweight — única classe que ficou positiva para carteiras bem posicionadas em outubro. Quem estava concentrado em ativos domésticos pagou o preço inteiro dessa realocação forçada. O PREV FUTURE WEALTH DÓLAR 40 é exatamente o instrumento que captura essa tese de diversificação, dentro de um produto de previdência.\n\n**Estratégia e diferencial**\n\nO fundo aloca até 40% em ações globais com tese de inovação estrutural — IA, robótica, defesa, energia, blockchain — sem hedge cambial: quando o dólar sobe, essa parcela se valoriza em reais automaticamente. Os 60% restantes ficam em fundos de renda fixa e ações locais do Santander, com a gestão ativa da própria casa calibrando o risco doméstico. É análise fundamentalista combinada com ferramentas quantitativas para selecionar empresas líderes de inovação — não é exposição passiva a índice.\n\n**Desempenho e posicionamento**\n\nNos últimos 36 meses, o fundo acumula **48,19%** — retorno concreto, embora abaixo do benchmark de 67,31% no mesmo período. Essa diferença importa e vale a conversa honesta: em 2024 o fundo entregou 13,50% contra 25,25% do benchmark; em 2025, 9,31% contra 12,25%; e nos últimos 12 meses, 12,38% contra 16,15%. O fundo sistematicamente ficou abaixo do benchmark nessas janelas. O que explica: em momentos de dólar muito forte e bolsa global em alta acelerada, a parcela de renda fixa local e a seletividade da carteira de ações amortecem o upside. O contra-argumento é o ponto de entrada: com câmbio depreciado estruturalmente, Selic elevada sustentando o componente de RF local e tese de IA/tecnologia mantida em overweight pela Santander Asset, o contexto atual é mais favorável para o perfil do fundo do que foi em boa parte dos últimos 24 meses. *Rentabilidade passada não garante resultado futuro.*\n\n**Para quem é**\n\nPúblico qualificado, horizonte de longo prazo — previdência não é instrumento de curto prazo. Faz sentido para quem quer exposição internacional estrutural dentro do benefício tributário do PGBL (dedução de até 12% da renda bruta tributável) ou VGBL.\n\n**Custos e liquidez**\n\nTaxa de administração de **1,25% a.a.** Taxa de performance de **20% sobre o que exceder 40% MSCI ACWI em reais + 60% CDI**. Cotização D+5, liquidação D+6 pelo fundo — mas atenção: a liquidação pelo plano de previdência pode levar até **180 dias úteis** além desse prazo. Esse dado é crítico: esse fundo é componente de longo prazo da carteira, não reserva de liquidez.\n\n---\n\n### 3. Versão 5 minutos (conteúdo aditivo)\n\n**Cenário macro completo**\n\nAs quatro casas consultadas — Santander Asset, Santander Advisory, BTG e XP — convergem em três pontos fundamentais para este fundo. Primeiro: Selic em 13,75%, parada, com BTG e XP não descartando reabertura de ciclo de aperto em 2027 se o quadro fiscal piorar. Segundo: câmbio estruturalmente depreciado, com projeções de R$ 5,30–5,40 no fim de 2026 — Santander Advisory é a mais otimista, BTG prevê manutenção do patamar atual. Terceiro: RV global em overweight unânime entre Santander Asset e XP, com tese de tecnologia e IA como vetor de crescimento estrutural, ancorada no PIB americano de 3,4% anualizado no 3T26 e na resiliência dos hyperscalers. Lucas Stella, Head de Research da Santander Asset, levanta o ponto relevante sobre IA: o mercado está migrando da narrativa de crescimento para a de **retorno sobre capital** — hyperscalers precisam gerar ~US$ 300 bilhões em receitas anuais de IA para equilibrar seus investimentos em infraestrutura. A implicação prática para este fundo é que a seletividade dentro da parcela global importa mais do que nunca: não é compra de índice, é escolha de líderes.\n\n**Comportamento sob estresse**\n\nComo fundo de previdência com até 40% em ações globais sem hedge cambial, há dois vetores de estresse que o cotista precisa entender. O primeiro é a volatilidade do câmbio: em momentos de apreciação do real — improvável no cenário atual, mas possível —, a parcela internacional perde valor em reais sem que os ativos subjacentes tenham se desvalorizado. O segundo é o comportamento de ações globais de inovação em ambientes de juros americanos altos por mais tempo: empresas de crescimento são as mais sensíveis à taxa de desconto, e o Fed ainda precifica probabilidade relevante de alta em dezembro/2026. O contrabalanço estrutural é que o componente de renda fixa local amortece esses movimentos — mas não os neutraliza. O investidor precisa ter horizonte de pelo menos 5 anos para absorver esses ciclos.\n\n**Mecânica tributária**\n\nPor ser previdência, **não há come-cotas** — a antecipação semestral de IR que corrói fundos de RF e multimercados abertos não se aplica aqui. O IR incide apenas no resgate, conforme o regime escolhido: tabela **regressiva** (alíquota cai de 35% para 10% conforme o prazo de acumulação — preferível para horizontes longos) ou progressiva. No PGBL, há benefício adicional de dedução de até 12% da renda bruta tributável na declaração completa do IR — redução de imposto no presente que financia parte da alocação. No VGBL, não há dedução, mas o IR incide apenas sobre os rendimentos, não sobre o principal. Para o cliente em fase de acumulação com renda tributável relevante, o PGBL potencializa o retorno líquido real do produto.\n\n**Comparação de classe**\n\nDentro do universo de previdência multimercado livre, o diferencial deste fundo é a exposição cambial explícita e a concentração temática em inovação. Fundos de previdência mais conservadores (Prev DI ou Prev IPCA+) entregam carrego sem volatilidade, mas não capturam a valorização do dólar nem o crescimento de tecnologia global. Fundos de previdência multimercado sem exposição internacional ficam expostos integralmente ao risco Brasil — exatamente o que outubro penalizou. O PREV FUTURE WEALTH DÓLAR 40 ocupa um espaço específico: quem quer previdência com diversificação real e aceita a volatilidade do câmbio e das ações globais como parte da estratégia, não como efeito colateral indesejado.\n\n---\n\n### 4. Objeções esperadas + respostas\n\n**\"O fundo ficou muito abaixo do benchmark — 48% em 36 meses contra 67% do índice. Por que eu compraria isso?\"**\n\nEntendo, e é a objeção mais legítima — os dados confirmam o underperformance sistemático. O que vale contextualizar: o benchmark é composto por 40% MSCI ACWI em reais + 60% CDI — um índice que reflete condições de mercado ideais para cada componente simultaneamente. Em períodos em que bolsa global sobe forte e CDI rende bem, o benchmark bate gestão ativa na maioria das janelas. O argumento de entrada é outro: câmbio acima de R$ 5,40, RV global em overweight pela gestora do próprio fundo, e Selic elevada sustentando o componente de RF local — o ponto de partida atual é diferente do que foi em 2024, quando o fundo entregou 13,50% contra 25,25% do benchmark num ambiente de dólar mais apreciado em moeda local. *Rentabilidade passada não garante resultado futuro.*\n\n**\"A liquidez é péssima — 180 dias úteis pra sair. E se eu precisar do dinheiro?\"**\n\nMuita gente sente isso, e faz todo sentido a preocupação. A resposta direta é: esse recurso não pode ser a reserva de emergência nem capital de curto prazo. É uma fatia do patrimônio de longo prazo, alocada em previdência justamente pelo benefício tributário e pelo horizonte alongado. A reserva líquida fica em pós-fixados DI — que hoje remuneram ~13,75% a.a. com liquidez diária. O PREV FUTURE WEALTH DÓLAR 40 é o complemento de retorno, não a âncora de liquidez.\n\n**\"Taxa de 1,25% a.a. mais performance de 20% parece caro.\"**\n\nEntendo. O custo precisa ser avaliado contra o que entrega: acesso a uma carteira de ações globais de inovação gerida ativamente, com análise fundamentalista e quantitativa, dentro de um wrapper de previdência que elimina o come-cotas e oferece benefício fiscal no PGBL. Um ETF internacional fora da previdência paga IR na fonte (come-cotas, se for fundo) e não tem o benefício da dedução. A taxa de performance só é cobrada quando supera o benchmark — alinhamento de interesse com o cotista. O custo líquido de não ter previdência com exposição internacional pode ser maior do que a taxa.\n\n**\"O câmbio pode voltar a apreciar e eu perco na parcela internacional.\"**\n\nÉ verdade — e é o risco mais estrutural do produto. Santander Advisory projeta câmbio em R$ 5,30 no fim de 2026, a mais otimista entre as casas. Mesmo nesse cenário, o real ainda estaria num patamar historicamente depreciado, e o componente de renda fixa local amortece parte desse movimento. Mas o investidor precisa ter claro: sem hedge cambial, apreciação do real = perda na parcela internacional em reais, independentemente do desempenho dos ativos. É um risco real, gerenciado pelo horizonte longo e pela diversificação interna do fundo.\n\n**\"Já tenho um fundo de previdência. Para que dois?\"**\n\nDescobri que muita gente que sente isso tem previdência concentrada em Prev DI ou IPCA+ — ótimo para carrego, mas sem nenhuma exposição internacional. O PREV FUTURE WEALTH DÓLAR 40 não é um substituto: é o componente de crescimento e diversificação geográfica dentro da previdência. Com o risco Brasil elevado e RV global em overweight, ter toda a previdência em ativos domésticos é uma aposta direcional implícita — talvez não intencional.\n\n**\"E se a tese de IA não se materializar?\"**\n\nA Santander Asset já levanta essa questão internamente — Lucas Stella, Head de Research, aponta que hyperscalers precisam de ~US$ 300 bilhões em receitas anuais de IA para equilibrar seus investimentos, e a seletividade importa mais do que a exposição ampla ao tema. O fundo não compra índice: usa fundamentalismo e quantitativo para selecionar líderes em inovação estrutural — IA, robótica, defesa, energia, blockchain. Se parte da tese defraudar, o portfólio diversificado entre temas reduz o impacto. Risco existe; o ponto é ter um gestor ativo gerenciando esse risco, não passivo.\n\n---\n\n### 5. Ângulo comercial por perfil API\n\n- **Conservador:** ❌ Não recomendado. A volatilidade cambial e o risco de renda variável global sem hedge excedem o perfil — a parcela de previdência desse cliente deve ficar em Prev DI ou Prev IPCA+ curto.\n\n- **Moderado:** A combinação de renda fixa local (carrego em Selic elevada) com até 40% em ações globais entrega diversificação sem abandonar a âncora de RF — dose de risco calibrada para quem quer crescimento sem abandonar a proteção.\n\n- **Balanceado:** Com RV global em overweight na carteira-modelo do mês e câmbio estruturalmente depreciado, esse fundo cobre exatamente o componente internacional que o perfil balanceado precisa dentro da previdência — alinha com o posicionamento oficial da Santander Asset.\n\n- **Arrojado:** O câmbio sem hedge e a concentração em inovação fazem o capital trabalhar mais: em contexto de dólar forte e tese de tecnologia sustentada, a parcela global pode amplificar o retorno da carteira de previdência acima do que qualquer produto doméstico entregaria.\n\n- **Agressivo:** Dentro de uma carteira concentrada em RV Brasil, esse fundo é o diversificador natural — exposição a dólar e tecnologia global que descorrelaciona do risco fiscal doméstico e reduz a concentração setorial sem sair do benefício tributário da previdência.", "ultima_atualizacao": "2026-11-17", "lamina": "laminas/40005789000198.pdf", "lamina_url_original": "https://www.santander.com.br/document/wps/L_4161.pdf", "lamina_tipo_url": "pdf", "lamina_periodo_ref": "2026-10"}, {"nome": "PREV GLOBAL MULTIMERCADO CIC RESP LIMITADA", "cnpj": "37240874000126", "gestora": "Santander Asset Management", "tipo": "Previdência", "classe_anbima": "Previdência Multimercado Livre", "classe_santander": "Multimercados", "taxa_adm": 0.0125, "taxa_perf": "20% sobre o que exceder (40% do MSCI World em reais + 60% do CDI)", "cotizacao": "D+7", "liquidacao": "D+8", "aplicacao_minima": null, "publico_alvo": "Qualificado", "estrategia": "Fundo de fundos de previdência que investe em diferentes mercados (juros, câmbio e bolsa) por meio de fundos de investimento, buscando diversificação global. Aloca 40% em fundo Global Equities (ações globais sem hedge cambial, gerido com suporte da Santander Asset Management Global, benchmark MSCI World) e 60% em ativos brasileiros como IMA-B, IRF-M, DI e Ibovespa. Exposição cambial via parcela internacional.", "pros": ["Diversificação geográfica e setorial global com exposição a EUA, Europa, Ásia e emergentes", "Exposição cambial natural ao dólar via parcela internacional, funcionando como hedge frente a ativos locais", "Gestão apoiada pela Santander Asset Management Global na seleção de veículos internacionais", "67,65% dos meses desde o início com retorno positivo, demonstrando consistência"], "contras": ["Sem hedge cambial na parcela internacional — cota sujeita a variações do dólar, o que pode amplificar perdas em cenários de valorização do Real", "Fundo exclusivo para planos PGBL/VGBL da Zurich Santander, sem acesso direto para investidores fora desse ecossistema", "Resgate com prazo de até 180 dias úteis para disponibilização pela seguradora — liquidez muito restrita", "Desempenho inferior ao benchmark em 2024 (16,63% vs 25,06%) e 2026 acumulado (8,44% vs 10,78%)"], "isento_ir": null, "tem_come_cotas": null, "speech_comercial": "### 1. Elevator pitch (30 segundos)\n\nOlha, o **PREV GLOBAL MULTIMERCADO CIC RESP LIMITADA** é a única peça da sua previdência que já vem estruturalmente posicionada em renda variável global — 40% em ações internacionais sem hedge, exposição direta ao dólar —, num momento em que a Santander Asset mantém RV global em **overweight** e todas as casas convergem em reduzir risco Brasil. Enquanto o Ibovespa caiu quase 10% em outubro, o componente internacional desse fundo trabalhou na direção contrária. Deixar a previdência 100% doméstica hoje é abrir mão do único vetor de crescimento que o consenso do mercado ainda recomenda sobreponderar.\n\n---\n\n### 2. Versão 2 minutos (reunião curta)\n\n**Por que agora**\n\nOutubro foi o mês mais duro para ativos domésticos desde 2020: Ibovespa -9,88%, curva longa cruzando 15% a.a., real acima de R$ 5,40. O Copom interrompeu o ciclo de cortes, a Selic está em 13,75% sem perspectiva clara de queda — BTG e XP não descartam nem reabertura de aperto em 2027. Nesse cenário, a Carta Mensal Santander Asset manteve **RV global em overweight**, exatamente enquanto rebaixava RV Brasil para neutro. A pergunta que fica é: a previdência do seu cliente está posicionada para onde o dinheiro institucional está indo, ou contra?\n\n**Estratégia e diferencial**\n\nO PREV GLOBAL MULTIMERCADO CIC RESP LIMITADA é um fundo de fundos: 40% alocados em um fundo de ações globais gerido com suporte da Santander Asset Management Global — benchmark MSCI World, sem hedge cambial, o que dá exposição estrutural ao dólar como hedge natural à carteira doméstica. Os 60% restantes ficam em ativos brasileiros (IMA-B, IRF-M, DI, Ibovespa), entregando o componente local dentro do mesmo veículo previdenciário. Não é necessário montar dois produtos separados para ter essa combinação.\n\n**Desempenho e posicionamento**\n\nNos últimos 12 meses, o fundo acumulou **11,67%** frente a 13,67% do benchmark (40% MSCI World em reais + 60% CDI). Em 36 meses, **50,64%** vs 62,04% do índice. É honesto dizer que o fundo ficou abaixo do benchmark em todos os períodos relevantes — incluindo 2026, com 8,44% vs 10,78% até outubro. O ponto de entrada importa: essa defasagem em relação ao benchmark significa que a recuperação parcial do gap pode favorecer quem entra agora, especialmente se o componente internacional continuar capturando o movimento de tecnologia global que a Santander Asset descreve como estrutural. ⚠️ Rentabilidade passada não garante resultado futuro.\n\n**Pra quem é**\n\nInvestidor qualificado, com plano PGBL ou VGBL na Zurich Santander, horizonte de pelo menos 5–7 anos (regime tributário regressivo se beneficia do longo prazo) e tolerância à volatilidade cambial — a parcela em dólar oscila sem proteção.\n\n**Custos e liquidez**\n\nTaxa de administração: **1,25% a.a.** Taxa de performance: **20% sobre o que exceder 40% MSCI World em reais + 60% CDI** — alinhada ao benchmark real do produto. Cotização em D+7, liquidação em D+8 dentro do fundo; porém, como é previdência, a disponibilização pela seguradora pode levar **até 180 dias úteis**. Esse prazo precisa estar claro antes de qualquer comprometimento — não é produto para reserva de liquidez.\n\n---\n\n### 3. Versão 5 minutos (conteúdo aditivo)\n\n**Cenário macro completo**\n\nO consenso de quatro casas — Santander Asset, BTG, XP e Santander Advisory — aponta para um ambiente doméstico de alta incerteza fiscal prolongada: dívida bruta em trajetória de 83% para 88% do PIB entre 2026 e 2027 (BTG), novas medidas pós-eleição adicionando ~R$ 83 bilhões ao orçamento de 2027 sem contrapartida (XP), e curva longa de juros acima de 15% — nível que comprime múltiplos e penaliza qualquer ativo de risco doméstico com duração longa. No campo externo, o Fed manteve juros em 3,75%–4,00% com dois diretores votando por alta, e o PIB americano cresceu 3,4% anualizado no 3T26. Para o PREV GLOBAL MULTIMERCADO CIC RESP LIMITADA, isso se traduz diretamente: a parcela de 40% em ações globais está posicionada no único mercado que reúne crescimento de atividade robusto e a tese estrutural de tecnologia/IA, enquanto a parcela doméstica de 60% captura o carrego real dos juros brasileiros acima de inflação — que hoje é expressivo, com Selic a 13,75% e IPCA projetado em ~5% para 2026.\n\n**Comportamento sob estresse**\n\nComo fundo de fundos multimercado previdenciário com parcela relevante em renda variável global sem hedge, o produto carrega três fontes de volatilidade que o cliente precisa entender: (1) variação do real contra o dólar — um real que se aprecia penaliza diretamente a cota, sem nenhuma proteção; (2) marcação a mercado dos ativos brasileiros, especialmente IMA-B e IRF-M, que sofreram em outubro com a abertura de curva; e (3) variação do MSCI World em reais, que amplifica tanto as altas quanto as quedas do mercado de ações americano. Meses com combinação de dólar fraco + bolsa global negativa + abertura de curva doméstica podem gerar queda relevante de cota — como refletem os períodos de desempenho abaixo do benchmark já documentados na lâmina. O horizonte longo é o que absorve esses episódios.\n\n**Mecânica tributária**\n\nPor ser previdência (PGBL/VGBL), **não há come-cotas** — a antecipação semestral de IR que incide em fundos de renda fixa e multimercados abertos não se aplica aqui. O IR é cobrado apenas no resgate, seguindo a tabela regressiva (até 35% no curto prazo, chegando a 10% para recursos mantidos por mais de 10 anos no regime regressivo). Para PGBL: o cliente pode deduzir contribuições de até 12% da renda bruta tributável na declaração completa do IR — benefício que transforma o produto também em instrumento de planejamento fiscal, não só de acumulação. Para o horizonte longo que o produto exige de qualquer forma, o regime regressivo é quase sempre a escolha mais eficiente.\n\n**Comparação de classe**\n\nUm multimercado aberto com estratégia equivalente — global, sem hedge, com gestão ativa — teria come-cotas semestrais (antecipação de IR em maio e novembro) e alíquota regressiva só até 15% no longo prazo, sem o benefício de dedução PGBL. A estrutura previdenciária do PREV GLOBAL MULTIMERCADO CIC RESP LIMITADA entrega o mesmo acesso à diversificação global dentro de um invólucro tributariamente mais eficiente para quem tem horizonte longo e usa o veículo correto (PGBL para dedução; VGBL para quem declara simplificado ou quer complementar além dos 12%).\n\n---\n\n### 4. Objeções esperadas + respostas\n\n**\"O fundo está abaixo do benchmark em todos os períodos — por que colocar dinheiro nisso?\"**\n\nEntendo, e é exatamente o ponto que eu colocaria na mesa se fosse o cliente. O que a lâmina mostra é que o fundo entregou 11,67% em 12 meses e 50,64% em 36 meses — retornos positivos e absolutos relevantes, mas com um gap consistente em relação ao benchmark composto (MSCI World em reais + CDI). Esse gap tem duas origens: a seletividade na parcela global (que nem sempre acompanha o índice puro) e o custo da gestão ativa. O que muda o enquadramento é que esse gap, documentado, é também um potencial ponto de entrada — e a tese de RV global da Santander Asset está em overweight justamente agora. Mas não é argumento para esconder o histórico: se o cliente prioriza tracking estreito do índice e baixo custo, um ETF global dentro de previdência pode ser a alternativa certa. Aqui a proposta de valor é a gestão ativa com suporte internacional, não a replicação passiva.\n\n**\"Resgate em até 180 dias úteis? Isso é quase um ano de dinheiro preso.\"**\n\nSinto que isso incomoda — e deve mesmo. 180 dias úteis são aproximadamente 9 meses calendário; pra qualquer recurso que precise de liquidez em prazo menor que isso, esse produto não serve. O enquadramento correto é: dinheiro de previdência é dinheiro de longo prazo por definição. Se a carteira já tem a reserva de liquidez resolvida em outro veículo — e aqui no Private a gente olha isso antes de qualquer alocação —, esses recursos podem trabalhar num horizonte de 10–20 anos sem que o prazo de resgate seja um problema real. A pergunta que vale fazer é: qual é a proporção da carteira que realmente não vai ser tocada por mais de 5 anos?\n\n**\"Taxa de 1,25% a.a. mais performance é cara para previdência.\"**\n\nA comparação correta não é com um fundo DI de previdência (que custa 0,30%–0,70% e entrega CDI bruto). É com o custo de replicar a mesma estratégia fora da previdência: um multimercado global aberto com gestão ativa cobr aria taxa similar ou superior, mais o impacto do come-cotas semestral — que corrói o capital composto ao longo dos anos. Dentro da previdência, o diferimento fiscal do come-cotas já paga parte da taxa. A performance só é cobrada quando o fundo supera o benchmark — o alinhamento de incentivo existe.\n\n**\"E se o real se valorizar? A parcela em dólar vai pesar contra.\"**\n\nSentiu um risco real, e ele está documentado como o primeiro contraponto da lâmina. Se o real apreciar, a parcela de 40% em ações globais sem hedge vai perder em reais mesmo que o MSCI World suba em dólar. O Santander Advisory projeta câmbio em R$ 5,30 no fim de 2026 — levemente apreciado vs o atual —, mas o consenso é de real depreciado estruturalmente frente ao dólar enquanto o quadro fiscal não se resolve. Para uma carteira de previdência de longo prazo, a exposição cambial funciona como diversificação estrutural: o risco real é ter 100% do patrimônio previdenciário em reais no momento em que o Brasil passa por um episódio fiscal severo — e outubro mostrou como isso dói.\n\n**\"Já tenho um fundo de previdência multimercado. Qual a diferença?\"**\n\nA maioria dos multimercados de previdência domésticos opera com estratégias direcionais em juros, bolsa Brasil e câmbio — sem alocação estrutural em renda variável internacional. O diferencial específico do PREV GLOBAL MULTIMERCADO CIC RESP LIMITADA é o componente de 40% em ações globais gerido com suporte da Santander Asset Management Global, benchmark MSCI World — uma classe que a Carta Mensal de novembro mantém em overweight enquanto reduz exposição a quase todos os ativos domésticos. Se o multimercado que o cliente já tem é 100% Brasil, os dois produtos são complementares, não concorrentes.\n\n**\"E se a tese de IA não se confirmar e a bolsa americana corrigir forte?\"**\n\nÉ o risco específico levantado pelo próprio Head de Research da Santander Asset, Lucas Stella: os hyperscalers precisam gerar ~US$ 300 bilhões em receitas anuais de IA para equilibrar os investimentos projetados — e retornos sobre capital abaixo do esperado poderiam pressionar as Magnificent Seven, que hoje respondem por mais de 30% do S&P 500. Isso é monitorado ativamente pela gestão. O que mitiga no contexto de previdência de longo prazo: (1) o horizonte dilui episódios de volatilidade de curto prazo; (2) a parcela de 60% em ativos brasileiros age como contrapeso quando o dólar cai junto com a bolsa americana; (3) a gestão ativa tem mandato para ajustar a seleção de veículos internacionais — não é exposição passiva cega ao índice.\n\n---\n\n### 5. Ângulo comercial por perfil API\n\n**Conservador:** ❌ Não recomendado. A volatilidade cambial sem hedge na parcela de 40% em RV global, combinada com exposição a renda variável doméstica e prazo de resgate de até 180 dias úteis, está fora da tolerância estrutural desse perfil.\n\n**Moderado:** A combinação de 60% em ativos brasileiros (com carrego de juros reais expressivos) e 40% em RV global funciona como primeira ponte entre o pós-fixado puro e a diversificação internacional — dentro do invólucro previdenciário que elimina o come-cotas. Peso sugerido: parcela complementar da previdência, não o veículo único.\n\n**Balanceado:** Alinhado ao posicionamento Santander de novembro: RV global overweight + ativos domésticos com carrego. O fundo entrega os dois vetores num único produto previdenciário, sem a necessidade de montar a estratégia em camadas separadas. Verifica se a alocação atual de previdência já contempla exposição internacional — se não, este é o gap.\n\n**Arrojado:** A exposição cambial sem hedge é produtividade de capital em cenário de real depreciado estrutural. Com o câmbio projetado acima de R$ 5,30 pelo consenso e RV global em overweight por Santander Asset e XP, o componente internacional do fundo trabalha a favor — enquanto a parcela doméstica captura o carrego real de Selic a 13,75%.\n\n**Agressivo:** Para carteira concentrada em risco Brasil (Ibovespa, crédito doméstico, prefixados longos), esse fundo de previdência adiciona descorrelação geográfica e cambial — exatamente o que a Carta Mensal Santander recomenda como complemento tático num momento em que o mercado local está sob reprecificação forçada.", "ultima_atualizacao": "2026-11-26", "lamina": "laminas/37240874000126.pdf", "lamina_url_original": "https://www.santander.com.br/document/wps/L_4122.pdf", "lamina_tipo_url": "pdf", "lamina_periodo_ref": "2026-10"}, {"nome": "PREV INNOVATION DÓLAR 40 CIC FIF RESP LIMITADA", "cnpj": "40005789000198", "gestora": "Santander Asset Management", "tipo": "Previdência", "classe_anbima": "Previdência Multimercado Livre", "classe_santander": "Multimercados", "taxa_adm": 0.0125, "taxa_perf": "20% sobre o que exceder (40% do MSCI ACWI em reais + 60% do CDI)", "cotizacao": "D+5", "liquidacao": "D+6", "aplicacao_minima": null, "publico_alvo": "Qualificado", "estrategia": "Fundo de fundos de previdência que investe até 40% em ações globais com tese de inovação (IA, robótica, defesa, energia, blockchain), sem hedge cambial, exposto à variação do dólar. A parcela restante é alocada em fundos de renda fixa e ações locais geridos pelo Santander. Combina análise fundamentalista e ferramentas quantitativas para identificar empresas líderes, viabilizadoras e adotantes de inovação.", "pros": ["Exposição a temas de inovação global (IA, robótica, defesa, transição energética) com potencial de valorização de longo prazo", "Diversificação internacional com acesso a carteira de ações globais além do mercado brasileiro", "Gestão ativa combinando análise fundamentalista e ferramentas quantitativas", "Situação tributária isenta no nível do fundo de previdência"], "contras": ["Sem hedge cambial: cota exposta diretamente à variação do dólar, gerando volatilidade adicional", "Fundo com histórico de underperformance em relação ao benchmark (2024: fundo +13,50% vs benchmark +25,25%)", "Liquidez restrita: após D+6 do fundo, a seguradora pode levar até 180 dias úteis para disponibilizar o resgate", "Grau de risco elevado (nível 4 de 5), inadequado para investidores conservadores ou com horizonte curto"], "isento_ir": null, "tem_come_cotas": null, "speech_comercial": "### 1. Elevator pitch (30 segundos)\n\nOlha, esse fundo — **PREV INNOVATION DÓLAR 40 CIC FIF RESP LIMITADA** — está na **carteira-modelo oficial Santander de outubro/2026** do perfil Moderado ao Agressivo. É previdência com até 40% em ações globais de inovação — IA, robótica, defesa, energia — **sem hedge cambial**, ou seja, o dólar trabalha a favor do investidor num momento em que o real está pressionado acima de R$ 5,40. Com RV Global em overweight por Santander Asset, XP e Advisory, e o risco Brasil muito alto, colocar parte da previdência nesse veículo é capturar crescimento estrutural lá fora dentro de um invólucro eficiente tributariamente — sem pagar IR no nível do fundo. Deixar a previdência 100% doméstica hoje é abrir mão do único ativo que todo mundo está aumentando.\n\n---\n\n### 2. Versão 2 minutos (reunião curta)\n\n**Por que agora**\n\nOutubro foi o mês mais duro para ativos domésticos desde 2020: Ibovespa -9,88%, real acima de R$ 5,40, curva longa cruzando 15% a.a. Nesse ambiente, Santander Asset, XP e Advisory convergem numa posição: **RV Global em overweight, mantida ou ampliada** — é o único vetor de crescimento que não carrega o risco fiscal brasileiro. Para quem tem a previdência toda alocada em fundos domésticos, o cenário criou um gap real: o portfólio que remunera em reais, num ambiente de incerteza prolongada, está estruturalmente fragilizado. A implicação prática é simples — falta um bloco dolarizado e global dentro da previdência.\n\n**Estratégia e diferencial**\n\nO PREV INNOVATION DÓLAR 40 resolve exatamente esse gap. Aloca até 40% em ações globais com tese de inovação — IA, robótica, defesa, transição energética e blockchain — usando gestão ativa que combina análise fundamentalista e ferramentas quantitativas para selecionar empresas líderes e viabilizadoras desses temas. A parcela restante fica em fundos de renda fixa e ações locais geridos pelo próprio Santander. Sem hedge cambial: o dólar entra como componente de retorno, não como ruído — e com o real onde está, isso é estrutura, não aposta.\n\n**Desempenho e posicionamento**\n\nNos últimos 12 meses, o fundo acumulou **+12,38%** contra **+16,15%** do benchmark (60% CDI + 40% MSCI ACWI INNOV NET BRL). Em 2025, +9,31% vs +12,25% do benchmark. Preciso ser honesto: o fundo tem entregado abaixo do benchmark em todas as janelas disponíveis — em 36 meses, +48,19% vs +67,31% do índice. Isso é um dado real e tem duas leituras: a primeira é que o custo de oportunidade existiu; a segunda é que o fundo atravessou períodos de dólar fraco e compressão de múltiplos globais e ainda assim entregou retorno positivo acumulado relevante. Com o real pressionado e a tese de IA sendo revisitada pelo mercado na direção certa (Lucas Stella, Head de Research Santander Asset, cita exatamente hyperscalers e retorno sobre capital como o próximo catalisador), o posicionamento atual do fundo está mais alinhado ao cenário à frente do que ao que ficou para trás. Rentabilidade passada não garante resultado futuro.\n\n**Pra quem é**\n\nInvestidor qualificado, perfil **Moderado a Agressivo**, horizonte de pelo menos 5–7 anos, que quer diversificação internacional dentro da previdência sem abrir mão da eficiência tributária do veículo. Não é para quem precisa de liquidez no curto prazo — a lâmina deixa claro que, após D+6, a seguradora pode levar até 180 dias úteis para disponibilizar o resgate.\n\n**Custos e liquidez**\n\nTaxa de administração de **1,25% a.a.** + performance de **20% sobre o que exceder o benchmark** (40% MSCI ACWI INNOV em reais + 60% CDI). Cotização D+5, liquidação D+6 — mas a trava real é a seguradora: planeje que esse capital é de longo prazo. O custo faz sentido para quem está comprando gestão ativa global com eficiência tributária de previdência. Comparar 1,25% com um fundo DI é comparar propósitos diferentes.\n\n---\n\n### 3. Versão 5 minutos (conteúdo aditivo)\n\n**Cenário macro completo**\n\nOutubro reprecificou em dias o que levaria meses: curva de 10 anos abriu ~250 bps numa única sessão, Ibovespa perdeu ~14% no pregão seguinte ao 2º turno, e o CDI foi o único ativo doméstico com retorno positivo no mês (+1,07%). O Copom interrompeu o ciclo de cortes, Selic em 13,75%, com sinalização de manutenção prolongada — BTG e XP não descartam reabertura de aperto em 2027 se o IPCA não convergir. Dívida bruta projetada em 88% do PIB em 2027 (BTG), com ~R$ 83 bilhões adicionados ao orçamento pós-eleição sem contrapartida (XP). O quadro fiscal é o principal driver de incerteza — e é exatamente o risco que um fundo com até 40% em RV global e exposição cambial estrutural **hedgeia naturalmente**. A Carta Mensal Santander Asset mantém RV Global em overweight por uma razão objetiva: a resiliência americana (PIB +3,4% anualizado no 3T26, XP) e a tese de IA como vetor de crescimento estrutural continuam intactas, independentemente do que acontece com o fiscal brasileiro. A XP foi além e ampliou para posicionamento sobrealocado em RV global no mês. Para este fundo especificamente: dólar acima de R$ 5,40 valoriza diretamente a parcela global da carteira — o cenário macro trabalha a favor da estrutura do produto.\n\n**Comportamento sob estresse**\n\nFundo de previdência com renda variável global em carteira **marca a mercado diariamente** — em momentos de aversão a risco global (correções de tecnologia, aperto abrupto do Fed, eventos geopolíticos), a cota sofre. A ausência de hedge cambial é faca de dois gumes: protege quando o real deprecia, mas pode amplificar perdas quando o real aprecia fortemente. O grau de risco é 4 de 5 — o fundo não é volátil *apesar* da estratégia, é volátil *por causa* dela, e esse risco é remunerado no horizonte longo. O investidor que olha o extrato todo mês vai sofrer; o que olha de 5 em 5 anos está no lugar certo. Adiciona-se o risco específico que Lucas Stella (Santander Asset) sinalizou: se os hyperscalers não converterem o investimento em IA em retorno sobre capital na escala projetada (~US$ 300 bi em receitas anuais de IA para equilibrar ~US$ 1 tri em capex), as valorizações de tecnologia global são vulneráveis. É por isso que a gestão ativa do fundo — selecionando líderes, viabilizadoras e adotantes — é mais relevante aqui do que comprar um ETF de índice.\n\n**Mecânica tributária**\n\nPrevidência **não tem come-cotas** — sem antecipação semestral de IR em maio e novembro, o capital fica integralmente composto ao longo do tempo, o que gera efeito de juro sobre juro relevante em horizontes longos. O IR incide apenas no resgate, conforme o regime escolhido: tabela **regressiva** (alíquota cai até 10% após 10 anos de acumulação) é a preferível para horizonte longo e praticamente sempre superior ao come-cotas de fundos convencionais. No caso de **PGBL**, há ainda o benefício de dedução de até 12% da renda bruta tributável na declaração completa do IR — valor que, reinvestido, amplifica o patrimônio previdenciário. O fundo também é isento de IR **no nível do fundo**, o que preserva o carrego bruto da carteira interna — o imposto aparece só na saída, não ao longo do caminho.\n\n**Comparação de classe**\n\nUm fundo de renda variável global convencional (não-previdência) com estratégia equivalente teria come-cotas semestral, alíquota regressiva começando em 22,5% e sem a possibilidade do benefício PGBL. Para um investidor que ainda tem 10–20 anos de acumulação, a diferença tributária acumulada pode representar vários pontos percentuais de retorno líquido a mais — sem nenhuma mudança na estratégia subjacente. O invólucro de previdência aqui não é acessório; é parte da tese de retorno.\n\n---\n\n### 4. Objeções esperadas + respostas\n\n**\"O fundo está abaixo do benchmark em todas as janelas — por que eu compraria isso?\"**\nEntendo, e é a objeção mais legítima aqui — não vou desviar dela. O fundo entregou +12,38% em 12 meses contra +16,15% do benchmark, e em 36 meses a diferença é relevante: +48,19% vs +67,31%. O que explica boa parte desse gap é o período de dólar relativamente fraco e a concentração do benchmark num índice de inovação que teve momentos de retorno excepcional — difíceis de capturar na totalidade com gestão ativa diversificada. A pergunta correta não é \"por que ficou atrás\", mas \"o posicionamento atual está certo para o que vem?\". Com real acima de R$ 5,40, RV global em overweight por toda a indústria e a tese de IA no centro da estratégia, o alinhamento entre cenário e fundo hoje é melhor do que foi em boa parte do período histórico. Rentabilidade passada não garante resultado futuro — mas a tese à frente conta.\n\n**\"A liquidez é péssima — 180 dias úteis é mais de 8 meses.\"**\nVocê sente isso, e qualquer pessoa que preza acesso ao capital sente o mesmo. O que descobrimos ao longo do tempo é que essa trava de liquidez, para o capital que é genuinamente de longo prazo — a previdência —, não é um bug, é uma feature: impede o movimento emocional de resgatar em momentos de estresse, que é exatamente quando o custo de sair é mais alto. A pergunta que faço é: qual parcela do seu patrimônio você sabe que não vai precisar por pelo menos 7–10 anos? É só essa parcela que faz sentido aqui. O restante fica em instrumentos com liquidez normal.\n\n**\"Taxa de 1,25% a.a. mais performance é cara demais.\"**\nComparada a um fundo DI, é cara — mas é a comparação errada. O que você está comprando é gestão ativa global, acesso a carteira de ações de inovação, estrutura previdenciária sem come-cotas e exposição cambial estruturada num único produto. Um fundo de ações globais ativo equivalente no mercado convencional custa entre 1,5% e 2,5% a.a., ainda cobra come-cotas e não tem o benefício do PGBL. A taxa de performance só é cobrada se o fundo entregar acima do benchmark — e nesse caso, você já ganhou mais do que o custo.\n\n**\"Já tenho um fundo de previdência. Não preciso de outro.\"**\nQual é a alocação do fundo que você tem hoje em renda variável global e em dólar? Se for próxima de zero, você tem uma carteira de previdência com concentração total no risco Brasil — exatamente o risco que outubro penalizou de forma mais dura. Não é questão de substituir; é questão de equilibrar. A carteira-modelo Santander prevê entre 8% e 24% de previdência neste fundo, dependendo do perfil — não como posição dominante, mas como componente de diversificação estrutural.\n\n**\"E se o dólar voltar para R$ 4,80?\"**\nNesse cenário, a parcela global perde em reais, sim. Mas a estrutura do fundo não é uma aposta de curto prazo no câmbio — é uma posição estrutural em empresas de inovação global que geram resultado em dólares, euros e yenes. O câmbio oscila; a tese de IA e tecnologia como reformatação da economia global é de uma geração inteira. E as projeções de câmbio das principais casas para o fim de 2026 estão entre R$ 5,30 e R$ 5,40 — não há consenso de apreciação agressiva do real enquanto o quadro fiscal não se resolve.\n\n**\"A tese de IA não está inflada?\"**\nÉ a pergunta certa, e a própria Santander Asset levanta isso publicamente — o Head de Research, Lucas Stella, sinalizou em novembro que a régua de exigência para manter a tese sobe: hyperscalers precisam converter ~US$ 1 trilhão em capex em ~US$ 300 bilhões de receitas anuais de IA para justificar as valorizações. É exatamente por isso que o fundo usa gestão ativa para selecionar líderes, viabilizadores e adotantes — não compra o índice de forma indiscriminada. O risco existe, está nomeado e é monitorado. Faz parte do por que o grau de risco é 4 de 5.\n\n---\n\n### 5. Ângulo comercial por perfil API\n\n- **Conservador:** ❌ Não recomendado. Grau de risco 4 de 5, sem hedge cambial, liquidez restrita e histórico de underperformance vs benchmark são incompatíveis com o perfil — o custo emocional e financeiro de uma volatilidade elevada supera qualquer benefício de diversificação nesse caso.\n\n- **Moderado:** A carteira-modelo Santander prevê 8% da previdência aqui — é a dose calibrada para quem quer um bloco global dentro da previdência sem concentrar risco. É o ponto de entrada natural para começar a construir exposição dolarizada com eficiência tributária.\n\n- **Balanceado:** Com 12% na carteira-modelo do mês, é o perfil em que o fundo ganha mais protagonismo: complementa a âncora doméstica com diversificação real em inovação global, num momento em que o Advisory recomenda ampliar alocação internacional como vetor de retorno e proteção ao risco Brasil.\n\n- **Arrojado:** 19% na carteira-modelo — aqui o argumento é produtividade do capital: com RV Brasil em neutro/negativo e curva longa ainda incerta, a RV global é o bloco de risco que faz sentido ampliar. O fundo entrega isso dentro da previdência, com eficiência tributária", "ultima_atualizacao": "2026-11-26", "lamina": "laminas/40005789000198_2.pdf", "lamina_url_original": "https://www.santander.com.br/document/wps/L_4161.pdf", "lamina_tipo_url": "pdf", "lamina_periodo_ref": "2026-10"}, {"nome": "PREV MÁLAGA MULTIMERCADO MULTIESTRATEGIA EQUILIBRIO CIC FIF RESP LIMITADA", "cnpj": "52337734000164", "gestora": "Santander Asset Management", "tipo": "RF", "classe_anbima": "Renda Fixa Duração Livre Grau de Investimento", "classe_santander": "Multimercados", "taxa_adm": 0.009000000000000001, "taxa_perf": "20% sobre o que exceder 100% do CDI", "cotizacao": "D+14", "liquidacao": "D+15", "aplicacao_minima": 100.0, "publico_alvo": "Geral", "estrategia": "Fundo de renda fixa com gestão ativa que busca retornos acima do CDI no longo prazo, operando juros, inflação, moedas e crédito privado. A carteira é composta majoritariamente (89%) por cotas do fundo master SANTANDER MULTIESTRATÉGIA RF CP LONGO PRAZO FIF - RL, complementada por LFTs (11%). Explora oportunidades em diferentes cenários de mercado, com controle de risco baseado em diversificação entre classes.", "pros": ["Histórico consistente: 97,06% dos meses desde o início com retorno positivo", "Diversificação entre juros, inflação, crédito privado e moedas em um único fundo", "Gestão ativa da Santander Asset Management com equipe especializada em renda fixa", "Aplicação mínima acessível de R$ 100,00"], "contras": ["Rentabilidade em 2024 ficou abaixo do CDI (64,91% do CDI no ano), evidenciando risco de desempenho inferior ao benchmark", "Risco de crédito relevante pela exposição a crédito privado, incluindo letras financeiras e debêntures", "Liquidez restrita: prazo de resgate D+14 e crédito apenas em D+15, inadequado para necessidades de curto prazo", "Come-cotas semestral (maio e novembro) reduz o efeito dos juros compostos ao longo do tempo"], "isento_ir": null, "tem_come_cotas": null, "speech_comercial": "### 1. Elevator pitch (30 segundos)\n\nOlha, o PREV MÁLAGA MULTIMERCADO MULTIESTRATEGIA EQUILIBRIO CIC FIF RESP LIMITADA é um fundo de renda fixa ativo da Santander Asset Management com gestão em juros, inflação, crédito privado e moedas — e 97,06% dos meses desde o início com retorno positivo. No cenário de agora, com Selic em 13,75% sem cortes à vista e pós-fixados como âncora defensiva de consenso entre todas as casas, um fundo que captura esse carrego com gestão ativa posicionado em CDI mais spread é exatamente o que faz sentido — deixar capital parado sem a camada de gestão ativa é abrir mão do prêmio que a Santander Asset consegue extrair dentro do mesmo perfil de risco.\n\n---\n\n### 2. Versão 2 minutos (reunião curta)\n\n**Por que agora**\n\nOutubro foi o mês mais duro para carteiras domésticas desde 2020: Ibovespa caiu 9,88%, a curva longa cruzou 15% a.a., e o real ultrapassou R$ 5,40. No meio disso tudo, o CDI entregou +1,07% — único ativo doméstico no positivo. A Carta Mensal da Santander Asset convergiu com BTG e XP num ponto só: pós-fixados em overweight, como âncora do portfólio enquanto o quadro fiscal não se resolve. Com Selic projetada entre 13,50% e 13,75% para o fim de 2026 e sem consenso de corte à vista para 2027, o carrego do CDI segue elevado — e o problema não é capturar CDI, é capturar CDI mais alfa consistente sem precisar sair do perfil de risco conservador/moderado.\n\n**Estratégia e diferencial**\n\nO PREV MÁLAGA opera com 89% da carteira alocada no fundo master SANTANDER MULTIESTRATÉGIA RF CP LONGO PRAZO FIF – RL, complementado por 11% em LFTs. Na prática, é uma estrutura que captura o carrego do pós-fixado e adiciona gestão ativa em juros, inflação, crédito privado e moedas — operando assimetrias de cenário sem mudar a classe do investimento. O controle de risco é feito por diversificação entre essas subclasses, não por concentração em uma aposta.\n\n**Desempenho e posicionamento**\n\nEm outubro/2026, o fundo entregou 1,49% contra 1,07% do CDI — acima do benchmark num mês em que a seletividade foi determinante. No acumulado de 12 meses, o retorno foi de 12,49% contra 14,25% do CDI; em 2025, 13,69% contra 14,31% do CDI. É honesto dizer que o fundo ficou abaixo do CDI em janelas mais longas — em 2024, a lâmina registrou 64,91% do CDI no ano. O que reconcilia essas janelas: em períodos de estresse (abertura de spreads de crédito, como ocorreu em 2024 e parte de 2025), fundos de crédito privado marcam a mercado e sofrem; outubro/2026 — o mês mais difícil — o fundo performou acima do CDI. Isso faz sentido para quem entra agora, quando parte do ajuste de spreads já aconteceu. ⚠️ Rentabilidade passada não garante resultado futuro.\n\n**Para quem é**\n\nPúblico geral, aplicação a partir de R$ 100. Horizonte de médio/longo prazo — a liquidez é D+14 cotização e D+15 crédito, inadequado para reserva de emergência ou necessidade de curto prazo.\n\n**Custos e liquidez**\n\nTaxa de administração de 0,90% a.a. e taxa de performance de 20% sobre o que exceder 100% do CDI. O modelo de performance alinha o incentivo da gestora ao resultado do cotista — a Santander Asset só captura o extra quando entrega acima do CDI. Cotização em D+14, liquidação em D+15; planeje isso no contexto da carteira.\n\n---\n\n### 3. Versão 5 minutos (conteúdo aditivo)\n\n**Cenário macro completo**\n\nO consenso de novembro entre Santander Asset, BTG e XP é incomum pela amplitude: todas as casas convergem em Selic em 13,75% sem cortes imediatos, pós-fixados em overweight e RV Brasil abaixo da alocação estrutural. O que divide as casas é o prazo: Santander Advisory projeta Selic em 13,50% até dezembro/2026 (único corte adicional), enquanto BTG e XP projetam 13,75% até o fim do ano e não descartam reabertura de aperto em 2027. IPCA 2026 projetado entre 4,83% (XP) e 5,40% (BTG) — acima da meta pelo segundo ano. O risco fiscal é o driver central: BTG projeta dívida bruta em 88,0% do PIB em 2027, XP estima ~R$ 83 bilhões de impacto orçamentário das medidas pós-eleição sem contrapartida. Para o PREV MÁLAGA, esse cenário é de fundo favorável: carrego do CDI elevado por mais tempo, janela de gestão ativa para capturar spreads de crédito que voltaram a abrir — e a posição em LFTs como lastro de liquidez interna é consistente com o que a Santander Asset fez na própria carteira proprietária em outubro (zerou direcional, manteve liquidez).\n\n**Comportamento sob estresse**\n\nFundos de renda fixa com crédito privado marcam posições a mercado. Quando spreads abrem — como em 2024 e em momentos de outubro/2026 —, o fundo registra retorno abaixo do CDI mesmo sem inadimplência nos ativos subjacentes; é um efeito de precificação, não de perda permanente de capital. Meses negativos são possíveis, ainda que raros dado o histórico de 97,06% de meses positivos desde o início. Quem entra com horizonte de médio prazo e não precisa da liquidez em D+15 carrega esse risco com conforto — quem precisa da reserva em semanas, não.\n\n**Mecânica tributária**\n\nPor ser um fundo de renda fixa aberto, incide come-cotas semestral em maio e novembro — antecipação da alíquota de IR que reduz o efeito dos juros compostos ao longo do tempo. A tabela regressiva de IR aplica-se ao resgate: 22,5% em aplicações com prazo até 180 dias, chegando a 15% acima de 720 dias. Para horizontes longos (acima de 2 anos), a alíquota de 15% é o piso — planeje o resgate considerando esse prazo.\n\n**Comparação de classe**\n\nDentro da classe pós-fixados, a alternativa mais simples é o CDI puro (fundo DI sem gestão ativa): liquidez diária, sem taxa de performance, sem risco de crédito privado. O PREV MÁLAGA cobra mais e entrega mais risco — a tese é que a gestão ativa da Santander Asset extrai alfa em janelas específicas, como demonstrado em outubro. Para quem quer CDI puro sem volatilidade de spread, o fundo DI básico é mais adequado. Para quem quer o CDI como piso com potencial de superação via gestão ativa e tolera liquidez D+15 e oscilação de curto prazo, o PREV MÁLAGA resolve isso num único veículo com estrutura profissional.\n\n---\n\n### 4. Objeções esperadas + respostas\n\n**\"O fundo ficou abaixo do CDI em 12 meses — por que eu compraria algo que perdeu pro benchmark?\"**\n\nEntendo, e é exatamente o ponto que eu levantaria também. O que os dados mostram é uma janela de 12 meses que captura 2024 — o ano em que o fundo entregou 64,91% do CDI. Esse foi o período de abertura de spreads de crédito privado que penalizou toda a classe, independente da gestora. Em outubro/2026, o mês mais difícil do ano, o fundo entregou 1,49% contra 1,07% do CDI — acima do benchmark quando mais importava. Quem entra agora, pós-abertura de spreads, entra num ponto de carrego atrativo, não no pico. ⚠️ Rentabilidade passada não garante resultado futuro.\n\n**\"A liquidez é D+15 — isso é muito longo, não consigo ficar travado.\"**\n\nFaz todo sentido essa preocupação, e é por isso que esse fundo não substitui a reserva de emergência — precisa estar claro no planejamento da carteira. A pergunta correta é: qual parcela do patrimônio você não vai precisar nos próximos 30 dias? Para essa parcela, D+15 deixa de ser um problema e passa a ser uma característica que justifica o prêmio adicional de gestão. Para o que você precisa de liquidez diária, o fundo DI básico ou o próprio Tesouro Selic resolvem.\n\n**\"A taxa de 0,90% a.a. mais 20% de performance não é cara demais?\"**\n\nRelativamente ao CDI, 0,90% a.a. é uma taxa competitiva para um fundo de gestão ativa com crédito privado e diversificação entre classes. A taxa de performance de 20% sobre o que exceder 100% do CDI só é cobrada quando o fundo entrega acima do benchmark — o incentivo está alinhado. Se o fundo empatar com o CDI, você paga 0,90% a.a. e nada mais. A comparação correta não é com um fundo DI sem gestão; é com o custo de montar individualmente uma carteira de crédito privado diversificada, que exige ticket muito maior e gestão própria.\n\n**\"Já tenho um fundo de crédito privado — qual a diferença?\"**\n\nA diferença está na camada de gestão ativa multi-eixo: além do crédito privado, o fundo opera juros, inflação e moedas como complemento. No cenário atual, em que a curva de juros abriu 93 a 136 bps em outubro e o real depreciou 5,08%, a capacidade de fazer ajustes táticos em moedas e juros dentro do mesmo fundo foi o que permitiu a performance de 1,49% em outubro. Crédito privado puro sem essa gestão ativa ficou mais exposto à marcação.\n\n**\"E se os spreads de crédito abrirem de novo — como aconteceu em 2024?\"**\n\nEssa é a objeção mais legítima, e eu prefiro que você a faça do que descobrir no extrato. Se os spreads voltarem a abrir — risco real dado o cenário fiscal —, o fundo vai sofrer marcação a mercado no curto prazo, como sofreu em 2024. O que mitiga isso é o horizonte de permanência: com 97,06% dos meses positivos desde o início, o histórico mostra que a gestão recupera. O que não mitiga é precisar do dinheiro no momento da abertura. Por isso, D+15 e horizonte de médio prazo são condições de entrada, não detalhes.\n\n**\"Com come-cotas em maio e novembro, não fico em desvantagem em relação a uma LCI ou LCA?\"**\n\nEm termos de tributação isolada, sim — LCI e LCA têm isenção de IR para pessoa física, o que elimina o come-cotas e a tabela regressiva. A comparação correta é no retorno líquido real: LCI/LCA tipicamente remuneram entre 85% e 92% do CDI em emissões de varejo. Com a gestão ativa do PREV MÁLAGA tendo potencial de superar o CDI em janelas de baixa abertura de spreads, o retorno bruto maior pode compensar a diferença tributária para horizontes acima de 2 anos (alíquota de 15%). Para quem tem acesso a LCI/LCA acima de 92% do CDI com prazo compatível, a comparação fica mais justa — e aí a seletividade entre as opções faz sentido.\n\n---\n\n### 5. Ângulo comercial por perfil API\n\n**Conservador:** ⚠️ Use com critério. O fundo tem risco de crédito privado e liquidez D+15 — adequado apenas para a parcela da carteira conservadora com horizonte de médio prazo e sem necessidade de liquidez imediata. O ângulo é o carrego de CDI com gestão ativa dentro do guarda-chuva de renda fixa.\n\n**Moderado:** Núcleo da tese — captura o CDI elevado com potencial de alfa via gestão ativa, dentro da classe pós-fixados que está em overweight no modelo Santander de novembro. Peso sugerido: parcela relevante da fatia de pós-fixados, não o portfólio inteiro.\n\n**Balanceado:** Complementa a âncora defensiva da carteira no momento em que a Santander Asset recomenda pós-fixados em overweight e multimercados abaixo da alocação estrutural. Substitui parcialmente exposição a crédito privado avulso por gestão integrada.\n\n**Arrojado:** Produtividade de capital no eixo defensivo da carteira: enquanto constrói exposição gradual em prefixados e RV global, o pós-fixado ativo garante carrego competitivo sem travar em direcional de juro.\n\n**Agressivo:** Diversificação tática na perna de renda fixa de uma carteira concentrada em risco. Com a curva longa acima de 15% e volatilidade elevada, ter um fundo de gestão ativa CDI+ como âncora libera convicção para as apostas de maior risco sem comprometer o piso de retorno da carteira.", "ultima_atualizacao": "2026-11-17", "lamina": "laminas/52337734000164.pdf", "lamina_url_original": "https://www.santanderassetmanagement.com.br/pessoa-fisica/fundos-de-investimento/renda-fixa/renda-fixa-multiestrategia", "lamina_tipo_url": "html", "lamina_periodo_ref": "2026-10"}, {"nome": "PREV PAMPLONA CRÉDITO PRIVADO MULTIESTRATÉGIA RF CIC RESP LIMITADA", "cnpj": "30102340000194", "gestora": "Santander Asset Management", "tipo": "Previdência", "classe_anbima": "Previdência RF Duração Livre Grau de Investimento", "classe_santander": "Multimercados", "taxa_adm": 0.008, "taxa_perf": "Não há", "cotizacao": "D+3", "liquidacao": "D+5", "aplicacao_minima": null, "publico_alvo": "Profissional", "estrategia": "Fundo de previdência que busca superar o CDI alocando em fundos de renda fixa crédito privado da Santander Asset com diferentes perfis de risco. Combina estratégias complementares (dinâmica, crescimento e ESG) para compor portfólio diversificado de crédito privado. A gestão pode rebalancear entre as estratégias conforme a visão do time, ponderando o risco da carteira. Foco em spreads acima de títulos públicos e aplicações pós-fixadas tradicionais.", "pros": ["100% dos meses desde o início (24 meses) com retorno positivo", "Diversificação entre três estratégias complementares de crédito privado da Santander Asset", "Rentabilidade de 28,07% em 24 meses vs. CDI de 29,89% — aderência elevada ao benchmark", "Situação tributária isenta no nível do fundo de investimento (previdência)"], "contras": ["Risco de crédito relevante — carteira concentrada em crédito privado, sujeita a defaults e abertura de spreads", "Retorno ficou abaixo do CDI em vários meses individuais (ex.: mar/26 72,77% do CDI, out/26 80,74%)", "Liquidez limitada pela estrutura de previdência: resgate D+3 cotização e crédito adicional de até 10 dias úteis pela seguradora", "Risco de concentração em fundos do próprio grupo Santander Asset (sem diversificação de gestora)"], "isento_ir": null, "tem_come_cotas": null, "speech_comercial": "### 1. Elevator pitch (30 segundos)\n\nOlha, o PREV PAMPLONA CRÉDITO PRIVADO MULTIESTRATÉGIA é um fundo de previdência da Santander Asset que busca superar o CDI combinando três estratégias complementares de crédito privado — tudo dentro de uma estrutura PGBL/VGBL, com taxa de 0,80% a.a. e sem taxa de performance. Com a Selic em 13,75% e o consenso de todas as casas apontando pós-fixados em overweight, o carrego de crédito privado sobre o CDI faz sentido agora — e a previdência ancora isso num veículo eficiente tributariamente pra quem pensa no longo prazo. Deixar capital parado fora da previdência enquanto o CDI remunera acima de 13% é abrir mão do benefício fiscal sem nenhuma contrapartida.\n\n---\n\n### 2. Versão 2 minutos (reunião curta)\n\n**Por que agora**\n\nOutubro foi o mês em que o CDI entregou +1,07% enquanto todas as demais classes domésticas perderam — Ibovespa caiu quase 10%, prefixados sofreram abertura brutal, e até o IMA-B fechou no vermelho (-1,03%). A Carta Mensal d
