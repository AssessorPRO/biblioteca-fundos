 fundo investido, custos operacionais e custódia. Para um fundo DI de PL de R$ 3,1 bilhões com gestão de crédito ativa (não é só LFT, tem debêntures e FIDC selecionados), essa taxa está dentro do padrão de mercado para a entrega prometida. O ponto não é a taxa em si, mas o retorno líquido: 97% do CDI com volatilidade de 0,04% e D+0 é uma proposta razoável para o que o fundo se propõe a ser.\n\n**\"O come-cotas vai corroer meu rendimento no longo prazo.\"**\nSim — e é por isso que esse fundo não é recomendado para objetivos de longo prazo, e digo isso abertamente. Para horizonte de 10, 15 anos, a estrutura adequada são fundos de previdência ou isentos de IR. O DI TOP RESP LIMITADA é reserva de caixa, colchão de liquidez, destino temporário entre alocações. Para esse uso, o come-cotas tem impacto marginal. Se o cliente está pensando em longo prazo, o próximo passo da conversa é outro produto.\n\n**\"E se a Selic cair mais rápido do que o projetado?\"**\nÉ um risco real — mas o consenso das quatro casas (Santander Asset, BTG, XP, Santander Advisory) projeta Selic terminal entre 13,75% e 14,00% em 2026, sem projeção abaixo de 13,75%. Para 2027, o piso projetado é 11,5% (XP). Mesmo nesse cenário mais agressivo de cortes, o pós-fixado entregaria carrego real positivo — IPCA projetado entre 5,0% e 5,1% em 2026 — e o fundo funcionaria como reserva de liquidez enquanto a carteira migra gradualmente para outros ativos. O risco de estar em pós-fixado não é de perda; é de oportunidade — e esse custo só se materializa se o cliente não tiver posição em outros ativos que capturem o ciclo.\n\n**\"Tenho crédito privado em outros fundos — não estou duplicando exposição?\"**\nBoa pergunta — e depende do peso total de crédito privado na carteira. Este fundo tem 33% do fundo investido em crédito privado (LFs 20% + debêntures 11% + FIDC 2%), mas o PL do DI TOP está alocado preponderantemente em cotas do fundo investido, que por sua vez tem essa composição. Para carteiras com já tem alocação relevante em crédito privado puro, vale dimensionar o peso total consolidado. Para quem está usando o DI TOP como caixa operacional — não como alocação estratégica de crédito — a sobreposição é marginal e gerenciável.\n\n**\"Há algum risco de crédito relevante nesse fundo?\"**\nSim, existe — e prefiro nomear antes que você pergunte. A carteira tem FIDC (2%) e debêntures (11%) que introduzem risco de crédito residual e marcação a mercado. Em episódios de stress de crédito, esses ativos podem gerar underperformance temporária do CDI. A mitigação está em três fatores: todos os emissores são grau de investimento, o PL de R$ 3,1 bilhões dá robustez operacional e a gestão é da Santander Asset. O risco não é de perda de capital relevante — é de meses abaixo do CDI em cenários adversos. Para quem precisa de zero risco de crédito, a alternativa é Tesouro Selic direto.\n\n---\n\n### 5. Ângulo comercial por perfil API\n\n**Conservador:** âncora principal de liquidez — \"onde o caixa descansa enquanto o mercado não autoriza mais risco\". Carrego de CDI com volatilidade de 0,04% e D+0 é a definição operacional de reserva conservadora.\n\n**Moderado:** peso de caixa e liquidez da carteira — o complemento para os vértices de inflação e crédito privado que o perfil já deve ter. Não rivaliza com os ativos de retorno; serve de buffer operacional.\n\n**Balanceado:** alinhado ao posicionamento neutro em pós-fixados da Carta Mensal Santander Asset de agosto/2026 — é a parte da carteira que carrega sem volatilidade enquanto as posições em IPCA+ intermediário e prefixados de 2–4 anos trabalham.\n\n**Arrojado:** o caixa \"esperto\" — liquidez total D+0 pra capturar oportunidades táticas (entrada em RV Brasil ou internacional em correções) sem perder carrego no intervalo. Não é posição estratégica, é ferramenta de execução.\n\n**Agressivo:** ✅ Aceita, mas com peso mínimo — reserva operacional apenas. O perfil agressivo com carteira concentrada em RV e multimercados precisa de um bolso de liquidez; este fundo cumpre esse papel sem competir com as posições de retorno.", "ultima_atualizacao": "2026-08-12"}, {"nome": "DI VIP RESP LIMITADA", "cnpj": "02910278000121", "gestora": "Santander Asset Management", "tipo": "RF", "classe_anbima": "Renda Fixa Duração Baixa Grau de Investimento", "classe_santander": "Reserva de Emergência", "taxa_adm": 0.005, "taxa_perf": "Não há", "cotizacao": "D+0", "liquidacao": "D+0", "aplicacao_minima": 100.0, "publico_alvo": "Geral", "estrategia": "Fundo DI com objetivo de acompanhar o CDI, investindo por meio de fundos de investimento em títulos de renda fixa públicos e privados (CDBs, Letras Financeiras, Debêntures, FIDC, LFTs e compromissadas). Perfil conservador, baixa volatilidade (0,04% a.a. em 12 meses) e liquidez diária. Carteira majoritariamente composta por LFTs e ativos de alta qualidade de crédito.", "pros": ["Liquidez diária com cotização e crédito em D+0", "Volatilidade extremamente baixa (0,04% em 12 meses), adequado para reserva de caixa", "99,39% dos meses com retorno positivo desde o início (330 meses)", "Grande patrimônio líquido (~R$ 10 bilhões), sinal de solidez e escala"], "contras": ["Taxa global de até 0,50% a.a. pode reduzir a aderência ao CDI em cenários de juro baixo", "Exposição a crédito privado (FIDC, debêntures, LFs) introduz risco de crédito acima de fundo Selic puro", "Come-cotas semestral (maio e novembro) reduz o efeito dos juros compostos", "Rentabilidade histórica levemente abaixo do CDI (~98-99% do CDI na maioria dos períodos)"], "isento_ir": null, "tem_come_cotas": null, "speech_comercial": "### 1. Elevator pitch (30 segundos)\n\n\"Olha, o DI VIP RESP LIMITADA está na posição central pra carteira agora: Selic em 14,00% ao ano, cotização e crédito em D+0, entrada a partir de R$ 100 e taxa global de até 0,50% a.a. — o carrego mensal do CDI em julho foi de 1,22% e o fundo acompanha isso com volatilidade de 0,04% ao ano. O Copom iniciou o ciclo de cortes, mas a Santander Asset projeta Selic travada em 14,00% até o fim de 2026 — ou seja, esse nível de carrego está disponível hoje, e com liquidez imediata. Deixar esse volume em conta corrente ou em produto com liquidez equivalente mas taxa menor é abrir mão de carrego real sem nenhum benefício adicional.\"\n\n---\n\n### 2. Versão 2 minutos (reunião curta)\n\n**Por que agora**\n\nO Copom cortou 25 bps em julho — primeiro corte do ciclo —, mas o tom foi cauteloso e data-dependent. A Santander Asset projeta Selic estacionada em 14,00% até o fim de 2026; XP converge para o mesmo número. Isso significa que o carrego do CDI ainda entrega 1,22% ao mês, com IPCA projetado em 5,0%–5,1% no ano — juro real positivo relevante. Para o DI VIP, esse cenário é o mais favorável possível: o fundo vive do nível da Selic, e enquanto o ciclo de cortes é lento e limitado, o nível de carrego permanece elevado. O custo de ficar fora é concreto.\n\n**Estratégia e diferencial**\n\nO fundo busca acompanhar o CDI investindo em LFTs, compromissadas, Letras Financeiras, debêntures e FIDCs — todos pós-fixados, todos grau de investimento. A carteira é construída pela Santander Asset Management, com ~R$ 10 bilhões de patrimônio líquido: isso dá escala pra acessar ativos de alta qualidade e diversificar o risco de crédito privado que complementa as LFTs. O diferencial operacional é a cotização e liquidação em D+0 — o dinheiro trabalha ontem e está disponível amanhã, sem carência. Para reserva de caixa operacional ou capital aguardando uma alocação mais longa, esse atributo não tem equivalente.\n\n**Desempenho e posicionamento**\n\nNos últimos 12 meses (ref. julho/2026), o fundo rendeu 14,47% contra 14,71% do CDI — aderência próxima de 98% ao benchmark, consistente com o que os contras descrevem (~98–99% do CDI na maioria dos períodos). Em 36 meses: 43,94% vs. 43,95% do CDI — praticamente empatado. Historicamente, 99,39% dos meses desde o início (330 meses) encerraram com retorno positivo. O ponto honesto: a taxa global de até 0,50% a.a. cria um pequeno drag — em cenário de juro muito baixo isso seria relevante, mas com Selic em 14,00%, o custo relativo é mínimo. *Rentabilidade passada não garante resultado futuro.*\n\n**Pra quem é**\n\nPúblico geral, perfil do conservador ao balanceado, qualquer ticket a partir de R$ 100. Ideal como âncora de liquidez, reserva de caixa ou posição de transição enquanto uma alocação mais longa é definida. Não substitui IPCA+ para proteção de longo prazo nem multimercado para busca de alfa — cada um tem sua função.\n\n**Custos e liquidez**\n\nTaxa de administração: 0,50% a.a. (taxa global). Sem taxa de performance. Cotização D+0, liquidação D+0 — sem prazo de carência. Simplicidade total na operação.\n\n---\n\n### 3. Versão 5 minutos (conteúdo aditivo)\n\n**Cenário macro completo**\n\nJulho trouxe uma surpresa desinflacionária relevante: IPCA-15 de +0,06% m/m contra consenso de +0,22%–+0,26%, levando o acumulado em 12 meses a ~4,52%–4,64% — dentro da meta pela primeira vez desde janeiro. O Copom respondeu com o primeiro corte do ciclo, 25 bps, mas manteve tom cauteloso. A implicação direta para o DI VIP: o ciclo existe, mas é lento. Com projeção unânime das quatro casas (Santander Asset, BTG, XP, Santander Advisory) de Selic entre 13,75% e 14,00% no fim de 2026 e Selic 2027 entre 11,5% e 12,75%, o carrego do fundo cai, mas não colapsa no horizonte relevante. O risco que as casas apontam para acelerar os cortes — surpresa desinflacionária persistente — está sendo neutralizado pelo cenário externo: Fed manteve juros em 3,50%–3,75% com três dissidentes pró-alta, petróleo Brent oscilando entre US$ 80 e US$ 100/barril por conta do conflito no Oriente Médio, e Treasuries de 30 anos no maior nível desde 2007. Nenhuma das quatro casas projeta cortes agressivos da Selic enquanto esse quadro externo persistir. Para o DI VIP: o carrego permanece elevado por mais tempo do que o mercado precificava há seis meses.\n\n**Comportamento sob estresse**\n\nComo fundo de renda fixa pós-fixado com duration baixa, o DI VIP é estruturalmente resistente a choques de marcação a mercado: LFTs e compromissadas não sofrem com abertura de curva de juros — ao contrário, se beneficiam de Selic mais alta. O risco estrutural da estratégia está no crédito privado da carteira (debêntures, LFs, FIDCs): num episódio de estresse de crédito, spreads podem abrir e gerar impacto de curto prazo na cota. Esse risco é mitigado pela qualidade dos emissores (grau de investimento) e pelo tamanho do patrimônio (~R$ 10 bi), que permite diversificação e acesso a ativos menos acessíveis a fundos menores. Em termos práticos: não é um fundo Selic puro (benchmark zero de risco de crédito), mas é o mais próximo disso dentro de um produto que busca superar levemente o CDI.\n\n**Mecânica tributária**\n\nPor ser fundo aberto de Renda Fixa, o DI VIP está sujeito ao **come-cotas semestral** (antecipação de IR em maio e novembro) — isso reduz o efeito dos juros compostos ao longo do tempo e é um drag concreto frente a produtos isentos ou sem come-cotas. A alíquota de IR segue a tabela regressiva padrão de RF: 22,5% (até 180 dias) até 15% (acima de 720 dias). Para capital de giro e reserva de caixa com horizonte curto, esse custo é aceitável dado o retorno e a liquidez. Para capital com horizonte longo (acima de 2 anos) em busca de eficiência tributária máxima, outros instrumentos com isenção ou sem come-cotas merecem avaliação complementar.\n\n**Comparação de classe**\n\nEntre as opções de renda fixa pós-fixada, o DI VIP compete diretamente com produtos como CDBs de liquidez diária (que tipicamente carregam risco concentrado em um emissor), contas remuneradas (geralmente com liquidez imediata mas taxa inferior) e outros fundos DI (onde a diferença está na taxa de administração e na qualidade do crédito privado na carteira). O diferencial do DI VIP está na combinação de escala (~R$ 10 bi), gestão ativa de crédito pela Santander Asset, D+0 real e histórico de consistência em 330 meses. O custo de 0,50% a.a. é compatível com a entrega e com o serviço embutido de seleção de crédito privado — não é produto de prateleira genérica.\n\n---\n\n### 4. Objeções esperadas + respostas\n\n**\"A taxa de 0,50% ao ano é alta pra um fundo DI.\"**\nEntendo, essa é uma preocupação legítima — e vale abrir o número. Com Selic em 14,00% ao ano, o custo de 0,50% representa ~3,6% do retorno bruto. O fundo historicamente entrega ~98–99% do CDI, líquido de taxa — ou seja, o drag real no carrego é de cerca de 0,20–0,30% a.a., que é o preço da seleção de crédito privado, da escala de R$ 10 bi e do D+0 garantido. Comparado a um CDB de liquidez diária de banco médio que paga 100% do CDI mas concentra o risco em um único emissor, a diversificação e a gestão ativa que o fundo entrega justificam esse diferencial. E em cenário de juro elevado como o atual, o impacto proporcional da taxa é o menor que já foi.\n\n**\"O fundo fica abaixo do CDI — não é melhor ir direto no Tesouro Selic?\"**\nSente que faz sentido comparar. Muita gente chegou a essa conclusão, mas há dois pontos que mudam a equação: primeiro, o Tesouro Selic tem liquidação em D+1 útil — o DI VIP liquida em D+0, o que pra reserva de caixa operacional tem valor real. Segundo, a diferença de retorno entre o fundo e o Tesouro Selic é marginal em cenário de juro elevado (os dois ficam na faixa de 98–99% do CDI bruto, considerando taxa de custódia do Tesouro e IR equivalente). Para volumes que precisam de mobilidade imediata e que já têm o canal de distribuição Santander consolidado, o DI VIP simplifica a operação sem abrir mão de retorno relevante.\n\n**\"O come-cotas prejudica demais o rendimento no longo prazo.\"**\nCorreto — e esse é o argumento mais técnico contra o fundo. O come-cotas em maio e novembro antecipa o IR e reduz a base de juros compostos. Para capital com horizonte acima de 2–3 anos e sem necessidade de liquidez imediata, produtos sem come-cotas (fundos de ações, previdência, ou isentos) são tecnicamente mais eficientes. O DI VIP é a ferramenta certa para liquidez e caixa de curto/médio prazo — não é o instrumento ideal para capital de longo prazo que você não vai tocar. Se esse capital tem outro perfil, vale discutirmos o produto adequado pra ele.\n\n**\"Tenho exposição a crédito privado em outros fundos — não estou duplicando?\"**\nDepende do que compõe os outros fundos. O crédito privado do DI VIP é concentrado em LFs, debêntures e FIDCs de grau de investimento pós-fixados — perfil conservador, sem duration de crédito longa. Se os outros fundos carregam debêntures de infraestrutura IPCA+, crédito high yield ou FIDCs de segmentos específicos, a sobreposição é menor do que parece. O risco aqui é de crédito de curto prazo em emissores de alta qualidade — que convive bem com posições de crédito de prazo mais longo em outro veículo. Vale mapear o detalhamento da carteira dos outros fundos pra confirmar, mas a duplicação exata é menos provável do que o primeiro olhar sugere.\n\n**\"E se a Selic cair mais rápido que o projetado?\"**\nEntendo a preocupação — mas o risco é assimétrico e gerenciável. Mesmo no cenário mais dovish entre as casas consultadas (Selic a 13,75% no fim de 2026), o carrego mensal do DI VIP ainda seria ~1,15% ao mês — superior à inflação projetada para o período. A questão não é se o fundo perde atratividade num cenário de queda de juros (perde, como qualquer pós-fixado), mas o custo de oportunidade de sair agora: onde você coloca esse capital num produto com D+0, risco equivalente e taxa melhor? Prefixados de prazo equivalente carregam risco de marcação a mercado que o DI VIP não tem. O movimento correto, se o cenário de queda mais rápida se confirmar, é migrar gradualmente para duration mais longa — mas com o diagnóstico macro em mãos, não antecipado sem evidência.\n\n**\"Já tenho a poupança / conta remunerada do banco pra isso.\"**\nMuita gente sente que é suficiente. O que a maioria descobriu ao comparar é que a conta remunerada do Santander paga uma fração do CDI — tipicamente bem abaixo de 100% —, enquanto o DI VIP entrega ~98–99% do CDI com o mesmo perfil de liquidez (D+0) e o mesmo risco de contraparte, dentro do mesmo ecossistema. Na prática: pra qualquer volume acima do mínimo de aplicação, o DI VIP é a conta remunerada de quem quer extrair o máximo do carrego sem abrir mão de segurança e liquidez.\n\n---\n\n### 5. Ângulo comercial por perfil API\n\n- **Conservador:** âncora de liquidez com 99,39% de meses positivos em 330 meses — é o colchão de segurança que carrega bem enquanto a Selic está em 14,00% ao ano e que não dá susto de marcação. Peso recomendado: relevante, como base da alocação.\n\n- **Moderado:** preenche a função de liquidez e caixa operacional dentro da carteira, liberando os outros recursos para IPCA+ intermediário e crédito privado de prazo mais longo — não compete com essas posições, complementa. Alocação tática de 15%–25% dependendo do caixa necessário.\n\n- **Balanceado:** alinha com a visão Santander Asset de neutralidade em pós-fixados; faz a parte \"anestesiada\" da carteira trabalhar ao ritmo do CDI enquanto as posições de risco (IPCA+, RV Global) fazem o trabalho de retorno real. Manter posição como amortecedor de volatilidade.\n\n- **Arrojado:** produtividade do caixa ocioso — o capital que aguarda uma oportunidade de entrada em bolsa global ou IPCA+ longo não precisa ficar parado; o D+0 garante que o dinheiro está disponível imediatamente quando a janela aparecer.\n\n- **Agressivo:** ❌ Não é o produto central para este perfil — o agressivo deve ter proporção mínima em pós-fixado e maximizar exposição a renda variável e ativos de risco. O DI VIP pode servir como colchão operacional para despesas de curto prazo ou capital aguardando alocação, mas não deve ocupar peso estratégico relevante na", "ultima_atualizacao": "2026-08-12"}, {"nome": "RENDA FIXA CRÉDITO PRIVADO VINTAGE LP CIC RESP LIMITADA", "cnpj": "08545860000112", "gestora": "Santander Asset Management", "tipo": "RF", uanto ele ainda existe.\n\n---\n\n### 2. Versão 2 minutos\n\n**Por que agora**\n\nEm julho o Copom cortou a Selic em 25 bps para 14,00% — primeiro corte do ciclo —, mas tanto a Santander Asset quanto a XP projetam Selic terminal em 14% para 2026, com um corte adicional no máximo em agosto. O ciclo será curto e data-dependent. O que isso significa na prática: o carrego do pós-fixado puro vai ceder na margem, mas ainda estamos num dos níveis de juro base mais altos dos últimos anos. A Carta Mensal Santander de agosto posiciona Crédito Privado em neutro com seletividade — e é exatamente aqui que o Vintage LP se encaixa: ele captura o prêmio adicional de crédito sobre o CDI enquanto a base de juros ainda remunera bem. Quem fica só no DI puro perde esse spread; quem migra pra crédito indiscriminado assume risco desnecessário. O meio do caminho seletivo é o produto.\n\n**Estratégia e diferencial**\n\nÉ um fundo de fundos que investe majoritariamente em crédito privado de baixo risco — CDBs, Letras Financeiras e Debêntures —, diversificado entre crédito bancário e corporativo, com exposição a diferentes emissores, setores e prazos. A carteira é composta por 88% no SANT FIRF EQUILI ADV e 12% no SANT REF DI PREM FIC, estrutura que combina otimização de spread com âncora de liquidez. O objetivo é superar o CDI por prêmio de crédito com perfil de risco intermediário — não é retorno de renda variável, é a extração eficiente do que o mercado de crédito privado high grade oferece hoje.\n\n**Desempenho**\n\nOs números da lâmina de julho/2026 falam por si: +14,75% em 12 meses contra +14,71% do CDI; +29,31% em 24 meses contra +29,09%; e +46,28% em 36 meses contra +43,95% do CDI. Consistência, não volatilidade — 98,55% de meses positivos nos 207 meses desde o início. *Rentabilidade passada não garante resultado futuro*, mas o histórico reflete a consistência da estratégia em diferentes ciclos de juro.\n\n**Pra quem é**\n\nPúblico geral, aplicação mínima de R$ 100. Perfil de risco intermediário — quem já entende que crédito privado tem risco de crédito e aceita liquidez diária em troca de carrego acima do CDI. Horizonte recomendado de médio prazo, dado que os ativos de crédito subjacentes não têm liquidez imediata em momentos de estresse.\n\n**Custos e liquidez**\n\nTaxa de administração de 0,40% a.a. — baixa para um fundo ativo de crédito privado gerido pela Santander Asset. Sem taxa de performance. Cotização D+0, liquidação D+1: o cliente resgata hoje e tem o dinheiro amanhã.\n\n---\n\n### 3. Versão 5 minutos — conteúdo aditivo\n\n**Cenário macro completo — a ponte para este fundo**\n\nQuatro casas de research convergem em agosto para o mesmo diagnóstico: ciclo de cortes da Selic iniciado, mas limitado e lento. BTG e Santander Advisory projetam Selic terminal em 13,75%; Santander Asset e XP param em 14% — ou seja, no pior caso pra quem está no pós-fixado, um corte adicional de 25 bps. O IPCA-15 de julho surpreendeu amplamente para baixo (+0,06% m/m, consenso estava em +0,22%), o que criou o ambiente político para o Copom cortar — mas as mesmas casas alertam que expectativas de inflação para 2027–2028 seguem em alta, e o petróleo Brent oscilou entre US$ 80 e US$ 100 em julho, com o conflito no Oriente Médio como risco de cauda real. O Fed manteve juros em 3,50%–3,75% com três dissidentes pró-alta, e o BTG projeta explicitamente uma alta em setembro. Externamente, o cenário não é permissivo: o diferencial de juros Brasil–EUA segue relevante, o que mantém o real suportado no curto prazo mas não abre espaço para o BC brasileiro acelerar os cortes. Para o Vintage LP, essa leitura é diretamente favorável: a Selic alta por mais tempo é a base sobre a qual o prêmio de crédito privado do fundo é empilhado — o fundo não aposta em queda de juro, ele se beneficia da permanência do nível atual.\n\n**Comportamento sob estresse**\n\nFundo de crédito privado marca a mercado: quando spreads de crédito abrem — em episódios de aversão ao risco, eventos de crédito específicos ou iliquidez sistêmica —, a cota pode marcar negativo temporariamente, mesmo sem inadimplência efetiva dos emissores. Adicionalmente, os ativos subjacentes (CDBs, LFs, Debêntures) têm liquidez reduzida no mercado secundário; em cenários de estresse com resgates elevados, o fundo pode ter dificuldade para desinvestir sem impacto de preço. Esse é o risco estrutural da classe — e é por isso que o fundo é adequado para quem tem horizonte de pelo menos médio prazo e não depende do capital para necessidades imediatas. A âncora de 12% em DI puro na carteira (SANT REF DI PREM FIC) funciona exatamente como amortecedor nesse cenário.\n\n**Mecânica tributária**\n\nComo fundo aberto de Renda Fixa, o Vintage LP tem **come-cotas semestral** — antecipação de IR em maio e novembro, alíquota de 15% sobre o ganho do período. A tabela regressiva de IR se aplica ao resgate: 22,5% para prazo inferior a 180 dias, descendo até 15% para mais de 720 dias. Para o cliente que pensa em horizonte acima de 2 anos, a alíquota de 15% já está embutida na comparação — e a taxa de 0,40% a.a. preserva muito mais do retorno bruto do que fundos similares com taxas de 1% ou mais. Não há isenção de IR — diferente de LCIs/LCAs, que são isentas pra pessoa física. A comparação justa é sempre pelo retorno líquido: com carrego histórico acima de 102% do CDI e taxa de 0,40%, o líquido tende a ser competitivo com produtos isentos que pagam 88%–92% do CDI bruto — mas essa conta deve ser feita caso a caso com o prazo e alíquota do cliente.\n\n**Comparação de classe**\n\nNa prateleira de pós-fixados, o Vintage LP está acima do DI puro (sem prêmio de crédito) e abaixo de fundos de crédito high yield ou FIDC (maior risco de crédito, sem liquidez diária). É o ponto de eficiência da curva risco-retorno para quem quer superar o CDI com consistência e manter liquidez adequada — sem precisar abrir mão do resgate D+1 ou assumir risco de crédito elevado.\n\n---\n\n### 4. Objeções esperadas + respostas\n\n**\"A taxa de 0,40% é cara pra um fundo de renda fixa.\"**\nEntendo — muita gente olha a taxa isolada e compara com CDB direto de banco. O que faz sentido avaliar é o retorno líquido de taxa: 102,38% do CDI em 2025 e 105,38% em 2024 já são *após* a taxa de 0,40%. Um CDB que paga 103% do CDI bruto de um banco de menor porte, com risco de crédito concentrado num único emissor e sem liquidez diária, frequentemente fica atrás no líquido — e sem a diversificação de emissores que o fundo entrega.\n\n**\"Tenho medo de crédito privado depois de alguns sustos do mercado.\"**\nFaz todo sentido sentir isso — e boa parte dos clientes que viveram episódios de estresse de crédito ficou mais cuidadosa. O que o Vintage LP faz diferente é focar em grau de investimento, diversificação entre emissores e setores, e manter âncora de liquidez em DI puro. O risco existe — qualquer fundo de crédito marca a mercado —, mas o histórico de 98,55% de meses positivos em 207 meses reflete a disciplina de crédito da Santander Asset na seleção dos emissores.\n\n**\"E se a Selic cair mais rápido do que o esperado e o CDI piorar?\"**\nBoa pergunta — e é exatamente por isso que ter prêmio de crédito acima do CDI importa. Se a Selic cair mais rápido, o CDI puro cede na mesma velocidade; o fundo, por ter spread de crédito embutido, cede menos proporcionalmente. O prêmio de crédito não desaparece junto com o corte de Selic — ele amortece a queda do carrego. E pelo cenário das quatro casas consultadas, o ciclo de cortes em 2026 será curto: Selic terminal entre 13,75% e 14%, o que sustenta o carrego por mais tempo do que o mercado esperava há seis meses.\n\n**\"Tenho LCI/LCA isenta de IR — por que migrar?\"**\nSentido real — a isenção é um benefício concreto. A comparação correta é pelo yield líquido. Uma LCI que paga 92% do CDI isenta equivale, para um cliente na alíquota de 15% (mais de 2 anos), a um fundo que paga ~108% do CDI bruto — número que o Vintage LP não entrega nominalmente. Para prazos mais curtos (alíquota de 22,5%), a conta muda: 92% isento equivale a ~119% do CDI bruto. A LCI/LCA pode vencer na comparação líquida, especialmente em prazos curtos. O argumento para o Vintage LP nesse caso é liquidez diária (D+1 vs. carência típica de 90 dias+), diversificação de emissor e acesso à gestão ativa da Santander Asset — benefícios que têm valor dependendo do momento e das necessidades do cliente.\n\n**\"O fundo sofre come-cotas — isso não corrói o retorno de longo prazo?\"**\nCorroe, sim — e é honesto admitir isso. O come-cotas é uma antecipação de IR que reduz o capital que permanece composto. Para horizontes muito longos (10 anos+), a diferença de juros sobre juros é relevante. A resposta prática: para quem tem horizonte de longo prazo e tolerância a menor liquidez, previdência ou debêntures incentivadas isentas podem ser alternativas complementares a considerar. O Vintage LP é a escolha certa para quem quer liquidez D+1, retorno acima do CDI e gestão ativa de crédito — sem a ambição de ser o instrumento mais eficiente tributariamente para capital que definitivamente não vai ser movimentado por 10 anos.\n\n**\"Não conheço esse fundo — prefiro os de nome mais conhecido.\"**\nA Santander Asset Management é a gestora do Itaú, do Bradesco... não, é a própria asset do Santander — um dos maiores bancos do mundo, com gestão profissional local de crédito privado. O CNPJ 08.545.860/0001-12 é de um fundo com 207 meses de histórico — mais de 17 anos de dados reais. O que torna um fundo \"conhecido\" é o retorno consistente e o gestor por trás — e aqui temos os dois.\n\n---\n\n### 5. Ângulo comercial por perfil API\n\n**Conservador:** O carrego acima do CDI com 98,55% de meses positivos e liquidez D+1 é exatamente o que o perfil conservador precisa como complemento ao DI puro — adiciona prêmio sem abrir mão da previsibilidade. ✅ Recomendado como complemento à âncora pós-fixada.\n\n**Moderado:** Peso natural na carteira pós-fixada do perfil moderado — substitui ou complementa CDB de emissores únicos com diversificação de crédito, carrego consistente e taxa competitiva de 0,40% a.a.\n\n**Balanceado:** Alinhado à orientação de seletividade em crédito privado da Carta Mensal Santander de agosto — ocupa a parcela de pós-fixados de crédito da carteira balanceada sem forçar risco desnecessário num cenário de baixa visibilidade.\n\n**Arrojado:** Para o arrojado, o Vintage LP é a base defensiva da carteira — o carrego estável que financia a volatilidade das posições de maior risco (RV global, prefixados longos). Taxa baixa e liquidez diária garantem que o capital de reserva não fique parado no CDI puro.\n\n**Agressivo:** Num portfólio concentrado em renda variável e ativos de risco, o Vintage LP cumpre função de caixa produtivo — retorno acima do CDI com resgate D+1 para aproveitar oportunidades táticas sem manter capital ocioso.", "ultima_atualizacao": "2026-08-12"}];

  h = h.replace(/^### (.*)$/gm, "<h3>$1</h3>");
  h = h.replace(/^## (.*)$/gm, "<h2>$1</h2>");
  h = h.replace(/^# (.*)$/gm, "<h1>$1</h1>");
  h = h.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  return h;
}

function renderFiltros() {
  const cont = document.getElementById("filtros");
  let html = `<div class="chip ${filtroClasse===null?'ativo':''}" onclick="setFiltro(null)">Todos</div>`;
  for (const c of CLASSES) {
    html += `<div class="chip ${filtroClasse===c?'ativo':''}" onclick="setFiltro('${esc(c)}')">${esc(c)}</div>`;
  }
  cont.innerHTML = html;
}
function setFiltro(c) { filtroClasse = c; render(); }

function fundoVisivel(f) {
  if (filtroClasse && f.classe_santander !== filtroClasse) return false;
  if (termoBusca) {
    const alvo = (f.nome + " " + f.gestora + " " + f.estrategia + " " + f.classe_santander).toLowerCase();
    if (!alvo.includes(termoBusca)) return false;
  }
  return true;
}

function cardHTML(f, idx) {
  let fiscal = "";
  if (f.isento_ir === true) fiscal += `<span class="tag-fiscal tag-isento">Isento IR</span>`;
  if (f.tem_come_cotas === true) fiscal += `<span class="tag-fiscal tag-comecota">Come-cotas</span>`;

  let body = `<div class="linha"><span class="k">Gestora</span><span class="v">${esc(f.gestora)||"—"}</span></div>`;
  body += `<div class="linha"><span class="k">Classe ANBIMA</span><span class="v">${esc(f.classe_anbima)||"—"}</span></div>`;
  body += `<div class="linha"><span class="k">Taxa adm</span><span class="v">${fmtPct(f.taxa_adm)}</span></div>`;
  if (f.taxa_perf) body += `<div class="linha"><span class="k">Taxa perf</span><span class="v">${esc(f.taxa_perf)}</span></div>`;
  if (f.cotizacao) body += `<div class="linha"><span class="k">Cotização</span><span class="v">${esc(f.cotizacao)}</span></div>`;
  if (f.liquidacao) body += `<div class="linha"><span class="k">Liquidação</span><span class="v">${esc(f.liquidacao)}</span></div>`;
  if (f.aplicacao_minima) body += `<div class="linha"><span class="k">Aplic. mínima</span><span class="v">${fmtBRL(f.aplicacao_minima)}</span></div>`;
  if (f.publico_alvo) body += `<div class="linha"><span class="k">Público</span><span class="v">${esc(f.publico_alvo)}</span></div>`;
  if (f.cnpj) body += `<div class="linha"><span class="k">CNPJ</span><span class="v">${esc(f.cnpj)}</span></div>`;
  if (fiscal) body += `<div style="margin-top:8px">${fiscal}</div>`;

  if (f.estrategia) body += `<div class="secao-titulo">Estratégia</div><div style="font-size:13.5px">${esc(f.estrategia)}</div>`;
  if (f.pros && f.pros.length) {
    body += `<div class="secao-titulo">Prós</div><ul class="pros pros-contras">`;
    for (const p of f.pros) body += `<li>${esc(p)}</li>`;
    body += `</ul>`;
  }
  if (f.contras && f.contras.length) {
    body += `<div class="secao-titulo">Contras</div><ul class="contras pros-contras">`;
    for (const c of f.contras) body += `<li>${esc(c)}</li>`;
    body += `</ul>`;
  }
  if (f.speech_comercial) {
    body += `<div class="secao-titulo">🎤 Speech comercial</div><div class="speech">${mdLeve(f.speech_comercial)}</div>`;
  }

  return `<div class="card" id="card${idx}">
    <div class="card-head" onclick="toggle(${idx})">
      <div>
        <div class="card-nome">${esc(f.nome)}</div>
        <div class="card-meta">${esc(f.gestora)||"—"} · taxa ${fmtPct(f.taxa_adm)}${f.speech_comercial?" · 🎤 speech":""}</div>
        <span class="badge">${esc(f.classe_santander)}</span>
      </div>
      <span class="seta">▶</span>
    </div>
    <div class="card-body">${body}</div>
  </div>`;
}

function toggle(idx) {
  document.getElementById("card"+idx).classList.toggle("aberto");
}

function render() {
  const lista = document.getElementById("lista");
  const visiveis = FUNDOS.filter(fundoVisivel);
  document.getElementById("contador").textContent =
    visiveis.length + " fundo(s)" + (filtroClasse ? " em " + filtroClasse : "");
  if (!visiveis.length) {
    lista.innerHTML = `<div class="vazio">Nenhum fundo encontrado.<br>Tente outra busca ou filtro.</div>`;
    return;
  }
  lista.innerHTML = visiveis.map((f, i) => cardHTML(f, FUNDOS.indexOf(f))).join("");
}

document.getElementById("busca").addEventListener("input", e => {
  termoBusca = e.target.value.trim().toLowerCase();
  render();
});

renderFiltros();
render();
</script>
</body>
</html>
