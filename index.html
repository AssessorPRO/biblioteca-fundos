 tese de tecnologia e IA. O speech correto pra o cliente não é \"todo mundo concorda\" — é que a casa que geriu este produto mantém sua tese de convicção mesmo após o mês de volatilidade.\n\n**Comportamento sob estresse**\n\nFundos de renda variável com carteira concentrada têm, estruturalmente, volatilidade acima de ETFs de índice amplo — esse é o grau de risco 5 (máximo) declarado na lâmina. Em movimentos de aversão global a risco, carteiras concentradas sofrem mais no curto prazo do que índices diversificados. A proteção cambial mitiga um vetor de risco, mas não elimina a marcação a mercado das posições em ações: se o S&P 500 corrigir, o fundo corrige também — o hedge é de câmbio, não de mercado. O que a concentração entrega no longo prazo é maior potencial de alfa quando a seleção de empresas é acertada; o que custa é a volatilidade de curto prazo acima da média. Isso não é uma fraqueza a esconder — é o trade-off explícito e correto para um perfil arrojado ou agressivo com horizonte de 3+ anos.\n\n**Mecânica tributária**\n\nClassificado como Multimercado aberto, o fundo está **sujeito a come-cotas semestral** (maio e novembro) — antecipação de IR a 15% sobre os rendimentos. A alíquota final de IR segue tabela regressiva: 22,5% (até 180 dias) → 20% → 17,5% → **15% para prazos acima de 720 dias**. Para o horizonte recomendado de 3+ anos, a alíquota efetiva é 15%. Não há isenção de IR — este não é um fundo de debêntures incentivadas. O come-cotas é o custo de eficiência tributária a considerar; para carteiras Private com horizonte longo, esse custo é precificado no retorno líquido esperado, que historicamente ainda supera alternativas comparáveis no prazo de 24-36 meses, conforme o histórico de alfa do fundo.\n\n**Comparação de classe**\n\nComparado a um ETF de S&P 500 disponível no Brasil: o ETF entrega o índice a custo muito baixo, mas (a) sem hedge cambial — o retorno em reais oscila inteiramente com o dólar; (b) sem geração de alfa — você compra o índice inteiro, incluindo as empresas medianas; (c) sem gestão ativa. O SANT North American Equity Opportunities Reais troca o custo menor do ETF por três atributos: seleção de qualidade pela Morgan Stanley, proteção cambial estrutural e histórico documentado de superar o índice em janelas longas. Para um portfólio Private onde a alocação internacional é posição estrutural — não especulativa —, a questão não é \"ETF ou fundo ativo?\" mas \"qual parcela da exposição internacional merece gestão ativa com hedge?\"\n\n---\n\n### 4. Objeções esperadas + respostas\n\n**\"Em 2026 o fundo ficou abaixo do S&P 500. Por que entrar agora?\"**\nEntendo — e você está certo em apontar isso. O que a janela de 2026 reflete é a combinação de dois efeitos simultâneos: dólar forte no período (que o hedge cambial compensou para baixo, pois quando o dólar sobe sem o hedge o ETF em reais teria subido mais) e um mercado americano que premiou momentum acima de qualidade no curto prazo. As janelas de 24 e 36 meses mostram +47,88% e +97,29% contra +32,78% e +78,44% do S&P 500 em dólares, respectivamente — é nessas janelas que a seleção bottom-up de qualidade se prova. Ativos de qualidade sofrem em janelas curtas de euforia de índice; é exatamente nesses momentos que o ponto de entrada fica mais atrativo.\n\n**\"A proteção cambial pode falhar — o contra da lâmina diz isso.\"**\nSente quem não leu até o fim. O risco de \"exposição residual ao câmbio\" existe — o hedge não é uma garantia contratual de câmbio fixo, é uma estrutura de derivativos que pode ter desvios operacionais. Mas a proposta do fundo não é eliminar 100% do risco cambial — é reduzir substancialmente a volatilidade do dólar sobre o retorno. Para um cliente que quer zero exposição ao câmbio, a alternativa é não ter exposição a ativos externos. Para quem quer a tese americana com risco cambial gerenciado, este é o instrumento mais adequado disponível na prateleira.\n\n**\"Liquidez em D+6 é longa demais para mim.\"**\nD+6 é o prazo correto para uma estratégia de renda variável internacional que opera em mercado offshore. O risco real não é o prazo de resgate — é colocar nesse fundo um capital que você pode precisar em menos de 30 dias. A pergunta certa é: qual parcela do portfólio tem horizonte de 3+ anos e não tem demanda de liquidez no curto prazo? É sobre essa parcela que conversamos alocação aqui.\n\n**\"Taxa de 1% ao ano parece alta comparado a um ETF.\"**\nComparado a um ETF de índice passivo, sim — mas o ETF não tem hedge cambial embutido (o custo do hedge é real e seria pago separadamente ou absorvido como risco), não tem seleção ativa e não tem o histórico de +15pp de alfa em 24 meses documentado na lâmina. O custo relevante não é a taxa bruta — é o retorno líquido de taxa. Nos últimos 24 meses, o alfa gerado foi mais do que suficiente para cobrir qualquer diferença de custo versus o índice.\n\n**\"E se o Fed subir mais do que o esperado e derrubar as bolsas?\"**\nÉ o principal risco externo mencionado por todas as casas — \"Fed higher for longer\". Se o núcleo do PCE não convergir, o Fed pode sinalizar nova alta em 2027 e o Treasury permanece acima de 5% por mais tempo. Isso comprime múltiplos de renda variável globalmente. O que mitiga no fundo: a seleção em empresas com forte geração de caixa própria é exatamente o perfil que performa relativamente melhor em ambiente de juros altos, porque não depende de refinanciamento barato. Não é imunidade — é resiliência relativa. E o hedge cambial elimina o risco de que um dólar mais forte nesse cenário pior ainda penalize duplamente o retorno em reais.\n\n**\"Já tenho exposição internacional via outro fundo/ETF. Por que duplicar?\"**\nA questão não é duplicação — é qualidade da exposição. Se o que você tem é exposição passiva ao índice, sem hedge cambial ou com câmbio aberto, você tem um perfil de risco diferente: carrega o índice inteiro, incluindo empresas medianas, com volatilidade de câmbio sobre o retorno. O SANT North American Equity Opportunities Reais é exposição seletiva — 30 a 45 empresas de alta qualidade — com câmbio gerenciado. São produtos complementares, não substituídos: um dá beta de mercado a baixo custo, o outro entrega alfa de seleção com risco cambial reduzido.\n\n---\n\n### 5. Ângulo comercial por perfil API\n\n**Conservador:** ❌ Não recomendado. Grau de risco 5 (máximo), volatilidade de renda variável concentrada e possibilidade de resgate abaixo do valor investido são incompatíveis com perfil conservador — independentemente do prazo declarado.\n\n**Moderado:** ⚠️ Adequação marginal apenas para a parcela de diversificação internacional de um portfólio moderado já consolidado — e com horizonte mínimo declarado de 3 anos. O ângulo é proteção patrimonial: \"uma pequena posição em qualidade americana, com câmbio gerenciado, reduz a correlação da carteira com o ciclo doméstico.\" Ticket mínimo de R$ 50k e liquidação D+6 precisam estar alinhados ao planejamento de liquidez do cliente.\n\n**Balanceado:** O modelo Santander já está Overweight em RV Global. O ângulo é alinhamento ao posicionamento da casa: \"com a Santander Asset mantendo RV Global em Overweight pelo segundo mês consecutivo, este fundo é o instrumento mais preciso da prateleira para executar essa tese com hedge cambial embutido.\"\n\n**Arrojado:** Produtividade do capital", "ultima_atualizacao": "2026-10-13"}, {"nome": "CRÉDITO PRIVADO EQUILÍBRIO ULTRA DI", "cnpj": "09300207000156", "gestora": "Santander Asset Management", "tipo": "RF", "classe_anbima": "Renda Fixa Duração Baixa Grau de Investimento", "classe_santander": "Reserva de Emergência", "taxa_adm": 0.006, "taxa_perf": "Não há", "cotizacao": "D+0", "liquidacao": "D+1", "aplicacao_minima": 100.0, "publico_alvo": "Geral", "estrategia": "Fundo de cotas que investe majoritariamente em títulos privados de baixo risco de crédito (CDBs, Letras Financeiras, Debêntures), buscando rentabilidade superior às aplicações pós-fixadas tradicionais. Pertence à família de crédito privado de perfil mais conservador, com acompanhamento contínuo e rebalanceamento do portfólio conforme evolução do risco de crédito dos emissores. Composição concentrada em dois fundos subordinados (48% cada) e caixa DI (4%).", "pros": ["Histórico robusto: 99,10% dos meses desde o início foram positivos (220 de 222 meses)", "Perfil conservador dentro do crédito privado, com foco em emissores de baixo risco de crédito", "Liquidez D+0 para resgate com crédito em D+1, oferecendo boa disponibilidade de recursos", "Taxa global máxima baixa de 0,60% a.a., preservando maior parcela do rendimento ao cotista"], "contras": ["Exposição a risco de crédito privado: inadimplência de emissores pode impactar o patrimônio", "Come-cotas semestral (maio e novembro) reduz o efeito dos juros compostos ao longo do tempo", "Rentabilidade em %CDI pode ficar abaixo de 100% do CDI em determinados períodos (ex.: set/26 = 96,42%)", "Risco de concentração em crédito privado — eventos de stress no mercado de crédito podem gerar perdas substanciais"], "isento_ir": null, "tem_come_cotas": null, "speech_comercial": "### 1. Elevator pitch (30 segundos)\n\nOlha, o **Crédito Privado Equilíbrio Ultra DI** é um fundo de renda fixa da Santander Asset com taxa global de **0,60% a.a.** — uma das mais competitivas na classe — e liquidez D+0/D+1. Em **220 dos 222 meses desde o início, o fundo entregou retorno positivo**. Com a Selic em 13,75% e o ciclo de cortes iniciado, o carrego do CDI vai cedendo mês a mês; esse fundo captura o spread de crédito privado de alta qualidade acima do pós-fixado puro, com um custo que não corrói o prêmio. Deixar tudo no CDB bancário padrão enquanto os spreads de crédito comprimem é perder a janela de carrego que ainda está aberta.\n\n---\n\n### 2. Versão 2 minutos (reunião curta)\n\n**Por que agora**\n\nO Copom cortou a Selic para 13,75% em setembro — decisão unânime, sem sinalizar parada — e a Santander Asset projeta mais dois cortes até o fim de 2026, chegando a 13,25%. Cada corte reduz o carrego do pós-fixado soberano puro. Para quem está 100% em CDB ou DI bancário, o rendimento vai sendo comprimido automaticamente sem nenhuma ação. O movimento correto agora é manter o perfil pós-fixado — porque a Selic ainda remunera bem — mas migrar para um veículo que extrai *spread de crédito privado de alta qualidade* acima do CDI, sem abrir mão de liquidez ou elevar o risco de forma relevante.\n\n**Estratégia e diferencial**\n\nO Crédito Privado Equilíbrio Ultra DI investe majoritariamente em CDBs, Letras Financeiras e Debêntures de emissores de baixo risco de crédito, com acompanhamento contínuo e rebalanceamento conforme a qualidade dos emissores evolui. A composição é concentrada em dois fundos subordinados (48% cada) e caixa DI (4%), estrutura que permite gestão ativa de crédito pela Santander Asset sem abrir mão da fluidez do portfólio. O perfil é o mais conservador dentro do universo de crédito privado da casa.\n\n**Desempenho e posicionamento**\n\nOs números da lâmina de setembro/2026 mostram: **14,19% em 2025** (CDI: 14,31%) e **44,21% em 36 meses** (CDI: 44,04%) — no prazo longo, o fundo superou o CDI. Em 2026 e nos últimos 12 meses, ficou marginalmente abaixo do CDI (10,35% vs. 10,51% em 2026; 14,21% vs. 14,48% em 12 meses), reflexo da abertura de spreads no mercado de crédito — que, aliás, cria o melhor ponto de entrada: o fundo carrega papéis com spread mais generoso, e quando os spreads fecharem, o retorno se beneficia duplamente. *Rentabilidade passada não garante resultado futuro.*\n\nEm termos de consistência, **99,10% dos meses desde o início foram positivos** — 220 de 222. Não é zero risco, mas é um dos históricos mais estáveis da categoria.\n\n**Para quem é**\n\nInvestidor de perfil Conservador a Moderado, com horizonte de pelo menos médio prazo e necessidade de liquidez adequada. Aplicação mínima de R$ 100.\n\n**Custos e liquidez**\n\nTaxa de administração global máxima de **0,60% a.a.** — baixa para a classe, o que preserva a maior parcela do spread de crédito para o cotista. Sem taxa de performance. Cotização D+0, liquidação D+1: você resgata hoje e tem o recurso amanhã.\n\n---\n\n### 3. Versão 5 minutos (conteúdo aditivo)\n\n**Cenário macro completo — por que o crédito privado conservador tem lugar agora**\n\nA Santander Asset está **Overweight em pós-fixados** neste mês — uma das promoções mais relevantes da Carta de outubro — exatamente porque o carrego de 13,75% ainda é excepcional com baixo risco. Ao mesmo tempo, a visão de crédito privado na casa é **Neutro**, com alerta explícito para seletividade: spreads em leve abertura, captação líquida negativa na categoria, e eventos de crédito recentes elevando a volatilidade dos fundos de crédito médio e longo prazo. BTG passou a *subalocar* crédito privado no ajuste de outubro; XP alerta para perda de atratividade relativa conforme a Selic cede. O que isso implica para este fundo especificamente: a escolha da **qualidade do emissor e da duration curta** é o diferenciador que separa o crédito privado conservador — que permanece relevante como complemento ao CDI — do crédito privado de risco médio, que está no centro das preocupações do mercado. O Equilíbrio Ultra DI está posicionado no primeiro grupo.\n\nNo cenário externo, o Fed elevou juros para 3,75%–4,00%, o Treasury de 10 anos ultrapassou 5% e o petróleo operou acima de US$ 108/barril no mês. Para o crédito privado doméstico, esse pano de fundo não é diretamente transmitido — o que importa é o ciclo local da Selic e a qualidade dos emissores na carteira. O real valorizou 0,2% contra o dólar em setembro, na contramão da depreciação de emergentes, o que reforça o argumento de que o Brasil tem dinâmica própria neste momento.\n\n**Comportamento sob estresse**\n\nFundos de crédito privado marcam os títulos a mercado. Quando os spreads de crédito abrem — como ocorreu pontualmente em 2026, evidenciado pelo desempenho marginalmente abaixo do CDI no ano e no período de 12 meses — o valor da cota sofre pressão transitória. Eventos de crédito em emissores relevantes do mercado (mesmo que não na carteira do fundo) podem contaminar o fluxo de resgates da categoria como um todo, criando episódios de marcação negativa mesmo em fundos de alta qualidade. O histórico de 220 meses positivos em 222 não elimina esse risco — mitiga. O ponto de controle é a qualidade dos emissores, o monitoramento contínuo da Santander Asset e a baixa duration, que reduz a sensibilidade a movimentos de curva.\n\n**Mecânica tributária**\n\nPor ser fundo aberto de Renda Fixa, está sujeito ao **come-cotas semestral** (maio e novembro) — antecipação de IR que reduz o efeito dos juros compostos ao longo do tempo. A alíquota de IR segue a tabela regressiva: 22,5% em prazos curtos, caindo para 15% acima de 720 dias. Este é o principal custo tributário a considerar na comparação com LCIs/LCAs isentas; para horizontes acima de 2 anos, a diferença de alíquota compensa em parte pelo spread de crédito e pela taxa competitiva do fundo.\n\n**Comparação de classe**\n\nDentro da classe pós-fixada, o Equilíbrio Ultra DI compete com CDBs bancários e fundos DI puros. O diferencial está no *spread de crédito privado* que a estratégia captura — algo que um fundo DI referenciado em títulos públicos não entrega. Comparado a LCIs/LCAs, o fundo perde na isenção de IR, mas ganha em liquidez D+1 (vs. carência mínima de LCI/LCA), em gestão ativa do portfólio de crédito e na taxa de administração que não corrói o prêmio. Para carteiras Private com necessidade de liquidez real — não apenas nominal — o fundo é o complemento natural do caixa estratégico.\n\n---\n\n### 4. Objeções esperadas + respostas\n\n**\"A taxa de 0,60% a.a. come o retorno — prefiro o CDB direto.\"**\nEntendo essa lógica — muita gente sente que pagar taxa num fundo pós-fixado não vale. O que descobrimos, olhando os 36 meses do fundo: o retorno acumulado de 44,21% superou o CDI de 44,04% *após* a taxa de 0,60% a.a. A taxa é coberta pelo spread de crédito que a gestão captura. No CDB direto, você ainda tem o risco de concentração em um emissor e sem gestão ativa de crédito.\n\n**\"Em 2026 e nos últimos 12 meses o fundo ficou abaixo do CDI.\"**\nCorreto — e é importante ser honesto sobre isso. A abertura de spreads de crédito em 2026 pressionou a marcação dos fundos da categoria. Mas olhando o prazo de 36 meses, o fundo superou o CDI. O ponto de entrada hoje, com spreads já abertos, é mais favorável: o portfólio carrega papéis com remuneração mais generosa, e o fechamento natural dos spreads ao longo do ciclo de afrouxamento monetário tende a beneficiar o retorno à frente.\n\n**\"Tenho risco de crédito privado — se um emissor der calote, perco?\"**\nEssa é a objeção certa de fazer. Sim, existe risco de crédito — é o principal risco da estratégia, e está explícito no regulamento. O que mitiga: foco em emissores de baixo risco de crédito (grau de investimento), diversificação entre CDBs, Letras Financeiras e Debêntures, e monitoramento contínuo da Santander Asset com rebalanceamento conforme o risco dos emissores evolui. Não é risco zero — é risco gerenciado ativamente, com histórico de 220 meses positivos em 222.\n\n**\"O come-cotas semestral me prejudica vs. LCI/LCA isenta.\"**\nÉ uma desvantagem real para quem tem horizon de mais de 2 anos e consegue comprar LCI/LCA com spread equivalente. Para horizonte mais curto ou quando o spread de crédito do fundo supera o da LCI disponível no mercado — o que é frequente em papéis de qualidade — o resultado líquido do fundo pode ser competitivo. Vale comparar o retorno líquido caso a caso; posso fazer esse exercício com você.\n\n**\"E se a Selic não cair como o mercado projeta — o fundo sofre?\"**\nNa direção inversa do que você imagina: se a Selic ficar mais alta por mais tempo, o carrego dos títulos pós-fixados na carteira fica mais alto, não menor. O risco de queda de carrego é maior para quem está em prefixados ou IPCA+. O Equilíbrio Ultra DI é referenciado DI — quanto maior a Selic, maior o rendimento bruto. O risco real aqui é de crédito dos emissores, não de nível de juros.\n\n**\"Já tenho um fundo DI da Santander — qual a diferença?\"**\nO fundo DI investe majoritariamente em títulos públicos federais e opera muito próximo de 100% do CDI. O Equilíbrio Ultra DI adiciona crédito privado de alta qualidade — CDBs, Letras Financeiras, Debêntures — buscando retorno *acima* do CDI via spread de crédito, com taxa de administração que não corrói esse prêmio. São complementares: DI para liquidez imediata e zero risco de crédito; Equilíbrio Ultra DI para o carrego incremental com risco controlado.\n\n---\n\n### 5. Ângulo comercial por perfil API\n\n- **Conservador:** O fundo é o upgrade natural do DI puro — mesmo perfil pós-fixado, mesma liquidez D+1, mas com spread de crédito de alta qualidade que preserva poder de compra enquanto a Selic cede. Horizonte de médio prazo, aplicação a partir de R$ 100.\n\n- **Moderado:** Complementa a posição em IPCA+ e prefixados como âncora de liquidez com carrego acima do CDI puro — equilíbrio entre retorno incremental e disponibilidade de caixa para oportunidades táticas.\n\n- **Balanceado:** Funciona como reserva estratégica de liquidez dentro do modelo Santander: enquanto a alocação em renda variável e IPCA+ captura os grandes vetores de retorno do mês, o Equilíbrio Ultra DI mantém o caixa trabalhando acima do CDI sem travar prazo.\n\n- **Arrojado:** Parte menor da carteira, mas relevante como âncora de liquidez ativa — melhor que deixar caixa parado no DI puro enquanto as posições mais agressivas (bolsa, IPCA+ longo) carregam a performance.\n\n- **Agressivo:** ❌ Não é o veículo principal para este perfil — o retorno incremental vs. CDI não justifica o peso de alocação em carteiras focadas em alfa. Pode compor caixa estratégico residual (5–10% max), mas não é o fundo desta reunião para esse perfil.", "ultima_atualizacao": "2026-10-13"}, {"nome": "DI ADVANCED RESP LIMITADA", "cnpj": "26507128000130", "gestora": "Santander Asset Management", "tipo": "RF", "classe_anbima": "Renda Fixa Duração Baixa Grau de Investimento", "classe_santander": "Reserva de Emergência", "taxa_adm": 0.003, "taxa_perf": "Não há", "cotizacao": "D+0", "liquidacao": "D+0", "aplicacao_minima": 100.0, "publico_alvo": "Geral", "estrategia": "Fundo que investe, por meio de fundos de investimento (FIF), em títulos de renda fixa públicos e privados (CDBs, Letras Financeiras, Debêntures, FIDC, entre outros) que buscam acompanhar o CDI. A carteira é composta majoritariamente por LFT (35%), Compromissada (32%), Letras Financeiras (20%), Debêntures (10%) e FIDC (2%), com foco em qualidade de crédito e baixa volatilidade.", "pros": ["Liquidez diária com aplicação, resgate e crédito em D+0", "Volatilidade muito baixa (0,04% em 12 meses), adequado para gestão de caixa", "Histórico consistente: 111 meses positivos de 112 desde o início (99,11%)", "Taxa global máxima de apenas 0,30% a.a., estrutura de custo competitiva"], "contras": ["Presença de crédito privado (FIDC, debêntures) introduz risco de crédito mesmo em fundo conservador", "Come-cotas semestral (maio e novembro) reduz o potencial de capitalização composta", "Retorno atrelado ao CDI — em cenário de queda de juros, o rendimento absoluto diminui", "Sem garantia do FGC; exposição concentrada em poucos tipos de ativos de crédito privado"], "isento_ir": null, "tem_come_cotas": null, "speech_comercial": "### 1. Elevator pitch (30 segundos)\n\nOlha, o DI Advanced tem **99,11% de meses positivos desde o início** e entrega liquidez total no dia — aplicação, resgate e crédito em D+0, com taxa global de apenas **0,30% a.a.** Com a Selic em 13,75% e o Copom já em ciclo de cortes, esse fundo funciona como âncora de caixa de alta qualidade: carrego CDI real, volatilidade de 0,04% ao ano, sem susto. O custo de não usá-lo é deixar a reserva operacional em conta corrente ou num produto mais caro — dinheiro parado nunca trabalhou bem.\n\n---\n\n### 2. Versão 2 minutos\n\n**Por que AGORA**\n\nO Copom cortou a Selic para 13,75% em setembro — decisão unânime, sem sinalizar encerramento do ciclo. A Santander Asset projeta 13,25% ao fim de 2026; XP vai ainda mais longe, projetando 11,50% em 2027. Isso significa que o carrego do CDI cederá nos próximos meses. Para a parcela da carteira que precisa de liquidez imediata — reserva operacional, caixa de oportunidade para aproveitar abertura de janelas em bolsa e IPCA+ — o que importa é **eficiência agora**: menor custo possível, maior liquidez possível, sem risco de marcação a mercado.\n\n**Estratégia e diferencial**\n\nO DI Advanced investe por meio de fundos (FIF) em LFT (35%), Compromissadas (32%), Letras Financeiras (20%), Debêntures (10%) e FIDC (2%) — carteira majoritariamente soberana e de alta qualidade, calibrada pra acompanhar o CDI com spread de crédito incremental e volatilidade mínima. O resultado é um fundo que praticamente não oscila: **0,04% de volatilidade em 12 meses**. Para caixa de oportunidade — a munição que o cliente Private precisa ter líquida quando um ativo abre — essa é a estrutura certa.\n\n**Desempenho e posicionamento**\n\nNos últimos 12 meses, o fundo entregou **14,45% contra 14,48% do CDI** — praticamente colado no benchmark, o que é exatamente o que se espera de um produto dessa natureza. Em 36 meses, **44,61% contra 44,04% do CDI** — o fundo superou o benchmark no acumulado longo, refletindo o spread do crédito privado na carteira. Em 2026 (até setembro), **10,51% vs. 10,51% do CDI** — paridade exata. Rentabilidade passada não garante resultado futuro, mas o histórico de 112 meses mostra consistência: apenas 1 mês negativo desde o início.\n\n**Pra quem é**\n\nPúblico geral, aplicação mínima de R$ 100. Adequado a todos os perfis como componente de **reserva de caixa e liquidez** — não substitui estratégias de longo prazo, mas é o lugar certo pra manter o capital que precisa estar disponível amanhã.\n\n**Custos e liquidez**\n\nTaxa de administração de **0,30% a.a.** — uma das estruturas mais competitivas do mercado para essa classe. Sem taxa de performance. Cotização D+0, liquidação D+0. O fundo é tipo RF com come-cotas semestral (maio e novembro), o que deve ser considerado no planejamento tributário — detalho na seção seguinte.\n\n---\n\n### 3. Versão 5 minutos — conteúdo aditivo\n\n**Cenário macro completo e implicação para este fundo**\n\nSetembro/2026 combinou dois movimentos opostos: lá fora, o Fed subiu juros para 3,75%–4,00% e o Treasury de 10 anos ultrapassou 5% pela primeira vez desde 2007 — ambiente que pressiona emergentes e sustenta dólar forte. Aqui dentro, o Copom cortou, a bolsa avançou 5% e o real valorizou contra a maré da depreciação latina. A Santander Asset encerrou a posição em inclinação de curva e passou a overweight em juros nominais e renda variável doméstica simultaneamente — mudança de postura relevante.\n\nPara o DI Advanced, a implicação é direta: **o fundo não vai entregar mais retorno absoluto conforme a Selic cai — mas também não vai entregar menos qualidade**. Ele resolve um problema específico que não some com a queda de juros: a necessidade de liquidez imediata com custo zero de desvio. Em portfólio Private bem construído, a fatia de caixa de oportunidade tem que estar num instrumento que não travar o cliente quando uma assimetria aparecer — prefixado longo, IMA-B 5+, bolsa em queda pontual. O DI Advanced é essa camada. O risco de mantê-lo como âncora de caixa não é de perda — é de subclassificação: quem usa esse fundo para alocar capital de longo prazo está desperdiçando retorno potencial. Usado corretamente, é insubstituível.\n\n**Comportamento sob estresse**\n\nFundos de renda fixa DI com crédito privado marcam os ativos a mercado. Em episódios de abertura de spreads de crédito — como os que o mercado brasileiro registrou em momentos de aversão a risco sistêmico — a parcela de Letras Financeiras, Debêntures e FIDC pode sofrer repricing pontual, gerando retorno temporariamente abaixo do CDI ou, em casos mais severos, dias negativos. A diversificação da carteira (maioria em LFT soberana e compromissadas) mitiga esse risco significativamente, mas ele existe: o fundo não tem garantia do FGC. Esse é o trade-off que a gestora aceita para entregar o spread incremental de crédito no longo prazo — e é exatamente por isso que o histórico de apenas 1 mês negativo em 112 é um dado de qualidade de gestão, não de sorte.\n\n**Mecânica tributária**\n\nFundo de Renda Fixa, portanto sujeito a **come-cotas semestral** (maio e novembro): antecipação de IR à alíquota de 20% (ou 15%, dependendo do prazo de aplicação), que reduz o número de cotas e comprime o efeito dos juros compostos ao longo do tempo. IR no resgate segue tabela regressiva: 22,5% (até 180 dias) → 20% (181–360 dias) → 17,5% (361–720 dias) → 15% (acima de 720 dias). Para capital que ficará por prazo curto e com giro frequente, esse drag é pequeno. Para capital de longo prazo, o come-cotas é o principal argumento para migrar para estruturas isentas ou previdência — o DI Advanced não é o instrumento certo para esse objetivo.\n\n**Comparação de classe**\n\nDentro da classe pós-fixada, o DI Advanced compete com fundos DI de grandes gestoras e com CDBs de liquidez diária. Sua vantagem estrutural é a combinação de **taxa de 0,30% a.a. + gestão ativa de crédito privado + liquidez D+0 total** — CDBs de liquidez diária costumam pagar entre 95%–100% do CDI com menor diversificação; fundos DI mais caros (0,50%–1,00% a.a.) entregam o mesmo perfil de risco com custo superior. O diferencial aqui é a eficiência da estrutura de custo, não o retorno absoluto — que, por design, é CDI.\n\n---\n\n### 4. Objeções esperadas + respostas\n\n**\"A Selic vai cair — esse fundo vai render menos.\"**\nEntendo, e é exatamente isso que vai acontecer com qualquer produto pós-fixado, incluindo CDB DI e conta remunerada. A questão não é se o DI Advanced vai render menos em termos absolutos — vai, como todo CDI. A questão é: o que você coloca no lugar da reserva de caixa? Se mover esse capital para IPCA+ ou prefixado, perde liquidez imediata. Se mantiver em conta corrente, perde o spread. O DI Advanced não é uma aposta no nível da Selic — é a estrutura de menor custo para manter capital disponível. Essa função não desaparece com a queda de juros.\n\n**\"Tem risco de crédito — eu queria algo sem risco.\"**\nSinto que essa preocupação é legítima — muita gente olha para um fundo conservador e assume garantia total. O ponto é que o fundo tem 72% da carteira em ativos soberanos (LFT) e compromissadas, com apenas 12% em debêntures e FIDC. O risco de crédito existe, mas é periférico e gerido ativamente pela Santander Asset. O histótrico confirma: 111 meses positivos de 112. Para capital que precisa de proteção total e tem FGC como premissa, um CDB de banco de primeira linha pode ser a alternativa — mas abre mão da diversificação e da gestão ativa do spread.\n\n**\"Come-cotas tira o poder dos juros compostos.\"**\nCorreto — e eu não vou esconder isso. O come-cotas de maio e novembro antecipa o IR e comprime o efeito de capitalização. Por isso, para capital de longo prazo — acima de 2–3 anos — a conversa certa é sobre IPCA+ isento, previdência ou estruturas de debêntures incentivadas. O DI Advanced é o instrumento da reserva de curto prazo e do caixa de oportunidade. Cada real que fica aqui mais do que 12–18 meses é capital que merece uma conversa sobre realocação.\n\n**\"Taxa de 0,30% é mais caro do que minha LCI.\"**\nA LCI não tem come-cotas e é isenta de IR — então o retorno líquido pode ser superior em prazo curto. O diferencial do DI Advanced é a liquidez total: D+0 de aplicação e resgate, sem carência. LCI de banco costuma ter liquidez apenas no vencimento ou em janelas específicas. Para capital que você sabe que não vai precisar, a LCI vence no comparativo líquido. Para caixa de oportunidade — que precisa estar disponível amanhã —, o DI Advanced é imbatível em liquidez e custo.\n\n**\"Já tenho um DI parecido em outra gestora.\"**\nEntendo. A diferença que vale checar é a taxa. Fundos DI de mesma classe costumam variar de 0,30% a 1,00%+ a.a. — essa diferença, em 36 meses, representa dezenas de basis points no retorno acumulado. Adicionalmente, a Santander Asset entrega gestão ativa do crédito privado dentro do portfólio, o que no histórico gerou 57bps de alpha acumulado em 36 meses vs. CDI. Se o custo do fundo atual for superior, o movimento natural é consolidar aqui.\n\n**\"E se os spreads de crédito abrirem e o fundo der negativo num mês?\"**\nÉ um risco real, e quem já estava em 2015–2016 sabe como crédito privado pode se comportar em estresse. O que mitiga aqui: 67% da carteira está em ativos soberanos e quase-soberanos (LFT + compromissadas), e a gestora tem histórico de apenas 1 mês negativo em 112. Em episódio de abertura severa de spreads, o fundo pode ter dias abaixo do CDI — mas o portfólio está calibrado para que o impacto seja residual. Esse não é o instrumento para especular com crédito; é o instrumento de menor volatilidade possível com um spread incremental defensivo.\n\n---\n\n### 5. Ângulo comercial por perfil API\n\n- **Conservador:** âncora perfeita de reserva de caixa — 0,30% a.a., D+0 e 99,11% de meses positivos entregam a estabilidade que esse perfil exige para o capital de curto prazo. Para o horizonte longo, a conversa migra para IPCA+.\n\n- **Moderado:** complementa a carteira como colchão de liquidez para aproveitar oportunidades táticas em IPCA+ e bolsa — peso recomendado como reserva operacional (10–15% da carteira), não como posição estrutural.\n\n- **Balanceado:** alinha-se ao papel de caixa de oportunidade no modelo Santander — mantém o capital disponível para rebalanceamentos rápidos conforme o cenário eleitoral e o ciclo de cortes avançam.\n\n- **Arrojado:** função única de estacionamento de liquidez entre movimentos táticos; não é posição de retorno — é a garagem do capital que espera a próxima assimetria em bolsa ou crédito.\n\n- **Agressivo:** ✅ recomendado apenas como reserva mínima de liquidez operacional. Capital de longo prazo deste perfil deve estar em renda variável, multimercados e IPCA+ longo — o DI Advanced entra só na fatia que precisa de disponibilidade imediata.", "ultima_atualizacao": "2026-10-13"}, {"nome": "DI TOP RESP LIMITADA", "cnpj": "22918180000128", "gestora": "Santander Asset Management", "tipo": "RF", "classe_anbima": "Renda Fixa Duração Baixa Grau de Investimento", "classe_santander": "Reserva de Emergência", "taxa_adm": 0.006999999999999999, "taxa_perf": "Não há", "cotizacao": "D+0", "liquidacao": "D+0", "aplicacao_minima": 100.0, "publico_alvo": "Geral", "estrategia": "Fundo referenciado DI que busca acompanhar as variações do CDI investindo preponderantemente em cotas de fundos de investimento. A carteira do fundo investido (Renda Fixa Referenciado DI FIF Responsabilidade Limitada) é composta por LFT (35%), compromissada (32%), letras financeiras (20%), debêntures (10%) e FIDC (2%), com postura cautelosa e seletiva na alocação em crédito privado.", "pros": ["Liquidez diária com aplicação, resgate e crédito em D+0", "Baixa volatilidade — votabilidade de 0,04% em 12 meses e 99,24% de meses positivos desde o início", "Gestão ativa de crédito com equipe especializada da Santander Asset Management", "Aplicação inicial acessível de R$ 100,00"], "contras": ["Retorno abaixo do CDI na maioria dos períodos (96,76% do CDI em 2026, 97,12% em 2025)", "Exposição a risco de crédito privado via debêntures, letras financeiras e FIDC (32% combinados)", "Come-cotas semestral (maio e novembro) reduz a eficiência da capitalização composta", "Não conta com garantia do FGC"], "isento_ir": null, "tem_come_cotas": null, "speech_comercial": "## Presença na Recomendação Mensal Santander\n\n*Dado não fornecido — não mencionado.*\n\n---\n\n### 1. Elevator pitch (30 segundos)\n\n\"Olha, o **DI Top Resp Limitada** é a posição de liquidez que não te custa nada ter: entrada a partir de R$ 100, resgate e crédito no mesmo dia — D+0 —, gestão ativa de crédito da Santander Asset, e 99,24% dos meses positivos desde o início. Com a Selic em 13,75% e o Copom ainda cortando, o pós-fixado de qualidade segue sendo o colchão de carteira mais eficiente que existe hoje; o custo de ficar em pior liquidez ou em crédito privado mal gerido não se justifica enquanto esse carrego está de pé.\"\n\n---\n\n### 2. Versão 2 minutos (reunião curta)\n\n**Por que AGORA**\n\nA Carta Mensal Santander de outubro promoveu pós-fixados de Neutro para **Overweight** — movimento simultâneo com a promoção de prefixados e IPCA+. A leitura da casa é que a Selic em 13,75% ainda remunera excepcionalmente bem com risco mínimo, mesmo com o ciclo de cortes iniciado. A projeção Santander Asset é Selic em 13,25% ao fim de 2026 — ou seja, ainda há dois cortes de 25bps no horizonte, o que significa que cada mês que o cliente mantém uma posição de liquidez mal estruturada (conta corrente, poupança, produto de custo elevado) é um mês de carrego deixado na mesa.\n\n**Estratégia e diferencial**\n\nO fundo é referenciado DI — objetivo de acompanhar o CDI — com carteira composta majoritariamente por LFT (35%), compromissada (32%) e letras financeiras (20%), completada por debêntures (10%) e FIDC (2%) com postura seletiva. A gestão ativa de crédito da Santander Asset faz a triagem dos emissores privados; o cliente não precisa fazer isso sozinho. O resultado é uma volatilidade de **0,04% em 12 meses** — praticamente linha reta para cima.\n\n**Desempenho e posicionamento**\n\nNos últimos 12 meses, o fundo entregou **13,98% contra 14,48% do CDI** no mesmo período — equivalente a 96,52% do CDI. Em 2025, 97,12% do CDI; em 2026 (até setembro), 96,76% do CDI. O fundo carrega um custo de taxa que explica esse diferencial; é a conta honesta de pagar por liquidez D+0, gestão ativa e uma estrutura de 99,24% de meses positivos. *Rentabilidade passada não garante resultado futuro.*\n\n**Pra quem é**\n\nPúblico geral, qualquer perfil API, ticket a partir de R$ 100. Funciona como âncora de liquidez da carteira — a posição que o cliente acessa sem carência, sem marcação a mercado relevante, sem susto no extrato.\n\n**Custos e liquidez**\n\nTaxa de administração de **0,70% a.a.**, sem taxa de performance. Aplicação, resgate e crédito em **D+0** — o fundo mais líquido que existe na prateleira de fundos. O custo de 0,70% a.a. é o preço da gestão ativa, da liquidez imediata e da seletividade de crédito que vem embutida.\n\n---\n\n### 3. Versão 5 minutos (conteúdo aditivo)\n\n**Cenário macro completo**\n\nA Carta Mensal Santander de outubro traz um cenário doméstico incomum: o Brasil se descolou dos emergentes em setembro — real valorizando 0,2% enquanto moedas latinas depreciaram 3,8% em média, Ibovespa +5,03% no mês, curva de juros nominais fechando 62bps nos vértices longos. O Copom cortou a Selic para 13,75% em decisão unânime. A projeção Santander Asset para a Selic ao fim de 2026 é 13,25%; para o IPCA, 5,0% — levemente acima do teto da meta de 4,5%. Externamente, o Fed elevou para 3,75%–4,00% e o Treasury de 10 anos superou 5% pela primeira vez desde 2007. Implicação direta para o DI Top: o diferencial de juros Brasil-EUA ainda sustenta o carrego do pós-fixado em patamar historicamente elevado, mesmo com os cortes em andamento.\n\n**Comportamento sob estresse**\n\nFundo de renda fixa referenciado DI com crédito privado (32% combinados em debêntures, letras financeiras e FIDC) sofre em dois cenários específicos: abertura de spreads de crédito, que pode comprimir o retorno relativo no curto prazo; e eventos de crédito em emissores da carteira do fundo investido, que geram marcação a mercado pontual — raro, mas possível. A baixa volatilidade histórica (0,04% em 12 meses) reflete a qualidade da seleção e a baixa duration, mas não imuniza contra um estresse de crédito sistêmico. O cenário atual — Santander Asset em postura neutra/cautelosa para crédito privado, com captação negativa na classe — reforça que a gestão ativa de emissores aqui não é detalhe, é o diferencial principal.\n\n**Mecânica tributária**\n\nPor ser fundo aberto de renda fixa, incide **come-cotas semestral** (maio e novembro) — antecipação de IR à alíquota de 20% (prazo curto) ou 15% (prazo longo), conforme a tabela regressiva. Esse é um ponto cadastrado como contra relevante: o come-cotas reduz a eficiência da capitalização composta vs. produtos isentos (LCA/LCI, debêntures incentivadas). Para o cliente que compara com LCI/LCA, a conversa correta é: LCI/LCA tem carência e teto de emissão — o DI Top entrega liquidez D+0 irrestrita, que tem valor para o caixa operacional do patrimônio. Para reserva de longo prazo, produtos isentos costumam ganhar líquido; para liquidez de curto prazo, o fundo se justifica.\n\n**Comparação de classe**\n\nEntre as opções de pós-fixado com liquidez imediata, o DI Top compete com fundos DI de gestoras sem gestão ativa de crédito (que costumam ter 100% LFT/compromissada) e com contas remuneradas bancárias. O diferencial é a combinação de crédito seletivo — que historicamente eleva o retorno bruto sobre o CDI puro de LFT — com a estrutura da Santander Asset e sem carência. Para reservas que o cliente definitivamente não vai tocar em 2+ anos, IPCA+ ou prefixados capturam prêmio superior; o DI Top é a posição certa para a parcela de liquidez que precisa estar disponível amanhã.\n\n---\n\n### 4. Objeções esperadas + respostas\n\n**\"O fundo entrega só 97% do CDI — prefiro uma LCA que é isenta.\"**\nEntendo, muita gente olha isso e sente que está pagando pra ter menos. O que descobrimos comparando: LCA tem carência mínima de 9 meses e volume limitado por emissão — quando você precisa de R$ 500 mil amanhã, a LCA não está disponível. O DI Top entrega D+0 sem teto; o desconto de ~3% do CDI é o custo da liquidez irrestrita, não da gestão ruim. Para a parcela de liquidez operacional do patrimônio, esse custo se paga. Para reserva longa, concordo que produtos isentos ganham — e aí conversamos o que faz sentido separar.\n\n**\"A taxa de 0,70% a.a. parece alta pra um DI.\"**\nSinto que essa comparação é natural. O que a taxa compra aqui: gestão ativa de crédito da Santander Asset sobre os 32% da carteira em debêntures, letras financeiras e FIDC, além de liquidez D+0 numa estrutura de fundo. Fundo DI puro de LFT com taxa zero existe — e entrega zero gestão ativa. A pergunta certa não é \"a taxa é alta?\", é \"o que você recebe por ela?\" — e aqui você recebe a triagem de crédito que evitou o default que o cliente que foi no emissor errado pagou caro.\n\n**\"Come-cotas semestral me incomoda — perde na capitalização composta.\"**\nVerdade, e prefiro que você saiba disso antes do extrato de novembro do que depois. O come-cotas existe e comprime o juro sobre juro. Dito isso, duas pontes: primeiro, ele é um adiantamento de IR — você paga antes, não paga a mais; o custo real é o custo de oportunidade desse capital adiantado. Segundo, como vimos acima, o DI Top serve pra liquidez de curto prazo; pra horizonte longo, onde o come-cotas dói mais, a conversa muda de produto.\n\n**\"Não tem FGC — e se tiver problema?\"**\nFaz sentido, muita gente sente isso. O que descobrimos olhando a composição: 35% em LFT (título soberano), 32% em compromissada (operação lastreada em título público), 20% em letras financeiras de emissores bancários — e apenas 12% em crédito privado de menor liquidez. O risco real está nos 12% finais; FGC não cobre fundo de investimento de nenhuma gestora do mercado, então a comparação correta não é fundo vs. LCI — é a qualidade da seleção de crédito embutida na carteira. A Santander Asset tem equipe dedicada a isso.\n\n**\"E se a Selic cair mais rápido do que o esperado?\"**\nAí o DI Top entrega menos em termos absolutos — ele é indexado ao CDI, então segue a Selic para baixo. Mas dois pontos: primeiro, mesmo nas projeções mais dovish (XP projeta 11,50% ao fim de 2027), o pós-fixado ainda remunera positivamente acima da inflação projetada — não é uma posição que prejudica, é uma posição que rende menos. Segundo, o movimento correto nesse cenário é o que a Carta Santander já recomenda: manter o DI Top como âncora de liquidez e migrar o excedente para IPCA+ ou prefixados enquanto a janela de entrada ainda está aberta.\n\n**\"Já tenho outro fundo DI — qual a diferença?\"**\nDepende de qual. Se for fundo DI puro sem crédito privado, a diferença é a gestão ativa de crédito embutida aqui — que em mercado normal eleva o retorno bruto; em mercado de estresse, é onde a qualidade da gestora separa os fundos. Se for fundo DI com taxa mais alta, a conta é simples: 0,70% a.a. com a estrutura da Santander Asset vs. o custo do outro. Se for fundo com liquidez D+1 ou D+2, você está pagando em liquidez algo que pode ser zero de custo aqui.\n\n---\n\n### 5. Ângulo comercial por perfil API\n\n**Conservador:** ✅ O DI Top é a posição-âncora de liquidez ideal — volatilidade de 0,04% em 12 meses, D+0 irrestrito, gestão ativa de crédito da Santander Asset. Mantém o caixa de curto prazo remunerado sem susto no extrato.\n\n**Moderado:** Encaixa como reserva de liquidez da carteira — aloca aqui o que o cliente pode precisar em até 30 dias e libera o restante para migração para IPCA+ e prefixados, conforme a Carta Santander recomenda este mês.\n\n**Balanceado:** Com a carteira-modelo Santander promovendo pós-fixados para Overweight, o DI Top cumpre o papel de âncora da classe dentro do target — o fundo mais líquido e gerido da prateleira pós-fixada, sem travar duration.\n\n**Arrojado:** Posição residual de caixa: o que sobra após alocar em bolsa, IPCA+ e prefixados fica aqui — D+0 sem custo de oportunidade de carência, pronto pra ser realocado na próxima assimetria que aparecer.\n\n**Agressivo:** Reserva tática de curtíssimo prazo entre movimentos: o DI Top é o estacionamento do capital entre uma saída e uma entrada — a alternativa a deixar dinheiro parado em conta corrente enquanto o próximo trade não fecha.", "ultima_atualizacao": "2026-10-13"}, {"nome": "DI VIP RESP LIMITADA", "cnpj": "02910278000121", "gestora": "Santander Asset Management", "tipo": "RF", "classe_anbima": "Renda Fixa Duração Baixa Grau de Investimento", "classe_santander": "Reserva de Emergência", "taxa_adm": 0.005, "taxa_perf": "Não há", "cotizacao": "D+0", "liquidacao": "D+0", "aplicacao_minima": 100.0, "publico_alvo": "Geral", "estrategia": "Fundo referenciado em CDI que investe por meio de fundos de investimento em títulos de renda fixa públicos e privados (CDBs, Letras Financeiras, Debêntures, FIDC, LFT e compromissadas), buscando acompanhar o CDI com baixa volatilidade. A carteira atual é composta majoritariamente por LFTs (35%), compromissadas (32%), Letras Financeiras (20%), debêntures (10%) e FIDC (2%), com gestão seletiva e cautelosa em crédito privado.", "pros": ["Liquidez diária com resgate e crédito em D+0, adequado para gestão de caixa", "Baixíssima volatilidade: 0,04% nos últimos 12 meses e 99,4% de meses positivos desde o início", "Taxa global máxima de 0,50% a.a., custo reduzido para fundo com crédito privado", "Aplicação mínima de apenas R$ 100,00, acessível a qualquer investidor"], "contras": ["Presença de FIDC (2%) e debêntures (10%) implica risco de crédito privado acima de fundos puramente soberanos", "Come-cotas semestral reduz o poder dos juros compostos no longo prazo", "Retorno sistematicamente abaixo do CDI (98,42% do CDI em 2026), não captura o CDI integralmente", "Risco de concentração em ativos de crédito privado em cenários de estresse, como spreads observados em setembro"], "isento_ir": null, "tem_come_cotas": null, "speech_comercial": "## Presença na Recomendação Mensal Santander\n\n*(Não foram fornecidos dados de `presenca_recomendacao` para este fundo — a prova social institucional não será mencionada.)*\n\n---\n\n### 1. Elevator pitch (30 segundos)\n\nOlha, o **DI VIP RESP LIMITADA** entrega liquidez diária — resgate e crédito em D+0 — com volatilidade de apenas 0,04% nos últimos 12 meses e taxa global de 0,50% a.a., que é custo reduzido para um fundo que já carrega crédito privado seletivo. Com a Selic ainda em 13,75% e o Copom em ciclo de cortes, esse fundo faz o papel que ele tem que fazer: preserva o caixa do cliente com carrego CDI e zero surpresa de marcação — enquanto o resto da carteira captura as assimetrias de duration e bolsa que o cenário abriu.\n\n---\n\n### 2. Versão 2 minutos (reunião curta)\n\n**Por que AGORA**\n\nA Selic caiu para 13,75% — e todas as casas projetam novos cortes: Santander Asset e XP convergem em 13,25% ao fim de 2026, com XP enxergando 11,50% até o fim de 2027. Isso significa que o carrego do CDI vai cedendo mês a mês. Ao mesmo tempo, o cenário abre assimetrias relevantes em IPCA+, prefixados e bolsa — o que exige que a parcela de caixa da carteira esteja num veículo que não atrapalhe: liquidez imediata, sem volatilidade, custo baixo. A Carta Mensal Santander Asset de outubro promoveu pós-fixados para Overweight justamente por isso — ainda remuneram excepcionalmente bem com risco mínimo, mas o papel deles agora é ser a base de manobra, não o destino final.\n\n**Estratégia e diferencial**\n\nO DI VIP RESP LIMITADA é um fundo referenciado em CDI gerido pela Santander Asset Management. Investe por meio de outros fundos em LFTs (35%), compromissadas (32%), Letras Financeiras (20%), debêntures (10%) e FIDC (2%) — todos com grau de investimento. A gestão é seletiva e cautelosa em crédito privado: o fundo captura um spread incremental sobre o CDI puro sem abrir mão do perfil de baixo risco. Classe ANBIMA \"Duração Baixa Grau de Investimento\" — o nome técnico que confirma o que o fundo promete.\n\n**Desempenho e posicionamento**\n\nNos últimos 12 meses: **14,22% vs. CDI de 14,48%** — ou seja, 98,12% do CDI. Em 2025, **14,14% vs. CDI de 14,31%**. Em 24 meses: **29,12% vs. CDI de 29,70%**. Em 36 meses: **43,76% vs. CDI de 44,04%**. O fundo ficou consistentemente abaixo do CDI integral — e isso é esperado: a estrutura de crédito privado e o come-cotas semestral implicam um carrego líquido entre 98% e 99% do CDI. O ponto positivo é que 99,4% dos meses desde o início foram positivos. *Rentabilidade passada não garante resultado futuro.*\n\n**Pra quem é**\n\nPúblico geral, aplicação mínima de R$ 100. É o veículo de caixa e reserva de liquidez por excelência — adequado para qualquer perfil como componente de liquidez imediata, não como aposta de retorno.\n\n**Custos e liquidez**\n\nTaxa de administração global máxima de **0,50% a.a.** — custo competitivo para um fundo com crédito privado seletivo. Sem taxa de performance. Cotização e liquidação em **D+0**: você resgata hoje, cai hoje na conta. Come-cotas semestral (maio e novembro) — antecipação de IR que reduz marginalmente o efeito dos juros compostos no longo prazo.\n\n---\n\n### 3. Versão 5 minutos (conteúdo aditivo)\n\n**Cenário macro completo**\n\nA convergência entre Santander Asset, BTG e XP em outubro é rara: renda fixa local, renda variável Brasil e bolsas globais foram simultaneamente para Overweight na Carta Mensal Santander. O gatilho foi a combinação do primeiro corte do Copom (Selic de 14,00% para 13,75%, decisão unânime) com o resultado do 1º turno eleitoral — Ibovespa +7,7% no pregão seguinte, dólar recuando para R$ 5,00. O IPCA projetado entre 5,0% (Santander) e 5,3% (BTG) segue acima do teto da meta, e o diferencial de juros Brasil-EUA estreitou com o Fed elevando o Fed Funds para 3,75%–4,00% e o Treasury 10y ultrapassando 5%. Para o DI VIP RESP LIMITADA, esse cenário é direto: a Selic ainda remunera bem no curto prazo, mas cada corte de 25bps reduz o carrego do fundo — o que reforça seu papel de **reserva tática de liquidez**, não de motor de retorno da carteira.\n\n**Comportamento sob estresse**\n\nFundos referenciados em CDI com crédito privado — como o DI VIP — sofrem principalmente quando os spreads de crédito abrem de forma abrupta. Num evento de estresse (crise de liquidez, deterioração fiscal severa, rebaixamento de emissor relevante), a carteira marca a mercado e pode registrar retorno negativo pontual, ainda que em magnitude pequena dado o prazo curto dos ativos. O próprio histórico aponta: em setembro/2026, com spreads em leve abertura, o fundo rendeu 1,05% vs. CDI de 1,08% — o impacto foi marginal, mas o risco de crédito dos 12% alocados em debêntures e FIDC existe e não deve ser subestimado. A concentração nesses instrumentos é o principal diferencial de risco em relação a um fundo soberano puro.\n\n**Mecânica tributária**\n\nFundo de Renda Fixa aberto → **come-cotas semestral** em maio e novembro, com alíquota de 15% (prazo superior a 720 dias de aplicação) ou 20% (prazo de 360 a 720 dias). Imposto de Renda regressivo no resgate: 22,5% até 180 dias → 20% de 181 a 360 dias → 17,5% de 361 a 720 dias → 15% acima de 720 dias. **Não é isento** de IR. Para comparação com LCI/LCA isentas: o retorno bruto precisa superar o líquido dos instrumentos isentos pelo fator tributário — ao carrego atual (~98% do CDI líquido de taxa), o fundo compete com LCI/LCA que paguem abaixo de 85% do CDI bruto para prazos longos. Para caixa de curto prazo (abaixo de 360 dias), onde o imposto regressivo ainda está alto, a comparação piora um pouco — mas a liquidez D+0 do fundo é um atributo que LCI/LCA normalmente não oferecem.\n\n**Comparação de classe**\n\nNa classe pós-fixados, o espectro vai de fundos soberanos puros (100% LFT, CDI integral antes de taxa, sem risco de crédito, sem come-cotas em alguns estruturados) até fundos de crédito privado agressivos (spreads maiores, maior volatilidade, horizonte mais longo). O DI VIP ocupa a faixa intermediária-conservadora: adiciona crédito privado de forma seletiva e em proporção controlada, com taxa de 0,50% a.a. e liquidez imediata — o que o torna mais adequado como reserva de caixa sofisticada do que como posição de carrego de longo prazo.\n\n---\n\n### 4. Objeções esperadas + respostas\n\n**\"O fundo rende menos que o CDI — por que não investir direto no CDI ou numa LFT?\"**\n\nEntendo — e é uma pergunta excelente. Muita gente sente essa diferença entre 98% e 100% do CDI como uma perda. O que descobrimos é que, para caixa com liquidez D+0, o fundo entrega algo que a LFT direta não oferece: acesso a partir de R$ 100, gestão de crédito privado já embutida que historicamente agrega prêmio sobre o soberano puro, e operação simplificada sem necessidade de custodiante habilitado. A diferença de carrego — em torno de 0,26% a.a. nos 12 meses — é o custo dessa conveniência e da gestão. Para um caixa operacional, esse spread é justificável.\n\n**\"O come-cotas semestral não corrói o retorno no longo prazo?\"**\n\nVocê está certo — e é importante ser honesto sobre isso. O come-cotas antecipa IR em maio e novembro, reduzindo o capital que rende juros compostos. Para horizontes acima de 2 anos, esse efeito é real e cresce com o tempo. Por isso, o DI VIP faz sentido como **reserva de liquidez e caixa de curto prazo**, não como posição estratégica de longo prazo. Para o horizonte longo, o movimento correto — e o que o cenário de outubro indica — é migrar para IPCA+ e prefixados onde a isenção (no caso de debêntures incentivadas) ou o fechamento de curva compensam com folga esse custo.\n\n**\"Tenho 12% em debêntures e FIDC — e se houver um evento de crédito?\"**\n\nSentir essa preocupação é natural — e o risco existe de fato. O que foi descoberto, e que mitiga, é que a gestão da Santander Asset Management aplica critérios seletivos e cautelosos na escolha desses emissores, todos com grau de investimento. A volatilidade dos últimos 12 meses foi de 0,04% — e mesmo num mês de abertura de spreads como setembro/2026, o impacto foi de apenas 3bps abaixo do CDI. Para a parcela de crédito privado dentro desse fundo, o tamanho (12%) e o perfil de duration curto limitam a exposição ao evento adverso. Dito isso, se o cliente busca risco soberano puro, existe o produto certo para isso.\n\n**\"A taxa de 0,50% a.a. não é alta para um fundo DI?\"**\n\nÉ uma pergunta legítima. A taxa parece elevada para um fundo soberano puro — mas aqui ela é global máxima (inclui todos os custos dos fundos investidos) e compra gestão ativa de crédito privado com track record de baixíssima volatilidade. Para referência: fundos DI puros costumam cobrar entre 0,20% e 0,50% a.a. sem nenhuma exposição a crédito. O DI VIP, ao adicionar debêntures e FIDC de forma seletiva dentro dessa mesma faixa de custo, entrega um prêmio incremental que, historicamente, cobriu a taxa com margem.\n\n**\"E se a Selic cair mais rápido do que o esperado — o fundo não perde atratividade?\"**\n\nExatamente o cenário que o mercado discute. XP projeta Selic em 11,50% ao fim de 2027 — queda de quase 225bps a partir de hoje. Nesse cenário, o carrego do fundo cai na mesma proporção, porque ele é referenciado em CDI. É por isso que o papel do DI VIP é de **ancoragem de liquidez**, não de tese de retorno. O caminho certo para quem quer capturar o ciclo de queda de juros é alongar duration — prefixados e IPCA+ são os instrumentos que apreciam quando a curva fecha. O DI VIP fica como a reserva que permite girar a carteira quando a oportunidade aparecer, sem forçar resgate de ativos de longo prazo no pior momento.\n\n---\n\n### 5. Ângulo comercial por perfil API\n\n**Conservador:** ✅ Encaixa como reserva de liquidez e caixa de curto prazo — 0,04% de volatilidade e D+0 são os atributos centrais. Não é o motor de retorno; é o colchão que permite dormir bem enquanto a carteira é rebalanceada para IPCA+.\n\n**Moderado:** A posição ideal é como componente de liquidez (10–20% da carteira), complementando IPCA+ e prefixados que capturam o fechamento de curva. Alinhado com a visão Overweight em pós-fixados da Carta Santander de outubro — mas como âncora, não como posição principal.\n\n**Balanceado:** O DI VIP ocupa o papel de \"reserva tática\": mantém a liquidez necessária para girar a carteira quando o 2º turno eleitoral ou os dados de inflação mudarem o cenário — sem abrir mão de carrego. Peso sugerido pelo modelo Santander: componente de caixa dentro da classe pós-fixados.\n\n**Arrojado:** Utilidade marginal — o capital aqui deveria estar majoritariamente em bolsa, IPCA+ longo e prefixados. O DI VIP cabe apenas como caixa operacional residual ou como veículo de estacionamento temporário entre operações.\n\n**Agressivo:** ❌ Não recomendado como posição estratégica — o custo de oportunidade de manter capital em CDI num perfil agressivo, com bolsa a 9,1x P/L e juros reais longos em patamar histórico, é alto demais para se justificar além de uma reserva mínima de liquidez operacional.", "ultima_atualizacao": "2026-10-13"}, {"nome": "RENDA FIXA CRÉDITO PRIVADO VINTAGE LP CIC RESP LIMITADA", "cnpj": "08545860000112", "gestora": "Santander Asset Management", "tipo": "RF", "classe_anbima": "Renda Fixa Duração Livre Grau de Investimento", "classe_santander": "Reserva de Emergência", "taxa_adm": 0.004, "taxa_perf": "Não há", "cotizacao": "D+0", "liquidacao": "D+1", "aplicacao_minima": 100.0, "publico_alvo": "Geral", "estrategia": "Fundo que investe majoritariamente, por meio de fundos de investimento, em títulos privados de baixo risco de crédito (CDBs, Letras Financeiras, Debêntures), com carteira diversificada entre crédito bancário e debêntures, com exposição a diferentes emissores, setores e prazos. Pertence à família de crédito privado de perfil de risco intermediário, com benchmark CDI e gestão ativa de rebalanceamento.", "pros": ["Carteira diversificada em crédito privado de baixo risco, historicamente acima do CDI (102,38% do CDI em 2025)", "Taxa global máxima reduzida de 0,40% a.a., preservando maior retorno líquido ao investidor", "Elevada consistência: 98,56% de meses positivos em 209 meses de histórico", "Liquidez D+0 para resgate com crédito em D+1, favorecendo agilidade"], "contras": ["Risco de crédito privado: inadimplência ou deterioração dos emissores pode impactar o patrimônio", "Sem garantia FGC, sem cobertura de seguro ou do administrador", "Come-cotas semestral (maio e novembro) reduz o efeito dos juros compostos ao longo do tempo", "Concentração estrutural: 87% alocado em um único fundo (SANT FIRF EQUILI ADV), reduzindo diversificação efetiva"], "isento_ir": null, "tem_come_cotas": null, "speech_comercial": "### 1. Elevator pitch (30 segundos)\n\nOlha, o **Vintage LP CIC** entrega crédito privado de alta qualidade — CDI+ diversificado em CDBs, Letras Financeiras e Debêntures — com taxa global máxima de **0,40% a.a.** e liquidez D+0/D+1. Em 36 meses acumulou **45,71% vs 44,04% do CDI**, com **98,56% de meses positivos** em 209 meses de histórico. Com a Selic iniciando ciclo de corte e a Santander Asset promovendo pós-fixados para **Overweight** justamente agora, o carrego de um fundo que consistentemente supera o CDI líquido com risco de crédito criterioso é o lugar certo pra ancorar a parte defensiva da carteira — deixar esse dinheiro parado num pós-fixado bancário de prateleira é pagar mais taxa pra entregar menos resultado.\n\n---\n\n### 2. Versão 2 minutos (reunião curta)\n\n**Por que agora**\n\nO Copom cortou a Selic de 14,00% para 13,75% em setembro, e todas as casas — Santander Asset, BTG, XP — convergem em pelo menos mais um corte de 25bps em novembro. A Carta Mensal de outubro posicionou pós-fixados em **Overweight**, justamente porque o carrego nominal ainda remunera excepcionalmente bem enquanto o ciclo não avança, mas o mercado já cobra o preço de quem fica parado: a janela de entrar num fundo de crédito que entrega CDI+ com baixo risco se fecha progressivamente conforme a taxa de referência cede. O problema não é o momento — é o fundo escolhido pra navegar esse trecho.\n\n**Estratégia e diferencial**\n\nO Vintage LP CIC investe por meio de fundos em títulos privados de **baixo risco de crédito** — CDBs, Letras Financeiras e Debêntures — com gestão ativa de rebalanceamento pela **Santander Asset Management**. O objetivo é superar o CDI com carteira diversificada por emissor, setor e prazo, mantendo grau de investimento. A gestão ativa de rebalanceamento é o que separa esse fundo de uma cesta passiva: a mesa de crédito da casa ajusta a composição conforme o ciclo de spreads, o que explica a consistência histórica.\n\n**Desempenho e posicionamento**\n\nEm 2025 o fundo entregou **14,65% vs CDI de 14,31%**. Em 36 meses, **45,71% vs 44,04% do CDI** — geração de alfa consistente num horizonte relevante. Em 2026 (jan–set), **10,56% vs CDI de 10,51%** — acompanhando o benchmark num ano de compressão de spreads, o que por si só valida a seletividade da carteira: não deteriorou. Em setembro/2026 especificamente, 1,06% vs CDI de 1,08% — praticamente empatado, dentro do ruído normal de curto prazo.\n\n*Rentabilidade passada não garante resultado futuro.*\n\n**Pra quem é**\n\nFundo de público geral, aplicação mínima de **R$ 100**. Encaixa nos perfis Moderado a Arrojado como âncora pós-fixada de qualidade. Horizonte recomendado: médio prazo, com liquidez disponível. Não substitui reserva de emergência pura dado o come-cotas, mas cumpre papel de carrego eficiente.\n\n**Custos e liquidez**\n\nTaxa global máxima de **0,40% a.a.** — sem taxa de performance. Cotização D+0, crédito em conta D+1. Em termos práticos: você resgata hoje e o dinheiro chega amanhã, com custo entre os menores da classe de crédito privado ativo no mercado.\n\n---\n\n### 3. Versão 5 minutos (conteúdo aditivo)\n\n**Cenário macro completo**\n\nA síntese de outubro tem uma característica rara: quatro casas de research em convergência explícita no posicionamento pós-fixado. O Fed elevou juros para 3,75%–4,00% em setembro, o Treasury de 10 anos ultrapassou 5% — o que gerou abertura de 20–50bps na curva americana — mas o Brasil andou na contramão: o Copom cortou a Selic de forma unânime, a curva prefixada de 10 anos fechou **62bps** no mês (BTG), e o real valorizou 0,2% contra o dólar enquanto a média das moedas latinas deprecia 3,8%. A Santander Asset projetou Selic a **13,25% ao fim de 2026** e **IPCA a 5,0%** — acima do teto da meta. Para o Vintage LP CIC, essa leitura é diretamente favorável: o carrego nominal segue elevado nos próximos trimestres, os emissores de crédito privado de grau de investimento — que dependem de balanço sólido, não de crescimento acelerado — estão bem posicionados num ciclo de queda gradual de juros com PIB crescendo 1,8%. Spreads em leve abertura, mencionados pela Santander Asset como justificativa pra postura neutra em crédito, na prática beneficiam um gestor ativo que pode comprar papel novo com prêmio melhor — o rebalanceamento ativo da carteira captura isso.\n\n**Comportamento sob estresse**\n\nFundos de crédito privado marcam a mercado. Quando spreads abrem de forma abrupta — como ocorre em eventos de crédito relevantes ou em reprificações generalizadas de risco — o patrimônio do cotista oscila negativamente, mesmo sem inadimplência real. A ausência de cobertura do FGC é um limitador estrutural: em caso de inadimplência de um emissor da carteira, não há seguro de depósito. Esses são os riscos reais desta classe. O que mitiga: a diversificação por emissor e setor, o foco em grau de investimento e o histórico de **98,56% de meses positivos em 209 meses** — o que equivale a, em média, menos de 3 meses negativos por ano ao longo de mais de 17 anos de fundo. Estresse existe; frequência é baixa e o histórico demonstra recuperação. ⚠️ Um ponto de atenção estrutural: **87% do patrimônio está alocado num único fundo investido (SANT FIRF EQUILI ADV)** — a diversificação efetiva é a deste fundo, não de múltiplas carteiras independentes. Vale checar a composição do fundo-base antes da alocação final.\n\n**Mecânica tributária**\n\nFundo de Renda Fixa aberto → **come-cotas semestral em maio e novembro** (alíquota de 15% antecipada semestralmente). Isso reduz o efeito dos juros compostos no longo prazo vs. instrumentos isentos ou sem come-cotas. IR regressivo no resgate: 22,5% até 180 dias, 20% até 360 dias, 17,5% até 720 dias, **15% acima de 720 dias**. Para horizontes acima de 2 anos com alíquota marginal final de 15%, o retorno líquido de 0,40% a.a. de taxa é competitivo frente a alternativas de crédito privado com custo duas a três vezes maior.\n\n**Comparação de classe**\n\nDentro da classe de crédito privado pós-fixado ativo, o diferencial deste fundo está em dois eixos: custo (0,40% a.a. é o teto global, o que preserva mais carrego pro cotista) e track record de longo prazo (36 meses acima do CDI, 209 meses de histórico). Fundos de crédito privado de gestão ativa comparáveis costumam cobrar entre 0,50% e 1,00% a.a. de administração, além de performance — o que implica que o alfa gerado precisa ser proporcionalmente maior só pra empatar no retorno líquido. Não estou falando de fundos específicos, mas o benchmark de custo da classe valida a eficiência do Vintage LP.\n\n---\n\n### 4. Objeções esperadas + respostas\n\n**\"Mas 87% num único fundo investido não é diversificação de verdade.\"**\nEntendo — e concordo que é o ponto mais honesto a discutir neste fundo. O que existe é a diversificação *dentro* do fundo-base (SANT FIRF EQUILI ADV), que por sua vez carrega CDBs, LFs e Debêntures de múltiplos emissores. A concentração estrutural é real e está nos dados — não vou esconder. O que ela implica: a gestão de crédito efetiva é centralizada numa única mesa, que pode agir com consistência de critério. O risco é operacional e de governance do fundo-base, não de exposição a um único emissor. Para carteiras muito grandes, vale complementar com um segundo fundo de crédito de estratégia diferente.\n\n**\"Taxa de 0,40% a.a. ainda é custo. Tenho CDB direto que não cobra nada.\"**\nMuita gente sente isso — e faz sentido olhar assim. O que o CDB direto não entrega: gestão ativa de rebalanceamento, diversificação por dezenas de emissores, liquidez D+0/D+1 sem carência e sem risco de concentração num único banco. Em 36 meses, o fundo entregou **45,71% vs CDI de 44,04%** — ou seja, gerou alfa *já líquido* da taxa de 0,40% a.a. O CDB bancário típico paga 100%–103% do CDI com risco concentrado num emissor e prazo travado. O custo de 0,40% não é despesa — é o preço da diversificação e da gestão.\n\n**\"E se a Selic não cair tão rápido quanto as casas projetam?\"**\nEssa é a melhor objeção. Se o Copom parar o ciclo mais cedo — cenário de BTG (13,75% ao fim de 2026) — o carrego pós-fixado fica elevado por mais tempo. Para um fundo CDI+, isso é bom: mais tempo de carrego alto, mais acumulação. A assimetria deste fundo é favorável em qualquer cenário de Selic dentro do range atual: se cair, o fechamento de spreads valoriza os papéis de prazo mais longo da carteira; se ficar parado, o carrego nominal segue excepcionalmente atrativo. O único cenário ruim seria um choque de crédito — que é o risco real a monitorar, não a extensão do ciclo.\n\n**\"Come-cotas prejudica demais no longo prazo vs LCI/LCA.\"**\nCorreto — LCI/LCA isenta de IR tem vantagem tributária estrutural. Mas a comparação precisa ser feita no retorno líquido real: LCI/LCA de alta qualidade costuma pagar 88%–93% do CDI (por causa do benefício tributário embutido no preço). Com a taxa global de 0,40% a.a. e o histórico de performance acima do CDI, o Vintage LP pode ser competitivo mesmo com come-cotas — especialmente em prazos acima de 2 anos quando a alíquota cai a 15%. Pra fazer a conta precisa do valor, bigo o número da sua LCI atual e a gente compara retorno líquido real.\n\n**\"Histórico de 209 meses é de um produto que talvez tenha mudado bastante.\"**\nFaz todo sentido checar. O que é verificável: a estratégia declarada é consistente com a classe (crédito privado CDI+, grau de investimento), a gestora é a Santander Asset Management com estrutura de crédito institucional, e os últimos 36 meses — período mais relevante pra calibrar o ciclo atual — mostram geração de alfa de 1,67 p.p. acumulados. O passado longo é um indicador de sobrevivência e consistência de processo; o presente recente é o indicador de relevância da estratégia atual.\n\n**\"Crédito privado está com spreads comprimidos — a Santander Asset está neutra na classe.\"**\nExatamente o que a Carta Mensal diz — e é o argumento mais técnico que um cliente pode trazer. Dois pontos: *neutro* não é negativo, é \"sem adicionar\" — a posição existente se mantém. Segundo, spreads comprimidos penalizam mais quem entra em papéis novos de longa duration; a carteira do Vintage, com rebalanceamento ativo, tende a ajustar a composição de prazo conforme o ambiente de crédito. O posicionamento neutro da casa é sobre não aumentar agressivamente a classe — não sobre desfazê-la. Para a parcela pós-fixada da carteira que já precisa existir, qualidade de gestão e custo baixo continuam sendo o critério.\n\n---\n\n### 5. Ângulo comercial por perfil API\n\n**Conservador:** ⚠️ Elegível, mas com ressalva — o come-cotas e a ausência de FGC exigem clareza sobre o perfil real de liquidez e tolerância a risco de crédito. Se o cliente entende e aceita, é uma alternativa de carrego superior ao fundo DI simples com custo baixo. Confirme suitability antes.\n\n**Moderado:** Âncora natural da parcela pós-fixada — entrega CDI+ com diversificação de crédito, custo de 0,40% a.a. e liquidez D+1, sem abrir mão de retorno. É o bloco defensivo que libera espaço pro Overweight em IPCA+ e bolsa recomendado pela Santander Asset neste mês.\n\n**Balanceado:** Aloca no pós-fixado de qualidade enquanto o restante da carteira migra gradualmente para IPCA+ longo e renda variável, conforme o modelo Santander de outubro. Cumpre o papel de liquidez ativa sem custo de oportunidade elevado.\n\n**Arrojado:** Produtividade máxima do caixa tático — dinheiro que aguarda oportunidade em bolsa ou prefixados longos fica aqui rendendo CDI+ com resgate em D+1, sem carregas de liquidez bancária. Taxa de 0,40% a.a. preserva o retorno enquanto o gestor aguarda o timing da realocação.\n\n**Agressivo:** Posição residual de liquidez estratégica — num portfólio concentrado em bolsa e ativos alternativos, o Vintage LP é o colchão de caixa que rende acima do CDI sem imobilizar capital. Ticket mínimo de R$ 100 permite ajuste fino da alocação defensiva sem comprometer a convexidade do portfólio.", "ultima_atualizacao": "2026-10-13"}];
const CLASSES = ["Alternativos", "Inflação", "Multimercados", "Prefixados", "Pós-fixados", "Renda Variável", "Renda Variável Global", "Reserva de Emergência"];
let filtroClasse = null;
let termoBusca = "";

function fmtPct(v) {
  if (v === null || v === undefined) return "—";
  return (v * 100).toFixed(2).replace(".", ",") + "%";
}
function fmtBRL(v) {
  if (v === null || v === undefined) return "—";
  return "R$ " + v.toLocaleString("pt-BR", {minimumFractionDigits: 2, maximumFractionDigits: 2});
}
function esc(s) {
  if (!s) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
// Markdown leve pro speech (títulos ###, negrito **, listas)
function mdLeve(txt) {
  if (!txt) return "";
  let h = esc(txt);
  h = h.replace(/^### (.*)$/gm, "<h3>$1</h3>");
  h = h.replace(/^## (.*)$/gm, "<h2>$1</h2>");
  h = h.replace(/^# (.*)$/gm, "<h1>$1</h1>");
  h = h.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  return h;
}

function renderFiltros() {
  const cont = document.getElementById("filtros");
  let html = `<div class="chip ${filtroClasse===null?'ativo':''}" onclick="setFiltro(null)">Todos</div>`;
  for (const c of CLASSES) {
    html += `<div class="chip ${filtroClasse===c?'ativo':''}" onclick="setFiltro('${esc(c)}')">${esc(c)}</div>`;
  }
  cont.innerHTML = html;
}
function setFiltro(c) { filtroClasse = c; render(); }

function fundoVisivel(f) {
  if (filtroClasse && f.classe_santander !== filtroClasse) return false;
  if (termoBusca) {
    const alvo = (f.nome + " " + f.gestora + " " + f.estrategia + " " + f.classe_santander).toLowerCase();
    if (!alvo.includes(termoBusca)) return false;
  }
  return true;
}

function cardHTML(f, idx) {
  let fiscal = "";
  if (f.isento_ir === true) fiscal += `<span class="tag-fiscal tag-isento">Isento IR</span>`;
  if (f.tem_come_cotas === true) fiscal += `<span class="tag-fiscal tag-comecota">Come-cotas</span>`;

  let body = `<div class="linha"><span class="k">Gestora</span><span class="v">${esc(f.gestora)||"—"}</span></div>`;
  body += `<div class="linha"><span class="k">Classe ANBIMA</span><span class="v">${esc(f.classe_anbima)||"—"}</span></div>`;
  body += `<div class="linha"><span class="k">Taxa adm</span><span class="v">${fmtPct(f.taxa_adm)}</span></div>`;
  if (f.taxa_perf) body += `<div class="linha"><span class="k">Taxa perf</span><span class="v">${esc(f.taxa_perf)}</span></div>`;
  if (f.cotizacao) body += `<div class="linha"><span class="k">Cotização</span><span class="v">${esc(f.cotizacao)}</span></div>`;
  if (f.liquidacao) body += `<div class="linha"><span class="k">Liquidação</span><span class="v">${esc(f.liquidacao)}</span></div>`;
  if (f.aplicacao_minima) body += `<div class="linha"><span class="k">Aplic. mínima</span><span class="v">${fmtBRL(f.aplicacao_minima)}</span></div>`;
  if (f.publico_alvo) body += `<div class="linha"><span class="k">Público</span><span class="v">${esc(f.publico_alvo)}</span></div>`;
  if (f.cnpj) body += `<div class="linha"><span class="k">CNPJ</span><span class="v">${esc(f.cnpj)}</span></div>`;
  if (fiscal) body += `<div style="margin-top:8px">${fiscal}</div>`;

  if (f.estrategia) body += `<div class="secao-titulo">Estratégia</div><div style="font-size:13.5px">${esc(f.estrategia)}</div>`;
  if (f.pros && f.pros.length) {
    body += `<div class="secao-titulo">Prós</div><ul class="pros pros-contras">`;
    for (const p of f.pros) body += `<li>${esc(p)}</li>`;
    body += `</ul>`;
  }
  if (f.contras && f.contras.length) {
    body += `<div class="secao-titulo">Contras</div><ul class="contras pros-contras">`;
    for (const c of f.contras) body += `<li>${esc(c)}</li>`;
    body += `</ul>`;
  }
  if (f.speech_comercial) {
    body += `<div class="secao-titulo">🎤 Speech comercial</div><div class="speech">${mdLeve(f.speech_comercial)}</div>`;
  }

  return `<div class="card" id="card${idx}">
    <div class="card-head" onclick="toggle(${idx})">
      <div>
        <div class="card-nome">${esc(f.nome)}</div>
        <div class="card-meta">${esc(f.gestora)||"—"} · taxa ${fmtPct(f.taxa_adm)}${f.speech_comercial?" · 🎤 speech":""}</div>
        <span class="badge">${esc(f.classe_santander)}</span>
      </div>
      <span class="seta">▶</span>
    </div>
    <div class="card-body">${body}</div>
  </div>`;
}

function toggle(idx) {
  document.getElementById("card"+idx).classList.toggle("aberto");
}

function render() {
  const lista = document.getElementById("lista");
  const visiveis = FUNDOS.filter(fundoVisivel);
  document.getElementById("contador").textContent =
    visiveis.length + " fundo(s)" + (filtroClasse ? " em " + filtroClasse : "");
  if (!visiveis.length) {
    lista.innerHTML = `<div class="vazio">Nenhum fundo encontrado.<br>Tente outra busca ou filtro.</div>`;
    return;
  }
  lista.innerHTML = visiveis.map((f, i) => cardHTML(f, FUNDOS.indexOf(f))).join("");
}

document.getElementById("busca").addEventListener("input", e => {
  termoBusca = e.target.value.trim().toLowerCase();
  render();
});

renderFiltros();
render();
</script>
</body>
</html>
